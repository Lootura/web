const stories = [{"title":"駅伝365：花田監督、全日本駅伝へ「少しめどが立った」 早稲田大競技会 | 毎日新聞","summary":"16年ぶりに出雲全日本大学選抜駅伝を制した早稲田大がさらなる勢いを得て2冠へ突き進む。 早稲田大競技会が17日、埼玉県所沢市の早大キャンパス内であった。 11月1日の全日本大学駅伝のエントリーメンバー入りをしている1年生の上杉敦史選手（1年）や若狭奏汰選手（1年）、瀬間元輔選手（3年）らが1万","source":"毎日新聞","author":"長宗拓弥","category":"general","url":"https://mainichi.jp/articles/20261017/k00/00m/050/217000c?utm_source=lootura.com","publishedAt":"2026-10-17T14:14:10.000Z"},{"title":"「作業中にクマに襲われた」60代男性が顔や両腕など噛まれて出血し病院に搬送 奈良・下北山村","summary":"きょう午前、奈良県下北山村の山林で土木作業員の男性がクマに襲われ、顔などを噛まれるけがをしました。 午前11時半ごろ、奈良県下北山村で「作業中にクマに襲われた」と消防に通報がありました。 警察などによりますと、クマに襲われたのは奈良県大和高田市の60代の男性で、同僚3人と土砂などをせき止めるための堰堤を造る作業をしていたということです。 男性は顔や両腕、左太ももを噛まれるなどして出血し、病院に搬送されましたが、命に別状はないとみられます。 現場は民家からおよそ500メートル離れた山林で、クマは体長150センチ位、男性を襲った後、逃げていったということです。 村は防災無線などで注意を呼びかけています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019839?utm_source=lootura.com","publishedAt":"2026-10-17T14:48:16.000Z"},{"title":"エースグレベア：開幕戦勝利のグレベア 古賀主将「SVリーグの注目度を感じる」 | 毎日新聞","summary":"創設3季目を迎えたバレーボールSVリーグ男子が17日、東京・有明コロシアムで開幕し、東京グレートベアーズが、今季初めてSVリーグに昇格した北海道イエロースターズに3―2で競り勝った。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261017/k00/00m/050/219000c?utm_source=lootura.com","publishedAt":"2026-10-17T14:13:19.000Z"},{"title":"auひかり、2027年から月額料金を値上げ","summary":"KDDIは16日、固定光インターネットサービス「auひかり」の月額利用料金を2027年1月より改定すると発表した。開通までの間5G回線を提供する「auひかりプラス」は料金改定の対象外。","source":"インプレス","author":"関根慎一","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148840.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.679Z"},{"title":"26年ぶり出場で惜敗の関西創価「積み重ねは大事と…」 秋季近畿 | 毎日新聞","summary":"高校野球の秋季近畿大会は17日、京都市のわかさスタジアム京都で1回戦が行われ、26年ぶり出場の関西創価（大阪3位）が彦根総合（滋賀1位）に0―1で惜敗した。 関西創価の小野哲平監督の試合後の主なコメントは次の通り。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261017/k00/00m/050/118000c?utm_source=lootura.com","publishedAt":"2026-10-17T08:11:49.000Z"},{"title":"ウクライナのエネルギー施設15か所以上にロシア軍攻撃 ゼレンスキー大統領が明らかに","summary":"ウクライナのゼレンスキー大統領は、ロシア軍が15か所以上のエネルギー施設に最大規模の攻撃を行ったと明らかにしました。 ゼレンスキー大統領はSNSで、16日の夜から17日の朝にかけて、ロシア軍がウクライナ各地の発電所など15か所以上のエネルギー施設に最大規模の攻撃を行ったと明らかにしました。 攻撃には320機以上のドローンに加え、巡航ミサイルや弾道ミサイルなどが使われたということです。 ゼレンスキー大統領は「ロシア軍はエネルギー施設への攻撃を強めていて、我々の備蓄や復旧能力を極限まで消耗させようとしている」と強調しました。 ウクライナではアメリカ製防空システム「パトリオット」の迎撃ミサイルが枯渇し、「直近のロシアによる攻撃では弾道ミサイルをほとんど迎撃できなかった」とアメリカメディアが報じています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019838?utm_source=lootura.com","publishedAt":"2026-10-17T14:34:37.000Z"},{"title":"拘置施設、書類確認を理由に面会断る 露の北海道新聞記者拘束 | 毎日新聞","summary":"ロシア連邦保安庁（FSB）にスパイ容疑で拘束された北海道新聞の男性特派員について、在露日本大使館は16日、モスクワ市内の拘置施設での領事面会を試みたが実現しなかったと明らかにした。露側と調整の上で大使館員が施設を訪れたが、面会できなかった。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261017/k00/00m/030/117000c?utm_source=lootura.com","publishedAt":"2026-10-17T08:03:57.000Z"},{"title":"PhotoshopなどアドビアプリがRTX Spark最適化 処理速度は最大2倍に","summary":"アドビは15日、主要アプリの「Photoshop」「Premiere」「Substance 3D」をRTX Spark向けに最適化し、AIを用いた制作ワークフローの高速化を図ったと発表した。","source":"インプレス","author":"関根慎一","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148815.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.679Z"},{"title":"交差点で右直事故 1台横転し2人が一時閉じ込められる 仙台","summary":"17日午後6時頃、仙台市太白区八木山南4丁目の交差点で、右折しようとした乗用車と直進してきた乗用車が衝突しました。 この事故で、右折しようとした乗用車が横転し、乗っていた2人が一時車内に閉じ込められましたが、2人に大きなけがはありませんでした。 警察によりますと事故当時の信号は、どちらも青だったということです。 現場は、市道が交わる交差点で警察が事故の原因を詳しく調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019836?utm_source=lootura.com","publishedAt":"2026-10-17T13:57:37.000Z"},{"title":"＜やさしく解説＞そもそも中間選挙って何? トランプ政権の行方 | 毎日新聞","summary":"米国の今後を左右する中間選挙が11月3日に迫りました。2027年1月に任期の折り返しを迎える第2次トランプ政権の政権運営や、28年の大統領選の行方に大きな影響を与えると言われています。そもそも中間選挙とは何でしょうか。今回の選挙では何が争点となり、結果は米国や世界に何をもたらすと考えられるのでしょ","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261017/k00/00m/030/031000c?utm_source=lootura.com","publishedAt":"2026-10-17T02:55:16.000Z"},{"title":"JR東海、次期新幹線「S0系」29年7月デビュー 自動運転や車内設備強化","summary":"JR東海は10月16日、東海道・山陽新幹線の次期車両「S0系」を発表した。N700S以来のフルモデルチェンジとなり、2029年7月に営業運転を開始する予定。運転士が乗務する自動運転システムを搭載するほか、グリーン車の座席や荷物置場などを充実させる。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148838.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.678Z"},{"title":"【台風情報】非常に強い台風30号（チャンパー） 22日（木）には非常に強い勢力で沖縄の南へ（17日午後10時現在）","summary":"気象庁によりますと、非常に強い台風30号（チャンパー）は、17日午後9時現在、マリアナ諸島にあって時速20キロで西に進んでいます。 中心気圧は945ヘクトパスカルで、最大瞬間風速は、秒速70メートルです。 このあと、勢力を保ちながら18日（日）午前9時頃にはマリアナ諸島付近を通過する見込みです。 その後、22日（木）まで非常に強い勢力を保ったまま、沖縄の南へと達する予想となっています。 雨風シミュレーションはこちらから チャンパーの詳細は 台風第30号(チャンパー) 2026年10月17日21時45分発表 17日（土）21時の実況 種別 台風 大きさ - 強さ 非常に強い 存在地域 マリアナ諸島 中心位置 北緯12度40分 (12.7度) 東経146度10分 (146.2度) 進行方向、速さ 西 20 km/h (11 kt) 中心気圧 945 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 25m/s以上の暴風域 全域 140 km (75 NM) 15m/s以上の強風域 全域 440 km (240 NM) 18日（日）09時の予報 種別 台風 強さ 非常に強い 存在地域 マリアナ諸島 予報円の中心 北緯13度10分 (13.2度) 東経144度00分 (144.0度) 進行方向、速さ 西 20 km/h (11 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (100 kt) 最大瞬間風速 70 m/s (140 kt) 予報円の半径 45 km (25 NM) 暴風警戒域 全域 185 km (100 NM) 18日（日）21時の予報 種別 台風 強さ 非常に強い 存在地域 マリアナ諸島 予報円の中心 北緯13度40分 (13.7度) 東経142度00分 (142.0度) 進行方向、速さ 西 20 km/h (10 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (100 kt) 最大瞬間風速 70 m/s (140 kt) 予報円の半径 65 km (35 NM) 暴風警戒域 全域 200 km (110 NM) 19日（月）21時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯15度30分 (15.5度) 東経138度00分 (138.0度) 進行方向、速さ 西北西 20 km/h (11 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (100 kt) 最大瞬間風速 70 m/s (140 kt) 予報円の半径 100 km (55 NM) 暴風警戒域 全域 250 km (135 NM) 20日（火）21時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯17度35分 (17.6度) 東経133度40分 (133.7度) 進行方向、速さ 西北西 20 km/h (12 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 予報円の半径 150 km (80 NM) 暴風警戒域 全域 310 km (170 NM) 21日（水）21時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯19度50分 (19.8度) 東経128度55分 (128.9度) 進行方向、速さ 西北西 25 km/h (13 kt) へ。そして8月の全国総体では4位に入った。予選で出した記録は64メートル96。わずか半年の間に、急成長した田下選手は陸上界で名を知られる存在となった。 全国大会での経験を経て迎えた地元・青森市での国民スポーツ大会。目標としていた頂点には届かず「応援してくれた人もいたのでそこは悔しい」。 目標はインカレ優勝 ただ、この大会は終わりではない。下半身の動きに課題も見つかった。きっと長くなるだろう陸上の競技人生。まだまだ投げたい。シーズン最後の大会を終えたばかりの田下選手は言った。「これからベストを出していけるように冬季練習をがんばりたい。大学では強い先輩がいるのでそこについていけるようにがんばる。目標はインカレで優勝」。田下選手が見据えるのは、この先、無限の可能性のある未来だ。 ◆田下紗将（たした・さすけ）2008年12月23日、青森市出身。東奥学園3年にバドミントンから競技転向。3年の全国総体で4位。自己記録は64メートル96。180センチ、70キロ。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019830?utm_source=lootura.com","publishedAt":"2026-10-17T12:39:33.000Z"},{"title":"アマゾン、日比谷で「海外ハイテク家電祭り」 セール登場の最新家電を体験","summary":"Amazonは、プライム会員限定のビッグセール「プライム感謝祭」に合わせ、海外家電・ガジェットの体験イベント「海外ハイテク家電祭り」を東京ミッドタウン日比谷にて18日までの3日間限定で開始した。開催時間は11時～20時で、入場無料。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148942.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.678Z"},{"title":"矯正施設の取り組みや挑戦を発表する「ミッションチャレンジ2026」開催 知的障害の受刑者が和太鼓演奏に取り組む長崎刑務所が大賞受賞 法務省","summary":"受刑者たちの再犯防止や立ち直りのあり方について考えてもらおうと、法務省はきょう（17日）、全国にある矯正施設の取り組みや挑戦を紹介するイベントを開きました。 去年6月、受刑者の再犯防止などに重点を置く「拘禁刑」が導入され、犯罪や非行をした人たちを収容する矯正施設を取り巻く環境は変化しています。 受刑者たちの再犯防止や立ち直りのあり方について考えてもらおうと、法務省はきょう（17日）、全国にある矯正施設の取り組みを紹介するイベントを都内で開きました。 「ミッションチャレンジ2026」と題したイベントには、矯正施設から応募のあった37件のうち10件が発表され、コンテスト形式で審査員が評価しました。 鳥取刑務所は、「鳥取しゃんしゃん祭」で使う傘の職人が不足するなか、受刑者が傘を作るなどして地域貢献をしている事例を紹介。 また、新潟少年学院は、地元企業の担当者を招いて仕事の魅力を伝え、少年たちに少年院を出た後のことを自ら考えさせる取り組みを紹介しました。 審査の結果、最高賞となる「グッドチャレンジ大賞」には、福祉法人と連携した和太鼓演奏のプログラムを通じ、知的障害のある受刑者たちの再犯防止や更生に取り組む長崎刑務所が選ばれました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019828?utm_source=lootura.com","publishedAt":"2026-10-17T12:16:24.000Z"},{"title":"世界初\"両面ソーラー\"充電の「Amazfit T-Rex Dual Solar」","summary":"Zepp Healthは、スマートウォッチ「Amazfit T-Rex Dual Solar」を10月29日に発売する。価格は109,800円。10月16日から予約を受け付ける。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148909.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.678Z"},{"title":"交通違反取り締まり中のパトカーの追跡から逃げた車 住宅街で別の車に衝突したまま逃走中 愛知県警蟹江署","summary":"きょう17日正午ごろ、愛知県蟹江町でパトカーに追跡された車が軽乗用車にぶつかり、そのまま逃げています。 警察によりますと、きょう17日（土）正午ごろ、パトカーで取り締まりをしていた警察官が蟹江町学戸7丁目の交差点で交通違反をした乗用車を見つけました。 警察官が停止を求めましたが、乗用車はこれに応じず急発進して逃げたため、パトカーで追跡。乗用車は約20秒後に現場から200メートルほど離れた住宅街の路上で軽乗用車とぶつかり、そのまま逃走しました。 軽乗用車を運転していた66歳の男性にケガはありませんでした。警察は逃げた乗用車の行方を追っています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019826?utm_source=lootura.com","publishedAt":"2026-10-17T12:08:43.000Z"},{"title":"アマゾン「プライム感謝祭」開催中 iPhone Airなどから日用品まで","summary":"Amazonのプライム会員限定セール「プライム感謝祭」が開催中です。秋を楽しむための商品をはじめ、人気ブランドや話題の商品、Amazon限定商品など、400万点以上を特別価格で販売します。期間は10月19日23時59分までですので、この週末に買い忘れがないよう、チェックしておきましょう。","source":"インプレス","author":"編集部","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148911.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.678Z"},{"title":"【J2磐田】敵地で1-1ドロー、先制も追いつかれ連勝ならず【J2リーグ第11節速報】","summary":"ジュビロは10月17日、アウェイでテゲバジャーロ宮崎と対戦し、1-1で引き分けました。 ジュビロ磐田の2026/27シーズンJ2第11節は、アウェイ・いちご宮崎新富サッカー場でテゲバジャーロ宮崎と対戦しました。 今季2度目の連勝を狙う磐田は立ち上がりの前半8分、CKのこぼれ球に反応したDF桑原航太が左足で鮮やかに決めて幸先よく先制します。 しかし前半23分に宮崎のMF家坂葉光に同点ゴールを許し、1-1で前半を折り返します。 後半に入るとホームの宮崎に主導権を握られ、防戦一方の苦しい時間帯が続きますが、DFダニーロを中心とした守備陣が体を張って追加点を許しません。 勝ち越し弾こそ奪えなかったものの1-1でタイムアップ。 敵地で勝ち点1を分け合いました。 【明治安田J2リーグ第11節=いちご宮崎新富サッカー場】 テゲバジャーロ宮崎 1(1前半1 0後半0)1 ジュビロ磐田 【宮】家坂葉光(前23分) 【磐】桑原航太(前8分)","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019827?utm_source=lootura.com","publishedAt":"2026-10-17T12:08:39.000Z"},{"title":"音声AI「Grok Voice 3.0」 応答1秒未満 テスラにも搭載","summary":"xAI(SpaceXSI)は14日、音声対話AIモデル「Grok Voice 3.0」を発表し、開発者向けの「Grok Voice API」で提供開始した。利用料金は1分あたり0.08ドル(1時間あたり4.80ドル)で、従来モデルから据え置く。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148932.html?utm_source=lootura.com","publishedAt":"2026-10-17T14:56:51.678Z"},{"title":"アニメ「花咲くいろは」の聖地 金沢・湯涌温泉でぼんぼり祭り 震災からの復旧復興を願う","summary":"石川県を舞台にしたアニメ「花咲くいろは」の聖地、金沢市の湯涌温泉では、17日、「ぼんぼり祭り」 が開かれ、訪れた人たちが作品にゆかりの深い能登の復旧復興を祈りました。 ＭＲＯのラジオ番組「あにまにあ」の西尾知亜紀パーソナリティ―が14回目を迎えた祭りを取材しました。 ぼんぼり祭りは、2011年に放送されたアニメ「花咲くいろは」の劇中に出てくる祭事を再現したものです。 作品では、湯涌温泉をはじめ、2024年の能登半島地震で大きな被害を受けた七尾市中島町にある・のと鉄道「西岸駅」などがモデルとして描かれていることから、湯涌温泉観光協会では、祭りを通じて被災地の復旧復興を支援し続けています。 アニメの主題歌きっかけに14年、「第二の故郷」 会場には、飲食店やグッズを販売する特設ブースが設けられたほか、アニメの主題歌を歌うnano.RIPEのアコースティックライブも開催され、多くの人でにぎわいました。 nano.RIPEは、「花咲くいろは」をきっかけに毎年、金沢で多くのライブを開催、ボーカルのきみコさんは、ＭＲＯラジオでも番組を持つなど石川県を“第二の故郷”として大切な場所と語ります。 nano.RIPE・きみコさん「地震の直後は報道もすごくあるのですが、時間が経って、どうしても関心が薄くなってしまうと思います。ナノライプが好きでライブに来てく れる方たちが、『じゃあ僕も私もちょっとだけだけど支援してみよう』 って動いてくれたらいいなといつも思います」 「のぞみ札」に復旧復興の願いを乗せて 玉泉湖に向かう神迎え行列 温泉街の奥にある玉泉湖では、願い事が書かれた「のぞみ札」を神様に届ける「お焚き上げ」の神事が行われました。 テレビ放送から10年以上たった今もなお、作品の聖地として多くのファンに愛される湯涌温泉。 今回の祭りは久しぶりに天気に恵まれ、訪れた人たちは、秋の風情を楽しみつつ、能登の一日も早い復旧復興を祈っていました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019345?utm_source=lootura.com","publishedAt":"2026-10-17T12:00:53.000Z"},{"title":"「日本より進んでいる」? ネパールの避難所運営、NPOが報告 | 毎日新聞","summary":"避難所にはマットが敷かれ、被災者も炊き出しに精を出していた――。ネパールの大規模土石流被災地に入ったNPO法人CODE海外災害援助市民センターの吉椿雅道事務局長（58）が神戸市で開いた報告会で現地の避難所の様子も説明した。被災者支援で世界の国々と互いに学び合う重要性を訴えた。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261015/k00/00m/310/195000c?utm_source=lootura.com","publishedAt":"2026-10-16T22:15:11.000Z"},{"title":"国立公文書館の所蔵文書をコンテンツ産業に活用してもらう試みが進行中","summary":"マチ★アソビ vol.31で、内閣府大臣官房参事官・国立公文書館次長で村上耕司さんが「国立公文書館はマチ★アソビの夢を見るか？～クリエイターのための活用術～」と題したイベントを開催しました。マチ★アソビは、今や国の成長戦略に位置づけられたコンテンツ産業の関係者が集う場であり、約180万冊の資料を収蔵する国立公文書館として、所蔵文書の活用を目指すねらいがあります。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-archives-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T14:45:00.000Z"},{"title":"元SH新垣渚さん「まずは楽しさを思い出して」少年野球教室","summary":"福岡ソフトバンクホークスのOBによる少年野球教室が錦町で開かれました。 教室には人吉・球磨の少年野球チームに所属する約100人が参加。 指導するのは、ソフトバンクOBの新垣渚さんたち5人です。 ソフトバンクＯＢ 新垣渚さん 「まずはやっぱり楽しさを思い出してもらって頑張ってほしい」 投手と野手に別れた子どもたちは、ボールの握り方や投げ方をはじめ、バッティングなどの指導を受け、熱心に練習していました。 参加者 「（ボールの）体での止め方や目線を教えてもらいました」 野球教室は、ソフトバンクのスポンサー企業である岩下兄弟が初めて開催したもので「スポーツを通じて地域を活性化したい」と話しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019761?utm_source=lootura.com","publishedAt":"2026-10-17T09:22:12.000Z"},{"title":"マチ★アソビ vol.31では眉山の上にサウナやキャンプ場が用意されている","summary":"徳島の街を舞台としたアニメやゲームの総合エンタメイベント「マチ★アソビ vol.31」では、徳島市にそびえる眉山(びざん)でも各種イベントが開催されており、山頂付近やサウナに入ったりテントを設営してキャンプしたりできます。どんな感じの雰囲気か分かるようにサウナとキャンプエリアの様子を撮影してきました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-sauna-camp-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T14:38:00.000Z"},{"title":"普段は非公開の内部へ…国宝・旧開智学校で「塔屋」特別見学会 長野・松本市","summary":"長野県松本市の国宝・旧開智学校で、普段は非公開の部分に入ることができる、特別見学会が開かれました。 いつもは閉ざされている、扉の先。 旧開智学校の「塔屋」 そこは、旧開智学校を象徴する八角形の「塔屋（とうや）」の中です。 （学芸員が天井部分にある鐘を鳴らして） 「こういう形で、子どもたちに授業の始まりや終わりを知らせていたのかなと思います」 17日は、事前に申し込んだ市民などが学芸員の案内で内部に入り、四方に色ガラスがはめ込まれたモダンな雰囲気や、塔の中からの景色を見学しました。 ■参加者： 「明治の時代に祖父がここに通っていて、いろいろなことを思いながら拝見させてもらいました」 2019年に国宝に指定された校舎は、今年で創建150年。 特別見学会は、来年も秋ごろに開催予定ということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019669?utm_source=lootura.com","publishedAt":"2026-10-17T08:07:44.000Z"},{"title":"ＩｎＭｙＬｉｆｅ・旅の途中で：マンガ家・里中満智子さん「30分の1も描けてない」自分に発破 | 毎日新聞","summary":"今年7月、世界文化遺産に登録された「飛鳥・藤原の宮都」。その舞台の一つ、藤原京を築いた持統天皇をはじめ、「考えるヒロイン」に光を当て、その苦悩や強さを丁寧に描いてきたマンガ家の里中満智子さん（78）。創作活動だけでなく、マンガ業界の発展に尽力をし続ける根底には、マンガ家の原点にも通じる揺るぎない思","source":"毎日新聞","author":"諸隈美紗稀","category":"general","url":"https://mainichi.jp/articles/20261014/k00/00m/200/208000c?utm_source=lootura.com","publishedAt":"2026-10-16T22:01:11.000Z"},{"title":"今日の断片を開く","summary":"今日という日が過去に何を残したかを一つだけ見る。ニュースではなく、文脈の小さな窓。","source":"Lootura日誌","author":"","category":"history","url":"https://ja.wikipedia.org/wiki/10%E6%9C%8817%E6%97%A5?utm_source=lootura.com","publishedAt":"2026-10-17T04:00:00.000Z"},{"title":"【鎮火】宮城・大崎市で倉庫などが燃える火事 周辺の雑木林にも延焼中","summary":"きょう午後、宮城県大崎市内で倉庫などが燃える火事があり、消火活動が続いています。 きょう午後2時20分頃、大崎市三本木坂本で「建物が燃えている」と付近を通行した人から消防に通報がありました。 消防がポンプ車など12台を出して消火を続けていますが、鎮火には至っていません。 消防によりますと、燃えたのは倉庫と納屋の2棟で周囲の雑木林にも延焼しているということです。 この火事でけがをした人や逃げ遅れた人はいないということです。 【午後５時更新】 午後４時３７分 鎮火","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019643?utm_source=lootura.com","publishedAt":"2026-10-17T08:06:54.000Z"},{"title":"謙虚さが低い男性ほど「男性は不当に扱われている」と感じて男性の権利擁護活動を支持する傾向があるという研究結果","summary":"現代では過去に比べると女性の大学進学率や就業率が高まっているとはいえ、依然として環境や待遇などさまざまな面で女性に対する不平等が残されています。一方で、一部の男性は「現代社会では男性も不当な扱いを受けている」と主張し、男性の権利を擁護しようとしています。新たな研究では、男性の謙虚さという性格特性と、男性が不当に扱われているという認識や男性の権利擁護活動への支持との関連が調査されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-men-self-views-victimized-rights-activism/?utm_source=lootura.com","publishedAt":"2026-10-17T13:00:00.000Z"},{"title":"ひきこもりへの誤解や偏見をなくす…演出家の宮本亞門さんが自らの体験を語る「まずは、それぞれが幸せになること」","summary":"宮本亞門さんらが自らの体験を語る ひきこもりへの誤解や偏見をなくそうと演出家の宮本亞門さんらが自らの体験を語るイベントが岡山市で開かれました。 「生きづらさ」から誰にでも起こりうる“ひきこもり” ひきこもり当事者の声を発信することで偏見をなくそうと厚生労働省が全国で開催しているものです。 クリエイティブプロデューサーを務める宮本亞門さんが当事者や家族など約120人を前にひきこもりの体験を話しました。パネルトークでは生きづらさから誰にでも起こりうるひきこもりについて考え社会は、支援はどうあるべきか語り合いました。 宮本さん「まずは、それぞれが幸せになること」 （演出家・クリエイティブプロデューサー 宮本亞門さん） 「『ひきこもりだから何とかしてあげなきゃ』が、かえってマイナスになることもあるんです」 「まずは『それぞれが幸せになること』そしたらその幸せを見て、『自分だって幸せになれる』とひきこもっている子も思えるんで」 イベントはオンラインでも配信され、参加者は誰もが生きやすい地域社会について見つめ直していました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019640?utm_source=lootura.com","publishedAt":"2026-10-17T08:00:10.000Z"},{"title":"ずんだもんの声になって四国めたんの中の人と会話劇を繰り広げられるリアルイベントが徳島で開催される","summary":"自分の声をずんだもんに変えて、四国めたんとの会話劇を楽しめるイベント『あなたも「ずんだもん」になれる!!四国めたんの中の人 田中小雪とVtuberごっこin マチ★アソビ』がマチ★アソビ vol.31の一環として実施されています。四国めたんは合成音声ではなく、四国めたんの中の人である田中小雪さんが隣に座って生声をあててくれるという非常に特別な体験を楽しめる素晴らしいイベントです。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-zundamon-vtuber-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T12:36:00.000Z"},{"title":"【 姫野花春（ひめの・かしゅん）(16) 】釜山国際映画祭「最優秀俳優賞」受賞に喜び 監督からのお祝いは「生のさつまいも」【 さとこはいつも 】","summary":"「映画『さとこはいつも』ティーチイン付き上映」で舞台挨拶が行われ、俳優の姫野花春さん(16)と沖田修一監督が登壇しました。 沖田修一監督・姫野花春さん 姫野花春さん 映画『さとこはいつも』は、年齢も育った環境も異なる3人の“さとこ”が自分の物語を書き始めたことをきっかけに人生を交差させていく人間模様と人生讃歌を描いた作品です。 姫野花春さんは、今回の映画で有村架純さん・石田ひかりさんと共にトリプル主演の一人を務め、今月6日から15日まで開催していた「第31回釜山国際映画祭」のコンペティション部門では史上最年少となる最優秀俳優賞(The Best Actor Award)を受賞しました。 姫野花春さん 今回の舞台挨拶冒頭でもそれを祝した花束が贈呈され、姫野さんは〝昨日(韓国の)釜山から帰ってきたんですけど、今日沖田監督に会えたのがとにかく嬉しくて。目の前には映画を見てくださった方がいて、もうこれ以上嬉しい空間はないなって感じです〟と笑顔で答えていました。 姫野花春さん 釜山国際映画祭に参加した感想を尋ねられると〝空港に着いた瞬間から釜山国際映画祭で盛り上がっていて会場の外にも皆さんがいて。（クロージングセレモニーでは）映画を皆さん観てくださった後だったので、「さとこコール」がありました〟と現地での盛り上がりを語りました。 沖田修一監督・姫野花春さん 更に〝私さつまいもが大好きなんですけど、さっき監督から大量の生のさつまいもをいただいて。「祝・最優秀俳優賞おめでとう！」って書いてあって...〟と監督からのプレゼントを暴露。これを受けて沖田監督は〝スーパーで全種類買った〟と明かし〝一個ずつなんでパッケージ違うんだろうって思いました〟という姫野さんの言葉に会場は笑いに包まれました。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019657?utm_source=lootura.com","publishedAt":"2026-10-17T07:57:18.000Z"},{"title":"「skyticket」クレカ情報も流出、カード番号など最大6140人分 「流出なし」の初報を訂正","summary":"9日の初報では「カード情報の流出はない」としていたが、その後の調査で流出を確認し、訂正した。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/17/2000002350/?utm_source=lootura.com","publishedAt":"2026-10-17T01:42:34.000Z"},{"title":"バレーボール男子SVリーグ開幕！東京GB、新加入・北海道YSとのフルセットの激闘を制し白星スタート","summary":"■バレーボール 大同生命SV.LEAGUE MEN 東京GB vs 北海道YS（17日、東京・有明コロシアム） バレーボールの国内最高峰・SVリーグの男子が17日、開幕した。3シーズン目のオープニングマッチは昨シーズン6位の東京GBが今季から新加入の北海道YSに３－2（22ー25、25ー22、19ー25、25－23、15－8）で勝利。新シーズンを幸先よくスタートさせた。 男子のレギュラーシーズンは各クラブがホーム＆アウェー方式により合計44試合を行い、レギュラーシーズン上位6クラブがチャンピオンシップに進出する。 第1セットの出だしはコザメルニク（30、スロベニア）のブロックなどでリードした東京GBだったが北海道YSのファステランド（30、ノルウェー）や張育陞（26、台湾）の強烈なサーブでレシーブが乱されると流れが一変した。連続ポイントで逆転を許した東京GBはサーブミスも重なり点差を広げられていった。副キャプテンの柳田将洋（34）やクレク（38、ポーランド）がサーブで相手の守備を乱す場面もあったが、全体的にサーブ成功率が上がらず、22－25で第1セットを落とした。 ホームのファンに開幕戦勝利を届けたい東京GB。第2セットは終盤まで競り合いが続いた。このセットは両チームともにサーブの精度が落ち、リードが広がらない。20－19から大竹壱青（30）がサーブで相手レシーブを乱すと、北海道YS・重留日向（26）のスパイクがアウトとなり2点のリードを奪う。そのあと、再び同点とされたがコザメルニクの2連続ブロックで突き放し、25－22でセットカウントをタイに戻した。 第3セットは中盤までリードを許すが、村山豪（26）が途中出場で入るとブロックを決めるなどチームを盛り立て点差を詰めていった。しかし、このあと粘り強いレシーブを見せる北海道YSにリードを広げられると、最後はクレクのスパイクがアウトとなり19－25でセットを落とした。 後がなくなった東京GBは第4セット、キャプテンでリベロの古賀太一郎（27）がボールに食らいつきチームを鼓舞する。11－10からヴィセンティン（26、アルゼンチン）のサービスエースを奪うなど連続ポイントでリードを4点とした。アジア大会・日本代表の後藤陸翔（25）や村山なども得点を重ねた。しかし、終盤、ブロックや強烈なサーブなどで崩され21－21の同点に追いつかれてしまう。それでも22－21の場面で相手のスパイクがアウトとなり2点リードとすると最後はヴィセンティンが決め切り再びセットカウントをタイに戻した。 15点先取の最終第5セット、勢いに乗る東京GBが5－3とリードを奪うと村山が1枚ブロックで相手のスパイクをシャットアウト。完全に流れを掴みリードを広げていった。東京GBがフルセットの激闘を制し、開幕戦を勝利で飾った。 ※写真は東京GB・副キャプテンの柳田将洋選手","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019434?utm_source=lootura.com","publishedAt":"2026-10-17T07:55:46.000Z"},{"title":"タイムズカー、退会後も7年間保管していた免許証画像を全削除へ 約660万アカウント分の漏えい受け","summary":"駐車場事業などを手掛けるパーク24は10月16日、グループ会社のタイムズモビリティが運営するカーシェアリングサービス「タイムズカー」で、会員登録時に提出された運転免許証などの本人確認書類の画像を、登録確認後すぐに削除するよう社内ルールを変更すると発表した。同サービスでは9月に不正アクセスが発生し、約660万アカウント分の個人情報が漏えい。うち約160万アカウント分には、本人確認書類の画像も含まれていた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/16/2000002346/?utm_source=lootura.com","publishedAt":"2026-10-17T01:16:08.000Z"},{"title":"物流を担うトラックや消防車など暮らしを守る『はたらく車』が大集合【岡山】","summary":"暮らしを支えるトラック輸送などの大切さを知ってほしいと働く車を集めた体験型のイベントが開かれました。 ▶ 【画像】イベントの様子を見る 「はたらくトラックファミリーフェスタ」には、物流を担うトラックや消防車・パトカー、自衛隊車両など暮らしを守る車が大集合しました。家族で体験しながら車の役割を知ってもらおうと、高さ約15メートルまで上がる高所作業車やマイナス20度の冷凍冷蔵車の乗車体験なども行われました。普段は間近に触れることが少ない車両がたくさん展示されていて子どもたちは楽しみながら暮らしのそばにある輸送について学んでいま した。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019443?utm_source=lootura.com","publishedAt":"2026-10-17T07:51:42.000Z"},{"title":"イベントで疲れた体と脳みそを助けてくれるマチ★アソビ vol.31限定コラボクレープを食べてきた","summary":"トータル100以上のイベントで埋め尽くされたマチ★アソビ vol.31に全力で参加していると、体も頭もへろへろになってしまいます。あまりにも疲れてなにか食べないともうダメかもしれないというとき、新町川ボードウォーク沿いに出店していたクレープ屋さんにマチ★アソビ vol.31限定だという2種類のコラボクレープがあったので、買ってきて食べてみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-crepe-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T10:40:00.000Z"},{"title":"警視庁の防犯イベントでタレントの山之内すずさんが一日防犯アンバサダー 防犯アプリ『デジポリス』の利用を呼びかけ 東京・調布市","summary":"きょう（17日）、東京・調布市でタレントの山之内すずさんが参加する防犯イベントが行われ、特殊詐欺への注意が呼びかけられました。 山之内すずさん 「防犯は自分で対策できることもたくさんあります」 きょう、東京・調布市で行われた警視庁のイベントで、タレントの山之内すずさんが一日防犯アンバサダーに任命され、特殊詐欺などの被害防止を訴えました。 警視庁によりますと、東京都内の今年1月から8月までの特殊詐欺の被害額はおよそ484億7000万円と、過去最多となった去年を上回るペースで増加しています。 イベントでは、山之内さんが来場者とともに特殊詐欺の電話に多く使われる国際電話などの着信をブロックできる防犯アプリ『デジポリス』をダウンロードしながら、利用を呼びかけました。 警視庁生活安全部の阿波拓洋部長は「大規模な情報漏洩事案も連続しています。皆さんの個人情報がすでに流出してしまっているという前提で対策をしていくことが大切で、電話もメールもすべて、まずは疑ってかかることをお願いしたい」と話しました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019646?utm_source=lootura.com","publishedAt":"2026-10-17T07:43:23.000Z"},{"title":"BASE子会社の漏えい、約2335万人分に 209万人分はクレカ番号「先頭6桁と下4桁」「有効期限」も","summary":"約2335万6000人分の情報が漏えいしたと公表した。うち約209万6900人分には、カード名義、カード番号の一部（先頭6桁と下4桁）、有効期限が含まれていた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/17/2000002349/?utm_source=lootura.com","publishedAt":"2026-10-17T00:32:41.000Z"},{"title":"【警報級大雨のおそれ】気象庁の週間天気予報(10月18日～10月24日) 低気圧の影響で北日本で荒天に 台風30号の影響は？今後の雨風シミュレーション【気象庁17日発表】","summary":"気象庁が10月17日に発表した、週間天気予報（10月18日～10月24日）によりますと、期間中は全国的に曇りや雨の日が多くなる見込みです。 特に21日から22日頃にかけて、北日本では低気圧の影響で荒れた天気となる恐れがあり、沖縄・奄美では台風30号の影響による高波に警戒が必要です。 北日本は荒天、沖縄・奄美は高波に警戒 気象庁によりますと、21日から22日頃は、北日本では低気圧の影響で荒れた天気となる見通しです。低気圧の発達の程度によっては大しけや大荒れとなる恐れがあります。 また、21日は前線の活動の程度などにより、北日本では警報級の大雨となる恐れがあります。 沖縄・奄美では、21日から22日頃に台風30号の影響で波が高くなる見込みです。台風の進路等によっては大しけとなる恐れがあるため、警戒をお願いします。 期間中の気圧配置の推移 期間中、日本付近の天気は周期的に変化する見込みです。 20日は、前線が日本の東から対馬海峡付近にのびるでしょう。 21日から22日にかけては、前線が本州付近を南下し、低気圧が発達しながら日本海北部からオホーツク海へ進む見通しです。 22日から23日にかけては、高気圧が日本海から日本の東に移動します。 その後、23日から24日にかけては、前線が東日本から西日本付近を北上する見込みです。 各地の天気 北日本は、曇りや雨の降る日が多いですが、20日と23日は晴れる所があるでしょう。 東日本は、期間を通して曇りや雨の降る日が多い見込みです。 西日本も、曇りや雨の降る日が多いですが、22日は晴れる所がありそうです。 沖縄・奄美は、20日は晴れる所が多いものの、その後は曇りや雨の降る日が多くなる予報です。 台風30号に関する情報を含め、最新の早期注意情報や気象情報にご注意ください。 台風30号の動きは？ 17日15時の実況 種別 台風 大きさ - 強さ 強い 存在地域 マリアナ諸島 中心位置 北緯12度30分 (12.5度) 東経147度20分 (147.3度) 進行方向、速さ 西 25 km/h (14 kt) 中心気圧 960 hPa 中心付近の最大風速 40 m/s (80 kt) 最大瞬間風速 60 m/s (115 kt) 25m/s以上の暴風域 全域 110 km (60 NM) 15m/s以上の強風域 北側 440 km (240 NM) 南側 330 km (180 NM) 18日03時の予報 種別 台風 強さ 非常に強い 存在地域 マリアナ諸島 予報円の中心 北緯13度05分 (13.1度) 東経145度05分 (145.1度) 進行方向、速さ 西北西 20 km/h (11 kt) 中心気圧 955 hPa 中心付近の最大風速 45 m/s (85 kt) 最大瞬間風速 60 m/s (120 kt) 予報円の半径 45 km (25 NM) 暴風警戒域 全域 165 km (90 NM) 18日15時の予報 種別 台風 強さ 非常に強い 存在地域 マリアナ諸島 予報円の中心 北緯13度30分 (13.5度) 東経143度00分 (143.0度) 進行方向、速さ 西 20 km/h (10 kt) 中心気圧 950 hPa 中心付近の最大風速 45 m/s (90 kt) 最大瞬間風速 65 m/s (130 kt) 予報円の半径 65 km (35 NM) 暴風警戒域 全域 190 km (105 NM) 19日15時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯15度10分 (15.2度) 東経139度05分 (139.1度) 進行方向、速さ 西北西 20 km/h (10 kt) 中心気圧 940 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 予報円の半径 100 km (55 NM) 暴風警戒域 全域 250 km (135 NM) 20日15時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯17度30分 (17.5度) 東経134度55分 (134.9度) 進行方向、速さ 西北西 20 km/h (12 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 予報円の半径 150 km (80 NM) 暴風警戒域 全域 310 km (170 NM) 21日15時の予報 種別 台風 強さ 非常に強い 存在地域 フィリピンの東 予報円の中心 北緯19度50分 (19.8度) 東経129度55分 (129.9度) 進行方向、速さ 西北西 25 km/h (13 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 予報円の半径 185 km (100 NM) 暴風警戒域 全域 370 km (200 NM) 22日15時の予報 種別 台風 強さ 非常に強い 存在地域 沖縄の南 予報円の中心 北緯21度00分 (21.0度) 東経127度10分 (127.2度) 進行方向、速さ 西北西 15 km/h (7 kt) 中心気圧 935 hPa 中心付近の最大風速 50 m/s (95 kt) 最大瞬間風速 70 m/s (135 kt) 予報円の半径 220 km (120 NM) 暴風警戒域 全域 430 km (230 NM)","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019642?utm_source=lootura.com","publishedAt":"2026-10-17T07:39:12.000Z"},{"title":"「すんだもんの阿波おどり」「ゆりねを現地調達する邪神ちゃん」などスーパーなイベント「スーパーきぐるみグリーティング」に参加してきたよレポート","summary":"徳島の街全体を使って行われるアニメやゲームの総合イベント「マチ★アソビ vol.31」の一環として、きぐるみたちが可愛さを主張し阿波おどりを披露するイベント「スーパーきぐるみグリーティング」が開催されました。「邪神ちゃんインパクト」「パグ太郎」「ほっぺちゃん」「ずんだもん」「キクーン」が登場し、大盛り上がりのイベントとなりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-super-kigurumi-greeting-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T09:37:00.000Z"},{"title":"ライブ前乗り【 中川翔子 】徳島グルメ満喫 マチ☆アソビに出演決定〝いっぱい歌うよ頑張ります！〟","summary":"歌手・タレントの中川翔子さんが自身のインスタグラムで、徳島県のグルメを満喫している様子を投稿しています。 中川翔子さんのインスタグラム投稿より 中川翔子さんのインスタグラム投稿より 翔子さんは17日「徳島県にきました！」と投稿。きょう17時半から「マチ☆アソビ」にライブ出演するとのことで「いっぱい歌うよ頑張ります！きてね！」と呼びかけています。 中川翔子さんのインスタグラム投稿より 中川翔子さんのインスタグラム投稿より そして翔子さんは「贅沢に前乗りして徳島グルメを堪能させていただきました！」とテキスト。居酒屋で撮影した写真には「すだちをしぼった鯛！あわお鳥の唐揚げ！」「鯛茶漬け！いくら！牛たたき！」「空気もおいしくて徳島激ラブ！」と大絶賛のテキストで紹介しています。 中川翔子さんのインスタグラム投稿より 翔子さんは「歌がある人生になれて幸せと毎日思います」「歌は最高の財産だ」と感慨深げに綴り、同席しているレコード会社の方との思い出話も掲載。「感謝を大切に今日張り切って歌います！」「徳島絶対また来ます！」と、元気いっぱいに伝えています。 マチ☆アソビとは、2009年10月に第一回としてスタートした「徳島のマチと自然とアニメが融合した唯一無二のエンターテインメント」と謳うイベント。17日開催の今回で31回目を迎えています。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019304?utm_source=lootura.com","publishedAt":"2026-10-17T02:48:34.000Z"},{"title":"ファンタジーに登場するような武器屋がマチ★アソビで賑わう徳島市に期間限定で開店したので超巨大な斧やキラキラ光る短剣やでっかい魔法陣を見てきました","summary":"2026年10月17日(土)・18日(日)と二日間にわたって開催される「マチ★アソビ vol.31」は徳島市内広域でアニメ・マンガ・ゲームのイベントが開催されます。これに合わせて、徳島市駅前にある商業ビル「アミコ」で「武器屋」が10月17日～18日の期間限定で開店するというので実際に見に行ってきました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-bukiya-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T08:45:00.000Z"},{"title":"山廃仕込みを広めた「酒造りの神様」石川・能登町出身の杜氏・農口尚彦さん“吟醸造り”人間国宝第１号へ","summary":"伝統芸能や工芸の分野で高い技術を持つ国の重要無形文化財保持者、いわゆる「人間国宝」に新たに「吟醸造り」の分野が追加される見込みとなりました。 その第一号として日本酒造りの杜氏で知られる石川県能登町出身の農口尚彦さんが認定されることとなりました。 酒の試飲「...いいね、うまい」 能登町出身の農口尚彦さん93歳。今も酒造りの最高責任者、杜氏を務めています。 伝統の技「山廃仕込み」を復活させ広める 28歳で杜氏となって以降、天然の乳酸菌を用いて時間をかけながら酒の土台を造る製法の一つ「山廃仕込み」を世に広め、日本酒ブームを牽引するとともに後進の育成にも尽力してきました。 ◇農口尚彦さん...「私に風向きが向いたかなという感じ。この歳になってから人間国宝という最大の賞を頂くというのは本当にありがたい話です」 全国新酒鑑評会で金賞を受賞すること26回。2006年には現代の名工にも認定され、2年後には黄綬褒章を受章します。 ◇農口尚彦さん...「日本酒に関わる職人として費やしてきたのがやはり大きかったのではないかなと言う感じがしている」 本来の日本酒の造り、後世に伝えたい 職人の世界で、惜しげもなく、後輩たちに自分の技を伝え続けてきた農口さん。 そこには、効率重視の機械化が進むなかで技術を守るという信念がありました。 ◇農口尚彦さん...「機械になるとガラッと酒が変わります。本来の日本酒の造りを後世に伝えていきたいというのが、わしの思いなので。現場を教えて、現場の後は理論も教える」 もともと酒が飲めない体質だったため、発酵について学び続けた農口さん。 90歳を過ぎた今でも、酒造りにかける情熱は変わりません。 ◇試飲する農口さん...「味はいいわ。でも香りがちょっと老香(ひねか)があるね。老香がちょっとする」 甘味ではない、旨味のある酒を 最近は香りが重視されるなか、昔の日本酒には複雑な味わいがあったと話します。 ◇農口尚彦さん...「米の旨味を感じさせる。それでいて軽いですね」「甘みではない。旨味ですね。」 今年も始まる酒造りを前に農口さんの意欲は十分です。 ◇農口尚彦さん...「飲んでおいしい、しかもキレが良い酒を造りたいと思います。」","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3018531?utm_source=lootura.com","publishedAt":"2026-10-17T02:46:25.000Z"},{"title":"およそ500本のイベントを司会してきたアニプレックス・高橋祐馬プロデューサーによる「司会者育成プロジェクト お披露目会」をマチ★アソビ vol.31で見てきたよレポート","summary":"徳島県で開催された「マチ★アソビ vol.31」で、アニプレックスのアニメ制作プロデューサーである高橋祐馬さんによる「アニプレックス高橋祐馬 司会者育成プロジェクト お披露目会」が行われました。これまで様々なイベントで司会を務めてきた、株式会社アニプレックスの名プロデューサーである高橋さんがプロデュースする新企画「司会者育成プロジェクト」とはどんなものなのかを知るべく、イベントを覗いてきました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-takahashi-yuma-mc-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T05:45:00.000Z"},{"title":"【気象】蒜山は深まる秋の朝 瀬戸内地方の最高気温は平年よりも2～3℃ほど高くなる見込み","summary":"岡山・香川はおおむね晴れています。岡山県北では木々が色づき始め秋が深まっています。 きょう（17日）午前8時ごろの蒜山高原です。鮮やかな緑の中でところどころ木々が色づき始め秋の深まりを感じさせてくれます。 けさの最低気温は新見市の千屋で9．2℃と10℃を下回りましたが、岡山市北区で14℃高松市で14．5℃となるなどおおむね10月上旬から中旬並みで、本格的な冷え込みはこれからとなりそうです。 瀬戸内地方は移動性の高気圧に覆われて全般に晴れていて、このあとも日差しが良く届いて気温があがり、最高気温は平年よりも2℃から3℃ほど高くなる見込みです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019296?utm_source=lootura.com","publishedAt":"2026-10-17T02:43:16.000Z"},{"title":"排水溝のネット、フタに付けちゃえばよかったんだ","summary":"2024年2月16日の記事を編集して再掲載しています。これ1枚で心もスッキリ。台所の流しにある排水溝ですが、ゴミ受け（水切りカゴ）にネットをかけて生ゴミを受け止めている人は多いと思います。軽く絞れば水切りができ、そのまま捨てられますもんね。…","source":"ギズモード・ジャパン","author":"岡本玄介","category":"technology","url":"https://www.gizmodo.jp/article/haisuiko_net_clean-sbl/?utm_source=lootura.com","publishedAt":"2026-10-17T14:00:00.000Z"},{"title":"【クマ出没】目の前を横断するクマをドライバーが目撃し110番「体長約1.5mのクマが出た」約200ｍ先に住宅、警察はパトカーで警戒 北海道倶知安町","summary":"10月17日午前、北海道倶知安町で道路を横断するクマ1頭が目撃されました。警察は付近をパトロールするなど注意を呼び掛けています。 クマが目撃されたのは、倶知安町岩尾別の道道・蘭越ニセコ倶知安線です。 10月17日午前9時50分ごろ、通りかかったドライバーの50代男性が目の前を右から左に横断するクマ1頭を目撃し「運転中にクマが出た」などとその場から110番通報しました。 クマは体長約1.5メートルで道路を横断したあと、姿が見えなくなったということです。 警察によりますと、これまでに人が襲われたり、建物や作物が荒らされたりする被害は確認されていません。 現場から200メートルほど離れた場所には住宅があり、警察は付近をパトロールするなど、警戒活動を続けています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019298?utm_source=lootura.com","publishedAt":"2026-10-17T02:37:27.000Z"},{"title":"積読（つんどく）のハードルがめちゃくちゃ下がる。「出版社が考えた本棚」が画期的だった","summary":"出版社が開発した積読（つんどく）解消アイテム「積読ホルダー」のレビュー。インテリアに馴染む美しいデザインや、読みたい本にすぐアクセスできる便利な機能で読書習慣がはかどる理由をご紹介します。","source":"ギズモード・ジャパン","author":"ますえい","category":"technology","url":"https://www.gizmodo.jp/article/2610-cross-media-tsundoku-holder/?utm_source=lootura.com","publishedAt":"2026-10-17T13:30:00.000Z"},{"title":"【速報】「山から火が見える」長崎県対馬市で林野火災 1人が手にやけど 現在も消火活動中（17日午前11時現在）","summary":"17日午前10時41分頃、長崎県対馬市上対馬町泉で「山から火が見える」と近隣住民から119番通報がありました。 消防によりますと、芝生の草が燃えているということで、この火事で1人が手にやけどを負ったということです。 現在、消防が消火活動を行っています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019258?utm_source=lootura.com","publishedAt":"2026-10-17T02:24:02.000Z"},{"title":"無料でOpenStreetMapの地図データをスマホから何でも編集できるフル機能の地図エディタ「Vespucci」","summary":"「Vespucci」はAndroidデバイス上で動作するOSM(OpenStreetMap)エディタの草分け的存在です。オンライン・オフライン双方に対応しており、OSMの編集作業をモバイル環境で包括的に行うことができます。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-vespucci/?utm_source=lootura.com","publishedAt":"2026-10-17T03:00:00.000Z"},{"title":"【 ALS闘病 】声優・津久井教生さん「地震速報に驚かされました〜」「呼吸器と吸引器を使用している身としては 怖いのは停電ですね～」【ニャンちゅう】","summary":"ＮＨＫの『ニャンちゅうワールド放送局』の『ニャンちゅう』役などを務め、現在、ＡＬＳ（筋萎縮性側索硬化症）で闘病中の声優・津久井教生さんが10月16日、自身の公式ブログを更新。地震について綴りました。 津久井教生さん 公式ブログより 津久井さんは16日に生じた緊急地震速報の取り消しについて触れ「緊急地震速報が部屋に鳴り響きました」「何事もなくて良かったです」と投稿。続けて「すぐにＴＶをつけたら日本地図の関東から上が真っ赤になっていて 震度7とか驚く情報が飛びこんで来たので ベッドの上で身構えました」と、当時の状況を振り返りました。 津久井教生さん 公式ブログより 津久井さんは大地震への不安について「呼吸器と吸引器を使用している身としては 怖いのは停電ですね～ 発電機も準備して呼吸器も充電器付きだけど〜 やはり災害は避けたいですね」と、記しています。 津久井教生さん 公式ブログより 津久井さんが2019年10月にALSへの罹患を公表してから7年が経ちました。10月3日の投稿では、「確かにどんどん出来なくなって不便な事は多くなりました でも私は罹患当初からと変わらずに今出来る事を続けています これが大切なんですね～」と率直な気持ちを記しています。 津久井教生さん 公式ブログより 津久井さんは現在、パソコンの『視線入力』などの最新技術を駆使し、ブログなどを通じて、ALSを広く知ってもらう発信を続けています。 津久井教生さん 先日のTBSのインタビューでは、ブログでの発信について「ブログなどのSNSは、私の大切な自分発信の場所です。そして、私としては『楽しんで書けたら』などと書き手魂に火がついてしまうのでした。」「喜怒哀楽が、しっかりと顔にも出てしまうタイプの私ですから『自分が一番楽な感情』でいたいのです。」「その『楽な』イコール『笑顔』が見える文章がいいなぁーなどと理想を追いかけつつ、 時に我慢の限界や容量の限界を超えたら、その時はドーンと読者の皆さんに甘えたいと図々しく思っています。」と語っていました。 津久井教生さん 津久井さんは、1992年からNHK教育テレビ（現・Eテレ）で放送が始まった『ニャンちゅう』シリーズのキャラクター「ニャンちゅう」の声を初回から30年以上にわたって演じてきました。それ以外にも『ちびまる子ちゃん』の「関口くん」役、『ご近所物語』の「西野ジロー」役、『忍たま乱太郎』の「楽呂須太夫」役など、数多くの人気作品で声優を務めてきました。過酷な病と向き合いながらも発信を続けるその姿は、多くの人々に勇気を与えています。 津久井教生さん 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019255?utm_source=lootura.com","publishedAt":"2026-10-17T02:23:20.000Z"},{"title":"1本でPCとスマホを同時に急速充電。Ankerの二股ケーブル使ってみた","summary":"身の回りのガジェットが増えるにつれて、充電管理は煩雑になる一方です。できれば、ケーブル類などのゴチャゴチャするものは、スッキリさせたいところでしょう。 Ankerの「USB-C ＆ USB-C ケーブル（2-in-1, 140W）」は、2-in-1充電ケーブル。1本で2台同時充電を可能にしてくれるアイテムです。","source":"ギズモード・ジャパン","author":"田中宏和","category":"technology","url":"https://www.gizmodo.jp/article/300052-2610-amazon-anker2in1usbcable-smi/?utm_source=lootura.com","publishedAt":"2026-10-17T12:55:00.000Z"},{"title":"桜島で噴火、噴煙高さ1600m 灰は鹿児島市街地方向などへ【きょう・あすの降灰予想】","summary":"鹿児島地方気象台によりますと、桜島の南岳山頂火口で17日午前10時55分、噴火が発生しました。 噴煙が火口から1600メートルの高さまで上がりました。噴煙の量は「中量」で、灰は火口から南西の方向に流されています。 このあと噴火が発生した場合の降灰予想 【このあと噴火が発生した場合の降灰予想】 きょう17日:火口から西の鹿児島市街地方向 あす18日の午前0時～午前6時:火口から北西の鹿児島市吉野方向 【降灰が予想されるエリア】 鹿児島市、日置市、南さつま市、南九州市、いちき串木野市、薩摩川内市、阿久根市、出水市、姶良市 桜島は噴火警戒レベル3「入山規制」が継続しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019249?utm_source=lootura.com","publishedAt":"2026-10-17T02:20:43.000Z"},{"title":"「マチ★アソビ vol.31」開幕、参加コンテンツ数は100以上で2日間にわたり徳島のマチをアソビ尽くす","summary":"徳島をアソビ尽くすイベント「マチ★アソビ vol.31」が開幕し、徳島市の藍場浜公園で開会式が行われました。","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-opening-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T02:16:00.000Z"},{"title":"北朝鮮がAIを導入した新型魚雷兵器システムの発射実験を実施 北朝鮮メディア報道","summary":"北朝鮮がAIの技術を取り入れた新型魚雷の発射実験を行いました。 北朝鮮の「朝鮮中央通信」は、きょう、国防科学院やミサイル総局などがおととい、新型の超高速魚雷システムの発射実験を行ったと伝えました。 「新型魚雷の目標探索および誘導能力にAI技術が導入された」とし、実験によって「推進効率を高める技術とロケット推進装置の性能が立証された」と強調しています。 北朝鮮は3日に「中距離戦略ミサイル」の発射訓練を行った際にも、「AIを導入している」などと主張しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019250?utm_source=lootura.com","publishedAt":"2026-10-17T02:16:24.000Z"},{"title":"1万円台で120Hz、GooglePlay対応。こいつFireタブレットを滅ぼす気かよ… | ギズモード・ジャパン","summary":"Fireタブレット難民必見！1万円台で120Hzの高リフレッシュレートとGooglePlayに対応したシャオミの「REDMI Pad 2」の魅力を紹介します。","source":"ギズモード・ジャパン","author":"小暮ひさのり","category":"technology","url":"https://www.gizmodo.jp/article/2610-redmi-pad-2-fire-tablet-alternative/?utm_source=lootura.com","publishedAt":"2026-10-17T12:00:00.000Z"},{"title":"【交通情報】「なにわ淀川花火大会」にともない阪急で臨時列車運行 「神戸線」「宝塚線」「京都線」でダイヤ変更 十三駅では臨時改札口設置","summary":"阪急電鉄は、10月17日（土）に開催される「なにわ淀川花火大会」にともない、「神戸線」「宝塚線」「京都線」では臨時列車運行のため、一部ダイヤが変更されるということです。 花火大会が中止になった場合、臨時列車の運転も中止する場合があるということです。 また、発着時刻変更のため、他交通機関との接続時刻が変更になる可能性があるということです。 なにわ淀川花火大会当日は十三駅で臨時改札口が設けられます。西改札口側の1号線ホーム、2・3号線ホーム、東改札口側では、東改札口付近と6号線ホームに臨時改札口が開かれます。 各臨時改札口の営業時間は午後3時からとなっています。 阪急電鉄は、花火大会当日は東・西改札口付近がかなりの混雑が見込まれることから待ち合わせなどはしないよう呼びかけています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019108?utm_source=lootura.com","publishedAt":"2026-10-16T22:00:48.000Z"},{"title":"iPhone Duo、結局どう？ スペック・価格・発売日をガッツリおさらい","summary":"さぁ、買いますか。買いませんか。Appleが満を持してリリースした折りたたみスマホ、iPhone Duo（デュオ）。業界定番のFoldを使わず、二人組やペアを意味する単語を持ってきたあたり、Appleらしいなぁと思いませんか？それではスペッ…","source":"ギズモード・ジャパン","author":"ヤマダユウス型","category":"technology","url":"https://www.gizmodo.jp/article/fold-iphone-rumor/?utm_source=lootura.com","publishedAt":"2026-10-17T11:55:00.000Z"},{"title":"鳴子ダム管理のための水位観測施設の電源ケーブル約50ｍ盗まれる 宮城・大崎市","summary":"17日午後、宮城県大崎市の鳴子ダムの管理に使う水位観測施設の電源ケーブルが切断され、盗まれているのが見つかりました。 17日午後2時頃、大崎市の鳴子ダムが設置している「大谷川水位観測所」で、取得したデータをダムの管理所へ送信する施設の電源ケーブルが切断され、盗まれているのを職員が発見しました。 管理所によりますと、盗まれたケーブルは直径13ミリ長さおよそ50メートルでもともと地中に埋まっていたため、何者かが地中に繋がるふたを工具を使って開け、犯行に及んだとみられています。 16日午後7時頃、電源にトラブルが発生したことを知らせるアラートが出たため、職員が調査したところ発覚したということです。 ケーブルの切断によって予備の電源に切り替わったため、鳴子ダムの操作・運用に影響は出ていません。管理所は警察に通報するとともに防犯カメラの設置を検討しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019107?utm_source=lootura.com","publishedAt":"2026-10-16T21:58:38.000Z"},{"title":"混雑終了のお知らせ。3,420円でキーボードの下を収納スペースに | ギズモード・ジャパン","summary":"LOEのリストレストデスクオーガナイザーでキーボードの下を収納スペースに。3,420円でデスク周りをすっきり整理できる便利なアイテムをご紹介します。","source":"ギズモード・ジャパン","author":"小暮ひさのり","category":"technology","url":"https://www.gizmodo.jp/article/2610-loe-keyboard-desk-organizer/?utm_source=lootura.com","publishedAt":"2026-10-17T11:00:00.000Z"},{"title":"NY原油 1バレル＝100ドルを再び突破 9月中旬以来約1か月ぶりの高値","summary":"ニューヨーク原油市場で先物価格が1バレル＝100ドルを突破し、1か月ぶりの高値をつけました。 16日のニューヨーク原油市場では、中東やウクライナで緊迫した情勢が続いていることなどを背景に、原油供給への不安から買い注文が膨らみ、国際的な指標となるWTI原油先物価格が1バレル＝100ドルを突破し、一時、101ドル台まで上昇しました。 7営業日連続の値上がりで、9月中旬以来およそ1か月ぶりの高値です。 今月に入って、ホルムズ海峡で船舶への攻撃が相次いでいるほか、ウクライナもロシアの製油所に大規模な攻撃を行っていて、戦闘の激化への懸念から、市場では原油価格のさらなる上昇を懸念する声も出ています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019106?utm_source=lootura.com","publishedAt":"2026-10-16T21:53:23.000Z"},{"title":"「マチ★アソビ vol.31」全記事一覧まとめ","summary":"西日本最大級のアニメイベント「マチ★アソビ vol.31」が徳島市で開幕しました。会期は2026年10月17日(土)・18日(日)の2日間で、ステージや映画館で開催される催しだけでもおよそ100に上り、パラソルブースなどでも無数のイベントが予定されています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-summary-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-17T01:00:00.000Z"},{"title":"ローマ教皇レオ14世がロシア・プーチン大統領と電話会談 ウクライナ・へルソン州オレシュキの人道危機に深い懸念表明 人道支援のための停戦求める","summary":"ローマ教皇レオ14世はロシアのプーチン大統領と電話会談を行い、ロシアが占領するウクライナ南部へルソン州オレシュキの人道危機に深い懸念を表明し、人道支援のための停戦を求めました。 ローマ教皇庁によりますと、教皇レオ14世は16日、プーチン大統領と電話会談を行い、ロシアが占領するウクライナ南部のへルソン州オレシュキが人道支援を必要とする深刻な状況にあるとして、深い懸念を表明。食料や医療の支援と住民の安全な退避のために停戦を求めました。 また、教皇レオ14世は、教皇庁が対話と和平の実現に向けて取り組む考えを改めて強調したということです。 ウクライナメディアによりますと、オレシュキはロシアによる侵攻初期に占領され、現在はおよそ2000人の住民が孤立し、食料などの支援が届かない状態が続いているということです。 教皇レオ14世は13日に肺腺がんの手術を受け、ローマの病院に入院中で、16日は病院でミサも執り行い、教皇庁が手術後初めてとなる写真を公開しました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019105?utm_source=lootura.com","publishedAt":"2026-10-16T21:45:41.000Z"},{"title":"モバ充にCIO「SMARTCOBY SLIM II」を購入 Galaxy S26 Ultraのケース選びで苦戦【いつモノコト】","summary":"8月頃にGalaxy S26 Ultraを使い始めてから、外出時の充電用に薄型のマグネット式モバイルバッテリーが欲しくなりました。","source":"インプレス","author":"株式会社インプレス","category":"technology","url":"https://www.watch.impress.co.jp/docs/series/itsmo/2146463.html?utm_source=lootura.com","publishedAt":"2026-10-17T00:30:00.000Z"},{"title":"東海道新幹線「のぞみ」東京～新大阪間で約700円の値上げへ 来年7月の購入分から","summary":"新幹線の「のぞみ」と「みずほ」が値上げになります。 JR東海は、東海道新幹線「のぞみ」の指定席特急料金を来年7月1日の購入分から値上げすると発表しました。東京から新大阪までではおよそ700円高くなり、普通車の場合、運賃とあわせて1万5420円となります。 また、グリーン料金は、来年12月15日からさらに3000円を追加で値上げします。 東海道新幹線と直通する山陽新幹線の「みずほ」でも同様の変更が行われる予定です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019043?utm_source=lootura.com","publishedAt":"2026-10-16T15:56:55.000Z"},{"title":"Switch 2版『モンハンワイルズ』が12月6日発売。事前予約なら14%OFF","summary":"Amazonでは『モンスターハンターワイルズ デラックスエディション』Switch 2版がが事前予約14％オフ。クロスプレイ対応や予約特典の詳細を解説します。","source":"ギズモード・ジャパン","author":"カタオカ キヨシ","category":"technology","url":"https://www.gizmodo.jp/article/monster-hunter-wilds-switch2-preorder/?utm_source=lootura.com","publishedAt":"2026-10-17T10:15:00.000Z"},{"title":"クラフティアが天神地区で清掃活動","summary":"福岡市の中心部で、電気設備大手の社員らによる恒例の清掃活動が行われました。 16日、福岡市の天神地区で行われた清掃活動にはクラフティアの社員らおよそ40人が参加しました。 参加者は、キャナルシティ博多の周辺や天神中央公園でペットボトルやタバコの吸い殻などを拾い集めました。 クラフティアでは1969年から毎年この時期を「さわやかコミュニティ旬間」と位置づけています。 全国の拠点で一斉清掃を行っていて、今年の活動は23日まで続けられる予定です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019044?utm_source=lootura.com","publishedAt":"2026-10-16T15:56:39.000Z"},{"title":"Appleが未発表の「iPad mini(第8世代)」の存在をうっかりお漏らしか","summary":"AppleはOLED(有機EL)ディスプレイを採用した新型「iPad mini(第8世代)」を2026年10月末に発表するとウワサされています。新たに、Apple公式の規制情報掲載サイト経由で、同社が新型iPad miniを準備している可能性が明らかになりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-apple-website-hinted-ipad-mini-8/?utm_source=lootura.com","publishedAt":"2026-10-17T00:00:00.000Z"},{"title":"ホワイトハウス新報道官 弁護士資格を所持していないことを認める","summary":"今週、新たに就任したホワイトハウスのザカリア報道官。弁護士資格の詐称の疑いが浮上していましたが、15日、FOXニュースの番組に出演し、弁護士を自称していたものの、資格を所持していないことを認めました。 そのうえで、「トランプ大統領が求めた職務に全力を尽くす」として、報道官を辞任する考えがないことを強調しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019045?utm_source=lootura.com","publishedAt":"2026-10-16T15:54:28.000Z"},{"title":"折りたたみキーボードの決定版！ タブレットのPC化は20％OFFの「B11 Pro」で完成する","summary":"タブレットをノートPC化する折りたたみキーボード「Keychron B11 Pro」の魅力をご紹介。Alice配列で快適なタイピングを実現し、今なら20%OFFでお得に手に入ります。","source":"ギズモード・ジャパン","author":"小暮ひさのり","category":"technology","url":"https://www.gizmodo.jp/article/2610-b11-pro-folding-keyboard/?utm_source=lootura.com","publishedAt":"2026-10-17T10:00:00.000Z"},{"title":"【速報】ロシアによる北海道新聞記者拘束 モスクワの拘置所訪問も領事面会実現せず","summary":"ロシア当局に北海道新聞の日本人記者が拘束された問題で、さきほど記者が拘留されているモスクワのレフォルトボ拘置所を領事面会を求めて日本大使館の関係者らが訪れましたが、面会は実現しませんでした。 日本側は拘束の経緯や健康状態などを確認するため、記者との領事面会を要請していました。 関係者らは1時間ほどで出てきましたが、日本大使館は面会が実現しなかった理由などについては、いまのところ、明らかにしていません。 日本大使館は「折衝の結果、実現しなかった」「引き続き1日も早い面会を要請し続ける」としています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019040?utm_source=lootura.com","publishedAt":"2026-10-16T15:43:29.000Z"},{"title":"エンジニアが勤務先の管理者アカウントをロックして約1億円相当の身代金を要求したとして有罪判決を受ける","summary":"インフラエンジニアとして働いていたアメリカ人が、勤務先の企業が管理するアカウントのパスワードをリセットするなどして他の社員を閉め出し、復旧の条件として多額の身代金を要求していたことが分かりました。このエンジニアは匿名で脅迫していましたが、監視カメラの映像などから身元が割り出されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261017-cyberattack-engineer-sentenced/?utm_source=lootura.com","publishedAt":"2026-10-16T23:00:00.000Z"},{"title":"国道をシニアカーで走行していた90代男性 軽トラックにはねられ意識不明 宮城・南三陸町","summary":"17日午後、宮城県南三陸町内の国道でシニアカーが軽トラックにはねられ、シニアカーの男性が意識不明の重体です。 17日午後3時45分頃、南三陸町歌津の国道で「軽トラックとシニアカーが接触した」と通行人から消防に通報がありました。 この事故でシニアカーに乗っていた近くに住む職業不詳の阿部孝一さん（98）が頭などを強く打ち意識不明の重体です。 警察は軽トラックを運転していた近くに住む漁業の男を過失運転傷害の疑いで現行犯逮捕しました。 男にけがはなく、取り調べに対し容疑を認めているということです。 警察によりますと、阿部さんは国道45号の車道をシニアカーで走っていて右折しようとした際に後ろから来た軽トラックにはねられたということです。 道路交通法上、シニアカーは車両ではなく「歩行者」と同じ扱いとなっています。 現場の道路脇には歩道があったということで、警察が事故の原因を調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019041?utm_source=lootura.com","publishedAt":"2026-10-16T15:38:33.000Z"},{"title":"米AmazonがAIガジェット「Bee」発表。カードサイズのボイスレコーダーなど","summary":"米AmazonがAIガジェットを2モデル発表しました。リストバンド型の「Bee Frontier」とカード型の「Bee Eclipse」。AI要約ボイスレコーダーといえる端末で、ユーザーの会話をききとり、文字起こしや要約、会話から察して必要…","source":"ギズモード・ジャパン","author":"そうこ","category":"technology","url":"https://www.gizmodo.jp/article/2610-amazon-bee-ai-gadgets/?utm_source=lootura.com","publishedAt":"2026-10-17T09:00:00.000Z"},{"title":"トランプ大統領「中国・ロシアと核軍縮について協議」保守系メディアのインタビューで 「可能であれば非核化を実現したい」具体的な協議内容は明らかにせず","summary":"アメリカのトランプ大統領は、核軍縮について中国やロシアと協議していると明らかにし、「可能であれば非核化を実現したい」と述べました。 トランプ大統領は15日、保守系メディア「ニュースマックス」のインタビューで、中国やロシアと核軍縮について協議していると明らかにしました。 トランプ氏は「可能であれば非核化を実現したい」とも語りましたが、具体的な協議内容などは明らかにしませんでした。 また、現在、保有する核兵器について、アメリカが優位な立場にあると強調する一方、中国は核軍縮に「乗り気ではない」としたうえで、「5、6年すれば我々に追いつくだろう」とも指摘しました。 核軍縮をめぐっては、今年2月にアメリカとロシアの間の新START＝新戦略兵器削減条約が失効し、トランプ氏は中国を含めた新たな枠組みを作るべきだと主張しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019042?utm_source=lootura.com","publishedAt":"2026-10-16T15:38:24.000Z"},{"title":"西鉄、nimocaのアプリチャージやバスのクレカ乗車拡大 三井住友カード連携","summary":"西日本鉄道とニモカ、三井住友カードの3社は、キャッシュレスの推進やデータ活用で包括連携協定を締結した。バスで「クレカ乗車」を拡充するほか、Vポイントが貯まる新しいクレジットカードを発行、交通系ICカード「nimoca」にはスマホをかざしアプリ経由でチャージできるサービスを開始する。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148784.html?utm_source=lootura.com","publishedAt":"2026-10-16T22:31:13.075Z"},{"title":"【ソフトバンク】ＣＳファイナルで日本ハムに３連勝 ３年連続の日本シリーズ進出決定","summary":"ホークスは16日、日本ハムとのクライマックスシリーズファイナルステージで3連勝。日本シリーズ進出を決めました。 ホークスは1点を追う3回、このシリーズ打撃好調、庄子のタイムリーで同点とします。 ところが5回、ノーアウト1塁の場面でファースト正木が2塁へ悪送球、ノーアウト3塁2塁のピンチを作る。 先発の前田悠伍も粘りの投球を見せますが、内野安打で勝ち越しを許してしまいます。 それでも、その直後、ランナー1人をおいて、正木が名誉挽回の逆転2ランホームランを放つ。 その後も追加点を挙げたホークスが3連勝、アドバンテージの2勝も含めて日本シリーズ進出を決めました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3019027?utm_source=lootura.com","publishedAt":"2026-10-16T15:00:36.000Z"},{"title":"テスラ空を飛ぶ SpaceXの技術を搭載した新型ロードスターを披露","summary":"テスラ(Tesla)は15日、米国で新型スポーツカー「ロードスター(Roadster)」を発表した。SpaceXによるロケット技術を搭載し、空を飛び回転するデモを披露し、世界初の空飛ぶクルマ(Flying Car)」として、EVに留まらない可能性と技術をアピールした。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2148757.html?utm_source=lootura.com","publishedAt":"2026-10-16T22:31:13.075Z"},{"title":"150万円もらえるとしても｢ノー｣。データセンター建設に反対する小さな町の住民たち","summary":"AIの急増に伴うデータセンター建設ラッシュに対し、住民の反対運動が全米で拡大。1万ドル（150万円）のオファーを受けても拒否する理由と背景を解説します。","source":"ギズモード・ジャパン","author":"Kenji P. Miyajima","category":"technology","url":"https://www.gizmodo.jp/article/2610-ai-data-center-local-opposition/?utm_source=lootura.com","publishedAt":"2026-10-17T08:30:00.000Z"},{"title":"門前仲町に780戸の住宅と商業施設「TOKYO BLUE LINC」 野村不動産","summary":"野村不動産は16日、東京都江東 		window.looturaClient = context;
		window.umami.identify?.(context);

		const sessionKey = `lootura:context-tracked:${context.appMode}:${context.platform}:${context.browser}`;
		if (!sessionStorage.getItem(sessionKey)) {
			sessionStorage.setItem(sessionKey, 'true');
			window.umami.track?.('App context', context);
		}
	};

	const lockPortraitOrientation = async () => {
		const orientationApi = screen.orientation;
		if (!isLooturaPwaRuntime() || !orientationApi?.lock) return;

		try {
			await orientationApi.lock('portrait-primary');
		} catch {
			// iOS Safari and some browsers ignore orientation lock for web apps.
		}
	};

	const enforcePortraitOrientation = () => {
		lockPortraitOrientation();

		window.addEventListener('focus', lockPortraitOrientation);
		window.addEventListener('pageshow', lockPortraitOrientation);
		window.addEventListener('orientationchange', lockPortraitOrientation);
		screen.orientation?.addEventListener?.('change', lockPortraitOrientation);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') lockPortraitOrientation();
		});
	};

	if (!isProduction && 'serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistrations?.().then((registrations) => {
			registrations.forEach((registration) => registration.unregister());
		});
	}

	if (isProduction && 'serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			const reloadForUpdate = () => {
				if (isReloadingForUpdate) return;
				isReloadingForUpdate = true;
				window.location.reload();
			};
			const checkPublishedBuild = async () => {
				try {
					const response = await fetch(`${baseUrl}app-build.json?ts=${Date.now()}`, {
						cache: 'no-store',
						headers: { accept: 'application/json' },
					});
					if (!response.ok) return;
					const publishedBuild = await response.json();
					const publishedBuildId = getBuildId(publishedBuild);
					if (!publishedBuildId || publishedBuildId === currentBuildId) return;
					maybeShowReleaseUpdateNotice(publishedBuild);
				} catch {
					// Update checks should never block normal reading.
				}
			};

			navigator.serviceWorker.addEventListener('controllerchange', reloadForUpdate);

			navigator.serviceWorker
				.register(`${baseUrl}sw.js`, { updateViaCache: 'none' })
				.then((registration) => {
					const checkForUpdates = () => registration.update().catch(() => {});

					checkForUpdates();
					checkPublishedBuild();
					window.setInterval(checkForUpdates, 60_000);
					window.setInterval(checkPublishedBuild, 60_000);
					window.addEventListener('focus', checkForUpdates);
					window.addEventListener('focus', checkPublishedBuild);
					document.addEventListener('visibilitychange', () => {
						if (document.visibilityState === 'visible') {
							checkForUpdates();
							checkPublishedBuild();
						}
					});
				})
				.catch(() => {});
		});
	}

	window.addEventListener('load', () => {
		trackLooturaContext();
		enforcePortraitOrientation();
		window.setTimeout(() => maybeShowReleaseNotice(), 250);
	});
})();</script></body></html>
