const stories = [{"title":"「きえないで 休んでいい にげていい」葛西臨海水族園のX話題 | 毎日新聞","summary":"「きえないで 休んでいい」「あなたの居場所になれたらいいな」――。葛西臨海水族園（東京都江戸川区）公式X（ツイッター）での8月31日、9月1日の数回の投稿がインターネット上で話題になっている。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260903/k00/00m/310/382000c?utm_source=lootura.com","publishedAt":"2026-09-06T21:15:04.000Z"},{"title":"千葉モノレールで一部エレベーターに雨水進入で停止","summary":"千葉都市モノレールによりますと、きょう（7日）午前6時15分現在、雨水が入った影響で、一部のエレベーターが停止しています。 千葉モノレールでは先月の千葉豪雨の際、エレベーターが多数停止したことを受けて、きょうはエレベーターやエスカレーターの運用を見合わせる可能性があるとしてします。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924837?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:34.000Z"},{"title":"読む政治：「対決より解決」続投の国民・玉木氏 試金石は28年の「天王山」 | 毎日新聞","summary":"6日投開票された国民民主党の代表選では、玉木雄一郎代表（57）が橋本幹彦衆院議員（30）の挑戦を退け、政策本位で与野党問わず連携する玉木氏の「対決より解決」路線が信任された形となった。","source":"毎日新聞","author":"源馬のぞみ","category":"general","url":"https://mainichi.jp/articles/20260906/k00/00m/010/248000c?utm_source=lootura.com","publishedAt":"2026-09-06T21:00:20.000Z"},{"title":"KDDI、「光」「5G」両対応ホームルーターでネット接続「auひかりプラス」","summary":"KDDIは、auやNTTの光回線とauの5G回線を組み合わせて利用できるハイブリッドホームルーターによる家庭用インターネット接続サービス「auひかりプラス」を発表した。9月17日から開始する。対応プロバイダーは「BIGLOBE」「So-net」「@nifty」の3つ。各プロバイダー経由で申込めるほか、auショップなどの店頭でも案内していく。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138431.html?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:38.097Z"},{"title":"ドイツ東部州議会選、極右AfDが第1党確実 過半数が焦点に | 毎日新聞","summary":"ドイツ東部ザクセン・アンハルト州の州議会選挙（基本定数83）が6日、投開票され、反移民などを主張する極右政党「ドイツのための選択肢（AfD）」が第1党となることが確実となった。独メディアが出口調査を基に報じた。今後、過半数に達するかが注目される。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260907/k00/00m/030/006000c?utm_source=lootura.com","publishedAt":"2026-09-06T16:36:35.000Z"},{"title":"千葉・山武市など流れる作田川で「レベル4氾濫危険情報」","summary":"千葉県・山武市などを流れる作田川で氾濫のおそれがあるとして、千葉県は午前5時30分、「レベル4氾濫危険情報」を発表しました。 「レベル4」は危険な場所からの避難が必要な状況で、気象庁は「速やかに適切な避難行動をとってほしい」としています。 自治体からの避難情報を確認してください。 また今、自分のいる場所が浸水想定区域など危険度の高い場所かどうかを確認し、状況に応じて身を守る行動を心がけてください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924836?utm_source=lootura.com","publishedAt":"2026-09-06T21:56:28.000Z"},{"title":"大阪府議補選でも維新候補が勝利 36歳新人 交野市選挙区 | 毎日新聞","summary":"大阪府交野市長選に出馬した府議の辞職に伴う府議補選交野市選挙区（改選数1）は6日に投開票があり、大阪維新の会の元市議、堀天地氏（36）が初当選した。無所属で元市議の黒田実氏（57）を破り、新人同士の争いを制した。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260907/k00/00m/310/005000c?utm_source=lootura.com","publishedAt":"2026-09-06T16:18:23.000Z"},{"title":"「津田沼パルコ」跡地が駅前広場に 「ATOCHI」10月オープン","summary":"三井不動産レジデンシャルは、JR津田沼駅北口の「津田沼PARCO」跡地において、駅前広場「ATOCHI(アトチ)」を10月1日にオープンする。約2,800m2の敷地を将来的な開発工事着手まで暫定活用する。","source":"インプレス","author":"加藤綾","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138391.html?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:38.097Z"},{"title":"バレー推し：深津英臣「一人一人が藍以上にやっていかなきゃ…」アジア選手権 | 毎日新聞","summary":"2028年ロサンゼルス・オリンピック予選を兼ねたバレーボール男子のアジア選手権は6日、北九州市立総合体育館で1次リーグがあり、日本は3－0でバーレーンに快勝し、2連勝とした。","source":"毎日新聞","author":"森野俊","category":"general","url":"https://mainichi.jp/articles/20260906/k00/00m/050/259000c?utm_source=lootura.com","publishedAt":"2026-09-06T14:47:53.000Z"},{"title":"【レベル３大雨警報】千葉県・君津市に発表 06:53時点","summary":"気象台は、7日午前6時53分に、レベル３大雨警報を君津市に発表しました。 北西部では、低い土地の浸水や河川の増水に厳重に警戒してください。 【大雨警報（発表中）】 ■千葉市 ●レベル４大雨危険警報 ■銚子市 ●レベル３大雨警報 ■市川市 ●レベル２大雨注意報 ■船橋市 ●レベル３大雨警報 ■館山市 ●レベル２大雨注意報 ■木更津市 ●レベル３大雨警報 ■松戸市 ●レベル３大雨警報 ■野田市 ●レベル２大雨注意報 ■茂原市 ●レベル３大雨警報 ■成田市 ●レベル３大雨警報 ■佐倉市 ●レベル３大雨警報 ■東金市 ●レベル３大雨警報 ■旭市 ●レベル３大雨警報 ■習志野市 ●レベル２大雨注意報 ■柏市 ●レベル３大雨警報 ■勝浦市 ●レベル３大雨警報 ■市原市 ●レベル３大雨警報 ■流山市 ●レベル３大雨警報 ■八千代市 ●レベル３大雨警報 ■我孫子市 ●レベル２大雨注意報 ■鴨川市 ●レベル２大雨注意報 ■鎌ケ谷市 ●レベル３大雨警報 ■君津市 ●レベル３大雨警報【発表】 ■富津市 ●レベル２大雨注意報 ■浦安市 ●レベル２大雨注意報 ■四街道市 ●レベル２大雨注意報 ■袖ケ浦市 ●レベル３大雨警報 ■八街市 ●レベル３大雨警報 ■印西市 ●レベル２大雨注意報 ■白井市 ●レベル２大雨注意報 ■富里市 ●レベル３大雨警報 ■南房総市 ●レベル２大雨注意報 ■匝瑳市 ●レベル３大雨警報 ■香取市 ●レベル３大雨警報 ■山武市 ●レベル３大雨警報 ■いすみ市 ●レベル３大雨警報 ■大網白里市 ●レ ロボットがコンコースを自動走行しながら巡回し、ごみを収集する。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138449.html?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:38.097Z"},{"title":"ウクライナ・ゼレンスキー大統領と米・ウィットコフ特使らがキーウで会談 米側の提案について話し合ったか ゼレンスキー氏は内容分析する考え","summary":"ウクライナのゼレンスキー大統領は6日、首都キーウを訪れたアメリカのウィットコフ特使らと会談しました。ウィットコフ氏らが特使としてキーウを訪れるのは初めてです。 ゼレンスキー大統領は6日、ウクライナの首都キーウを訪れたアメリカのウィットコフ特使とトランプ大統領の娘婿、クシュナー氏を世界遺産の聖ソフィア大聖堂の前で出迎えました。 会談ではロシアとの戦闘終結に向けたアメリカ側の提案について話し合ったとみられ、ゼレンスキー氏は会談後、「いくつかの新たなアイディアについて協議した」としたうえで、内容を分析する考えを示しました。 また、戦闘が冬まで続いた場合に備え、防空システムやエネルギー支援を含む「冬の支援策」についても協議したということです。さらに、ウクライナとアメリカ、ヨーロッパが近く再び会談することで合意し、ロシアを含む3者協議の実現にも期待を示しました。 ウィットコフ氏らは5日、モスクワでプーチン大統領とも会談するなど和平に向けた協議が続いていますが具体的な合意には至っていません。 ウィットコフ氏とクシュナー氏が特使としてキーウを訪れたのは、今回が初めてです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924828?utm_source=lootura.com","publishedAt":"2026-09-06T21:44:30.000Z"},{"title":"学生音コン東京予選 ピアノ小学校の部、12人が本選に進出 | 毎日新聞","summary":"第80回全日本学生音楽コンクール（毎日新聞社主催、NHK後援）の東京大会予選は5、6日、東京・初台の東京オペラシティ・リサイタルホールでピアノ部門小学校の部を開催した。69人の応募者の中から12人が本選へ進んだ。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260906/k00/00m/200/135000c?utm_source=lootura.com","publishedAt":"2026-09-06T08:10:57.000Z"},{"title":"新宿駅西口駅前広場、緑と光の“人のための広場”に刷新","summary":"東京都は、新宿駅西口駅前広場デザイン方針を策定した。デザインコンセプトに「新宿駅西口駅前広場は、『もっと』人のための広場へ」を掲げ、緑と光の中で、人が滞在できる駅前広場整備を目指す。","source":"インプレス","author":"加藤綾","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138485.html?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:38.096Z"},{"title":"【レベル３大雨警報】茨城県・北茨城市に発表 06:43時点","summary":"気象台は、7日午前6時43分に、レベル３大雨警報を北茨城市に発表しました。 茨城県では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■水戸市 ●レベル２大雨注意報 ■日立市 ●レベル２大雨注意報 ■土浦市 ●レベル２大雨注意報 ■古河市 ●レベル２大雨注意報 ■石岡市 ●レベル２大雨注意報 ■結城市 ●レベル２大雨注意報 ■龍ケ崎市 ●レベル２大雨注意報 ■下妻市 ●レベル２大雨注意報 ■常総市 ●レベル２大雨注意報 ■常陸太田市 ●レベル２大雨注意報 ■高萩市 ●レベル３大雨警報 ■北茨城市 ●レベル３大雨警報【発表】 ■笠間市 ●レベル２大雨注意報 ■取手市 ●レベル２大雨注意報 、湘南新宿ラインの全線などで、午後まで運転を見合わせる予定です。さらに、山手線や京浜東北線など多くの路線で本数を通常より2割から3割ほど減らして運転します。 一方、JR東海によりますと、東海道新幹線は始発から通常通り運行しています。 最新の情報を確認するようにしてください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924822?utm_source=lootura.com","publishedAt":"2026-09-06T21:35:06.000Z"},{"title":"関東は7日朝にかけて大雨予報 山手線は本数減 交通情報に注意","summary":"6日夜から7日にかけて関東や東海で、大雨が予想されています。気象庁は大雨や土砂災害への注意を呼びかけているほか、各交通機関も運休や運転本数の削減などを予告しています。","source":"インプレス","author":"編集部","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138587.html?utm_source=lootura.com","publishedAt":"2026-09-06T21:57:38.096Z"},{"title":"【レベル４土砂災害危険警報】千葉県・銚子市、旭市に発表 02:55時点","summary":"気象台は、7日午前2時55分に、レベル４土砂災害危険警報を銚子市、旭市に発表しました。 千葉県では、土砂災害に厳重に警戒してください。 【土砂災害警報（発表中）】 ■千葉市 ●レベル４土砂災害危険警報 ■銚子市 ●レベル４土砂災害危険警報【発表】 ■市川市 ●レベル２土砂災害注意報 ■船橋市 ●レベル２土砂災害注意報 ■館山市 ●レベル４土砂災害危険警報 ■木更津市 ●レベル３土砂災害警報 ■松戸市 ●レベル２土砂災害注意報 ■野田市 ●レベル２土砂災害注意報 ■茂原市 ●レベル４土砂災害危険警報 ■成田市 ●レベル３土砂災害警報 ■佐倉市 ●レベル２土砂災害注意報 ■東金市 ●レベル４土砂災害危険警報 ■旭市 ●レベル４土砂災害危険警報【発表】 ■習志野市 ●レベル２土砂災害注意報 ■柏市 ●レベル２土砂災害注意報 ■勝浦市 ●レベル４土砂災害危険警報 ■市原市 ●レベル４土砂災害危険警報 ■流山市 ●レベル２土砂災害注意報 ■八千代市 ●レベル２土砂災害注意報 ■我孫子市 ●レベル２土砂災害注意報 ■鴨川市 ●レベル４土砂災害危険警報 ■鎌ケ谷市 ●レベル２土砂災害注意報 ■君津市 ●レベル４土砂災害危険警報 ■富津市 ●レベル３土砂災害警報 ■浦安市 ●レベル２土砂災害注意報 ■四街道市 ●レベル２土砂災害注意報 ■袖ケ浦市 ●レベル３土砂災害警報 ■八街市 ●レベル２土砂災害注意報 ■印西市 ●レベル２土砂災害注意報 ■白井市 ●レベル２土砂災害注意報 ■富里市 ●レベル２土砂災害注意報 ■南房総市 ●レベル４土砂災害危険警報 ■匝瑳市 ●レベル３土砂災害警報 ■香取市 ●レベル２土砂災害注意報 ■山武市 ●レベル４土砂災害危険警報 ■いすみ市 ●レベル４土砂災害危険警報 ■大網白里市 ●レベル４土砂災害危険警報 ■酒々井町 ●レベル２土砂災害注意報 ■栄町 ●レベル２土砂災害注意報 ■神崎町 ●レベル２土砂災害注意報 ■多古町 ●レベル３土砂災害警報 ■東庄町 ●レベル２土砂災害注意報 ■九十九里町 ●レベル２土砂災害注意報 ■芝山町 ●レベル４土砂災害危険警報 ■横芝光町 ●レベル３土砂災害警報 ■一宮町 ●レベル４土砂災害危険警報 ■睦沢町 ●レベル４土砂災害危険警報 ■長生村 ●レベル２土砂災害注意報 ■白子町 ●レベル２土砂災害注意報 ■長柄町 ●レベル２土砂災害注意報 ■長南町 ●レベル４土砂災害危険警報 ■大多喜町 ●レベル４土砂災害危険警報 ■御宿町 ●レベル４土砂災害危険警報 ■鋸南町 ●レベル２土砂災害注意報","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924759?utm_source=lootura.com","publishedAt":"2026-09-06T17:56:32.000Z"},{"title":"毒にも薬にもなる樹液を持つ「ボトルツリー」とは？","summary":"インド洋に浮かぶイエメン領のソコトラ島には、地面に巨大なボトルを置いたような幹を持ち、乾燥した岩場で鮮やかなピンク色の花を咲かせる植物があります。「ボトルツリー」と呼ばれるこの植物について、サイエンス系メディアのScienceAlertが解説しています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260907-bottle-tree-poison-medicine/?utm_source=lootura.com","publishedAt":"2026-09-06T21:00:00.000Z"},{"title":"神奈川県の国道と県道の一部で通行止め 大雨による影響 規制解除のめど立たず","summary":"神奈川県では、大雨の影響で、国道と県道の一部区間で通行止めとなっています。 神奈川県の小田原土木センターによりますと、小田原市や箱根町などの国道や県道の一部区間は、大雨の影響で、きょう（7日）午前1時から通行止めとなっています。 通行止めの区間は、▼国道1号の千歳橋右岸から大芝交差点の間、▼国道138号の仙石原交差点と宮の下交差点の間、▼県道723号の木賀坂下バス停から二の平入り口バス停の間などとなっています。 いずれも規制解除のめどは立っていないということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924748?utm_source=lootura.com","publishedAt":"2026-09-06T17:56:15.000Z"},{"title":"大坂なおみが4回戦に進出 テニス全米オープン女子シングルス | 毎日新聞","summary":"テニスの全米オープン第7日は5日、ニューヨークのビリー・ジーン・キング・ナショナル・テニスセンターで行われ、女子シングルス3回戦で第13シードの大坂なおみ（フリー）が第23シードのエリーズ・メルテンス（ベルギー）に6―3、3―6、7―5で競り勝ち、2年連続で4回戦に進んだ。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260906/k00/00m/050/057000c?utm_source=lootura.com","publishedAt":"2026-09-06T02:44:37.000Z"},{"title":"【レベル３大雨警報】茨城県・桜川市に発表 02:38時点","summary":"気象台は、7日午前2時38分に、レベル３大雨警報を桜川市に発表しました。 南部では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■水戸市 ●レベル２大雨注意報 ■日立市 ●レベル２大雨注意報 ■土浦市 ●レベル２大雨注意報 ■古河市 ●レベル２大雨注意報 ■石岡市 ●レベル２大雨注意報 ■結城市 ●レベル２大雨注意報 ■龍ケ崎市 ●レベル２大雨注意報 ■下妻市 ●レベル２大雨注意報 ■常総市 ●レベル２大雨注意報 ■常陸太田市 ●レベル２大雨注意報 ■高萩市 ●レベル２大雨注意報 ■北茨城市 ●レベル２大雨注意報 ■笠間市 ●レベル２大雨注意報 ■取手市 ●レベル２大雨注意報 ■牛久市 ●レベル２大雨注意報 ■つくば市 ●レベル２大雨注意報 ■ひたちなか市 ●レベル２大雨注意報 ■鹿嶋市 ●レベル２大雨注意報 ■潮来市 ●レベル２大雨注意報 ■守谷市 ●レベル２大雨注意報 ■常陸大宮市 ●レベル２大雨注意報 ■那珂市 ●レベル２大雨注意報 ■筑西市 ●レベル２大雨注意報 ■坂東市 ●レベル２大雨注意報 ■稲敷市 ●レベル２大雨注意報 ■かすみがうら市 ●レベル２大雨注意報 ■桜川市 ●レベル３大雨警報【発表】 ■神栖市 ●レベル２大雨注意報 ■行方市 ●レベル２大雨注意報 ■鉾田市 ●レベル２大雨注意報 ■つくばみらい市 ●レベル２大雨注意報 ■小美玉市 ●レベル２大雨注意報 ■茨城町 ●レベル２大雨注意報 ■大洗町 ●レベル２大雨注意報 ■城里町 ●レベル２大雨注意報 ■東海村 ●レベル２大雨注意報 ■大子町 ●レベル２大雨注意報 ■美浦村 ●レベル２大雨注意報 ■阿見町 ●レベル２大雨注意報 ■河内町 ●レベル２大雨注意報 ■八千代町 ●レベル２大雨注意報 ■五霞町 ●レベル２大雨注意報 ■境町 ●レベル２大 general","url":"https://mainichi.jp/articles/20260906/k00/00m/050/054000c?utm_source=lootura.com","publishedAt":"2026-09-06T02:41:48.000Z"},{"title":"週5日出社の鍵は魅力あるオフィス、フィデリティ新本社に仕掛け満載","summary":"（ブルームバーグ）： 米資産運用大手フィデリティ・インベストメンツはこのほど、ボストンのウォーターフロントに新本社を開設した。新型コロナウイルス禍から数年がたってもオフィス空室率の高止まりに苦しむ同市で、その存在感は際立っている。 フィデリティ傘下の不動産会社は2020年、この大規模な新本社の建設に着手した。当時は在宅勤務が広がり、大型オフィスビルが不要になるとの見方が強まりつつあった。 ボストンでにぎわいを見せるシーポート地区にある新本社は、社員同士の対面での交流を重視して当初から設計された。館内にはソファが点在するほか、カフェやダイニングスペース、図書館、中庭などを設け、社員がさまざまな場所で働けるようにしている。 フィデリティはここ数年、パンデミックで一変した働き方を象徴する企業の一つだった。社員には月の半分を在宅勤務とすることを認める一方、床面積7万9400平方メートルのダウンタウンの本社を手放し、シーポート地区の6万8300平方メートルのオフィスに移る準備を進めていた。 しかし今春、フィデリティは方針を転換。ボストンなど一部地域の社員に対し、9月から週5日の出社を義務付けた。ボストン拠点の6000人余りの社員が毎日出社できるよう、現在は両方のビルを維持している。 この方針転換は社員を驚かせたが、フィデリティは結果として、ボストンの主要商業地区であるダウンタウンとシーポートの両方に大規模な拠点を構えることになった。CBREグループのデータによると、4－6月期末時点のオフィス空室率は両地区とも20%。コロナ禍直前はダウンタウンが6%、シーポート地区が9%だった。 フィデリティは業績も好調だ。4－6月期の運用資産は7兆8000億ドルと前年同期比23%増加。アビゲイル・ジョンソン最高経営責任者（CEO）の下、暗号資産などオルタナティブ投資にも力を入れている。 ボストン港の埠頭にある新本社は、築113年の3階建て建物を再開発したものだ。かつては貨物ターミナルや移民の入国拠点として使われ、1980年代にはフィデリティが展示・イベント施設や業務支援用のオフィスに改装した。 長方形の建物は天井の梁（はり）や配管をむき出しにし、かつての施設の面影を残す。金属製の手すりを備えた真っ白な階段は船のタラップを思わせ、大きな窓からはボストン港に停泊する帆船を望める。 館内の一角では、木の葉が風に揺れる映像が壁に投影されている。近くには社員向けの健康管理施設があり、自転車通勤者向けのシャワーも備える。社員が個々のデスクにとどまらず、館内の共有スペースを自由に移動しながら働けるよう設計されている。広報担当者によると、社員同士の協働やイノベーションを促す狙いがある。 また、ロボットが館内を巡回し、社員を目的の場所に案内したり、会議室探しを支援したりする。 館内の一角には、シーポート地区の高級レストランを思わせる長い曲線状のバーがあり、暖色系の照明が落ち着いた雰囲気を演出する。バーは社内イベントに利用でき、近くにはいつでも使えるレストラン風のボックス席もある。 新本社には、多くのファンドマネジャーを含め、同社の全事業部門が入る。ボストン市の記録によると、フィデリティの同市での従業員数は2016年から25年にかけて24%増加したという。 世界金融危機以降、ボストンでは金融業の雇用が減少傾向にあるが、足元では明るい兆しもみられる。JPモルガン・チェースは新たなオフィスタワーへの移転を前に大規模な採用を計画しており、KKRも昨年、ダウンタウンで約1万2400平方メートルのオフィスの賃貸契約を結んだ。 原題：New Fidelity Office Is Built to Get Staff Back Five Days a Week（抜粋） もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/2924751?utm_source=lootura.com","publishedAt":"2026-09-06T17:31 表されています。 東京・練馬区では、区立の幼稚園や小中学校、小中一貫教育校を一斉に臨時休校するとしています。 また、葛飾区でも園児・児童・生徒の安全を最優先に考え、区立の幼稚園や小中学校を臨時休校するということです。 東京23区では、このほかにも世田谷区、品川区、台東区など多くの自治体が臨時休校を決めています。 また、東京以外にも、横浜市や、さいたま市など複数の自治体で同様に臨時休校が発表されています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924732?utm_source=lootura.com","publishedAt":"2026-09-06T17:18:38.000Z"},{"title":"豚から腎臓を移植され9カ月生存した事例が登場","summary":"遺伝子を組み換えた豚の臓器を人間に移植する手術は複数の前例があり、腎臓の事例では2カ月にわたり生存した事例が報告されていますが、新たに、豚から腎臓を移植されて9カ月にわたって生存した人の事例が報告されています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260906-pig-kidney/?utm_source=lootura.com","publishedAt":"2026-09-06T12:00:00.000Z"},{"title":"茨城県で最大震度1の地震 茨城県・日立市","summary":"7日午前2時4分ごろ、茨城県で最大震度1を観測する地震がありました。 気象庁によりますと、震源地は茨城県北部で、震源の深さはおよそ10km、地震の規模を示すマグニチュードは2.4と推定されます。 この地震による津波の心配はありません。 最大震度1を観測したのは、茨城県の日立市です。 【各地の震度詳細】 ■震度1 □茨城県 日立市 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924741?utm_source=lootura.com","publishedAt":"2026-09-06T17:10:33.000Z"},{"title":"放射線によるがんの死亡リスクが最も高い職業とは？","summary":"放射線にさらされることは被ばくと呼ばれ、放射線に関連するがんリスクを高めるなどの健康被害をもたらします。500以上の職業を分析した新たな研究で、放射線に関連するがんの死亡リスクが高い職業が明らかになりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260906-job-highest-risk-radiation-cancer/?utm_source=lootura.com","publishedAt":"2026-09-06T11:00:00.000Z"},{"title":"【レベル４土砂災害危険警報】千葉県・君津市に発表 02:05時点","summary":"気象台は、7日午前2時05分に、レベル４土砂災害危険警報を君津市に発表しました。 千葉県では、土砂災害に厳重に警戒してください。 【土砂災害警報（発表中）】 ■千葉市 ●レベル２土砂災害注意報 ■銚子市 ●レベル３土砂災害警報 ■市川市 ●レベル２土砂災害注意報 ■船橋市 ●レベル２土砂災害注意報 ■館山市 ●レベル４土砂災害危険警報 ■木更津市 ●レベル３土砂災害警報 ■松戸市 ●レベル２土砂災害注意報 ■野田市 ●レベル２土砂災害注意報 ■茂原市 ●レベル４土砂災害危険警報 ■成田市 ●レベル３土砂災害警報 ■佐倉市 ●レベル２土砂災害注意報 ■東金市 ●レベル４土砂災害危険警報 ■旭市 ●レベル３土砂災害警報 ■習志野市 ●レベル２土砂災害注意報 ■柏市 ●レベル２土砂災害注意報 ■勝浦市 ●レベル４土砂災害危険警報 ■市原市 ●レベル４土砂災害危険警報 ■流山市 ●レベル２土砂災害注意報 ■八千代市 ●レベル２土砂災害注意報 ■我孫子市 ●レベル２土砂災害注意報 ■鴨川市 雨注意報 ■東庄町 ●レベル２大雨注意報 ■九十九里町 ●レベル２大雨注意報 ■芝山町 ●レベル２大雨注意報 ■横芝光町 ●レベル２大雨注意報 ■一宮町 ●レベル３大雨警報 ■睦沢町 ●レベル３大雨警報 ■長生村 ●レベル３大雨警報【発表】 ■白子町 ●レベル３大雨警報 ■長柄町 ●レベル３大雨警報 ■長南町 ●レベル２大雨注意報 ■大多喜町 ●レベル３大雨警報 ■御宿町 ●レベル３大雨警報 ■鋸南町 ●レベル２大雨注意報","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924735?utm_source=lootura.com","publishedAt":"2026-09-06T16:54:34.000Z"},{"title":"OpenAI、休眠サイトへの自社AIエージェント書き込みを認め、非公表の理由を説明","summary":"OpenAIは、AIエージェントが休眠Wikiを掲示板として悪用した問題について声明を発表し、自社モデルの関与を初めて認めた。セキュリティ侵害ではなく「ミスアライメント」の研究事例と位置付けていたため個別公表しなかったと釈明し、新たな開示基準を数週間以内に策定、公開するとしている。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/06/2000001202/?utm_source=lootura.com","publishedAt":"2026-09-05T22:35:17.000Z"},{"title":"ICC・赤根智子所長 制裁めぐり「信念は揺らがない」","summary":"アメリカのトランプ政権から制裁対象に指定されたICC=国際刑事裁判所の赤根智子所長が、オンラインの講演で「信念は揺らがない。今まで通りの業務を続ける」と改めて強調しました。 ICC・赤根智子所長 「私たちはどんなことがあっても、信念は揺らぎません。今まで通りにICCの業務である捜査、訴追、そして裁判業務を続けてまいります」 ICCの赤根智子所長が、きょう（6日）、公共訴訟を支援する認定NPO法人CALL4が主催した都内のイベントにオンラインで登壇しました。 赤根氏は、アメリカによる制裁などについて、「裁判官、裁判所の独立、中立性を脅かす行為だ」と改めて危機感を示しました。 また、法の支配を守り抜く上で、多くの国々と協力し重大犯罪を訴追する体制こそ将来の犯罪を防ぐことに繋がるとし、「日本はそうした世界の試みに今こそ積極的に加わるべきだ」と訴えました。 ICC 赤根智子所長 「大きな国の大きな圧力の前に、ひとりの人間、あるいはひとつの国際機関は無力のように見えるかもしれません。しかし決してそうではないと思います」 さらに赤根氏は、制裁の即時撤回を求める署名が14万筆以上集まっていることに触れ感謝を述べるとともに、「沈黙することは、大きな圧力や力による支配を是認することと同義になる。そうなってはならない。私は諦めない」などと強い決意を表明。さらなる支援の継続を呼びかけました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924669?utm_source=lootura.com","publishedAt":"2026-09-06T14:40:43.000Z"},{"title":"LUUP・ハロサイなどシェアモビリティ4社を同一拠点に 三井のリパーク","summary":"三井不動産リアルティは、同社が運営する「三井のリパーク 大泉学園町6丁目」に、ドコモ・バイクシェア、HELLO CYCLING、LUUP、Limeの4つのシェアモビリティサービスを同一箇所で利用できる拠点を開設した。駐車場事業者が4サービスを同一拠点で利用可能にする取り組みは業界初とする。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2138346.html?utm_source=lootura.com","publishedAt":"2026-09-06T08:22:04.191Z"},{"title":"【J2磐田】ホームで0-1完封負け 連勝ストップ【J2リーグ第5節速報】","summary":"ジュビロはホームでカターレ富山に0-1で敗れました。 ジュビロ磐田の2026/27シーズンJ2第5節は、ホーム・ヤマハスタジアムにカターレ富山を迎えて行われました。 3連勝を狙う磐田でしたが前半22分、富山のFW小川慶治朗に一瞬の隙を突かれて先制点を許してしまいます。 1点リードを許して迎えた後半、追いつきたい磐田はFW太田龍之介やFW渡邉りょうらを次々と投入して怒涛の反撃を開始。後半46分にDF桑原海人のシュートがゴール枠を叩くなど、試合を通じて計17本のシュートを浴びせましたが、富山の堅い守備を最後まで崩し切れず0-1でタイムアップ。ホームで悔しい完封負けを喫し、連勝は2でストップしました。 【明治安田J2リーグ第5節=ヤマハスタジアム】 ジュビロ磐田 0(0前半1 0後半0)1 カターレ富山 【磐】なし 【富】小川慶治朗(前22分)","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924671?utm_source=lootura.com","publishedAt":"2026-09-06T14:37:02.000Z"},{"title":"「スーパーリアル麻雀 VR」でゲーセン通いの日々を思い出したマンガ家、ご褒美シーンの“限界突破“に驚愕","summary":"8月27日に発売された麻雀ゲーム「スーパーリアル麻雀 Venus Returns」が、Steamの国内売上ランキングで5日連続1位を記録しました。かつてゲームセンターに通ったボクも試してみました。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/06/2000001195/?utm_source=lootura.com","publishedAt":"2026-09-05T22:16:00.000Z"},{"title":"【J1エスパルス】アウェイで1-3敗戦 数的不利響き4連敗【J1リーグ第6節速報】","summary":"エスパルスはアウェイで川崎フロンターレに1-3で敗れました。 清水エスパルスのJ1第6節は、アウェイ・MUFGスタジアムで川崎フロンターレと対戦しました。 連敗脱出を期す清水でしたが、開始わずか22秒に清水Jrユース出身の川崎FW持山に電光石火の先制点を許す苦しい立ち上がりとなります。 さらに前半41分にはDF住吉ジェラニレショーンが退場処分となり、数的不利に陥って前半を折り返します。 それでも後半23分、FWオ・セフンが自ら獲得したPKを冷静に決めて一時は同点に追いつく執念を見せます。しかし10人で耐える清水は終盤、川崎FのFWマルシーニョに連続ゴールを許して1-3で敗戦。 数的不利のなか粘りを見せたものの及ばず、痛恨の4連敗となりました。 【明治安田J1リーグ第6節=MUFGスタジアム】 川崎フロンターレ 3(1前半0 2後半1)1 清水エスパルス 【川】持山匡佑(前1分)、マルシーニョ(後32分、後45分) 【清】オセフン(後23分=PK)","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924670?utm_source=lootura.com","publishedAt":"2026-09-06T14:34:41.000Z"},{"title":"スマホの買い替え、いつが一番お得なの？","summary":"2024年8月6日の記事を編集して再掲載しています。欲しいときが買いどきとはいうけれど…。スマートフォンに買い替えはつきものです。どんなに愛用しているモデルでも、いつかは必ず使えなくなります。だけど、いつどれを買うのが最もお得な買い替えなの…","source":"ギズモード・ジャパン","author":"湯木進悟","category":"technology","url":"https://www.gizmodo.jp/article/best-timing-buy-smartphone-roa/?utm_source=lootura.com","publishedAt":"2026-09-06T14:00:00.000Z"},{"title":"豚舎内で男性作業員（65）足首切断された状態で発見 その後、死亡確認 スクリューコンベアに巻き込まれたか 鹿児島","summary":"鹿児島県南大隅町の豚舎内で6日午後、左足首を切断された状態の男性作業員（65）が見つかりその後、死亡が確認されました。 錦江警察署によりますと6日午後5時ごろ、南大隅町にある養豚農場の責任者から「男性が冷たくなっている」と119番通報がありました。 消防が駆けつけたところ豚舎内に設置されたスクリューコンベア近くで、この養豚農場で作業員として働く鹿屋市西原2丁目の会社員・武内博さん（65）が左足首付近を切断された状態で倒れているのが見つかりその後、死亡が確認されました。 目撃者や防犯カメラはなく、武内さんは当時、1人で作業していたとみられています。 スクリューコンベアはスクリューを回転させて豚の排せつ物を運ぶ機械で、武内さんが見つかった時は動いたままになっていたということです。 警察は何らかの形でスクリューコンベアに巻き込まれ切断された可能性があるとみて、当時の状況など詳しく調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924667?utm_source=lootura.com","publishedAt":"2026-09-06T14:24:02.000Z"},{"title":"女性の割合が多い仕事の方がAIによる自動化の影響を受けやすい可能性がある","summary":"「AIによって仕事が奪われる」と言われるとき、エンジニアや力仕事など男性の割合が多い職業が影響を受けると考えられる一方で、女性の割合が多い育児や看護、介護といった職種ではAIの影響を受けにくいと考えられることがあります。しかし、オーストラリアの政府機関がまとめたデータを分析した研究では、AIによる自動化の影響を最も受けやすいのは、女性の割合が多い職種であることが示されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260906-female-jobs-ai/?utm_source=lootura.com","publishedAt":"2026-09-06T04:00:00.000Z"},{"title":"中央道など広範囲で通行止めの可能性 中日本高速道路","summary":"中日本高速道路は秋雨前線や台風の影響で中央道、東名、新東名などあわせて16区間が7日(月)に同時に通行止めになる可能性があると発表しました。 中央道・上野原IC付近 6日23時頃 このうち7日に中央道で通行止めの可能性がある区間と通行止めを開始する見込みの時間帯は以下の通りです。 【区間】 【開始見込みの時間帯】 ・上下 国立府中IC～八王子IC 6時～12時 ・上り 一宮御坂IC～八王子IC 0時～6時 ・下り 八王子IC～勝沼IC 0時～6時 ・上下 大月JCT～都留IC 0時～6時 また、中部横断道は以下の通りです。 ・上下 六郷IC～増穂IC 6時～12時 東富士五湖道路は以下の通りです。 ・上下 富士吉田IC～須走IC 0時～6時","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924658?utm_source=lootura.com","publishedAt":"2026-09-06T14:08:10.000Z"},{"title":"絶滅したカモノハシガエル、「クローン復活」なるか。40年前の冷凍標本を使った試み","summary":"オーストラリアには、かつて、口から赤ちゃんを産むカエルがいました。その名は、カモノハシガエル。1973年に発見されたこのカエルは、メスが卵を産むと自分で卵を飲み込んでしまいます。飲み込まれた卵は胃の中で成長し、カエルになると、母ガエルの口か…","source":"ギズモード・ジャパン","author":"中川真知子","category":"technology","url":"https://www.gizmodo.jp/article/revive-dead-frog-frozen-for-40-years/?utm_source=lootura.com","publishedAt":"2026-09-06T13:30:00.000Z"} ":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924346?utm_source=lootura.com","publishedAt":"2026-09-06T08:12:22.000Z"},{"title":"専門家に聞いた「データを永続的に残すにはどうしたらいい？」","summary":"みなさん、過去のデータや写真どう管理してますか？プライベートな写真、仕事の書類、機密情報など、データはますますクラウドやデジタルプラットフォームでの保管に移りつつあります。そして、データ保存のデジタル化に反対する意見としてよく挙がるのが、デ…","source":"ギズモード・ジャパン","author":"岩田リョウコ","category":"technology","url":"https://www.gizmodo.jp/article/will-we-ever-solve-the-problem-of-losing-data/?utm_source=lootura.com","publishedAt":"2026-09-06T11:00:00.000Z"},{"title":"二戸市長選告示戸舘弘幸氏が初当選 | TBS NEWS DIG","summary":"前市長の辞職に伴う二戸市の市長選挙が6日告示され、無所属の新人・戸舘弘幸氏以外に立候補者はなく、無投票での初当選が確定しました。","source":"TBSニュース","author":"TBS NEWS DIG","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924342?utm_source=lootura.com","publishedAt":"2026-09-06T08:07:00.000Z"},{"title":"ChatGPT登場以降に公開されたウェブサイトの3分の1に「AI」の痕跡が見られることが研究で判明","summary":"2022年11月にChatGPTが登場してから生成AIは一般に広く知られるようになり、わずか4年足らずで人々の生活に欠かせないものになるほどに成長しました。オンラインで公開されるコンテンツに生成AIが使われるのももはや当たり前になっているということで、研究者らが「生成AIで作られた痕跡があるウェブサイト」の割合を調査しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260906-web-ai-signs/?utm_source=lootura.com","publishedAt":"2026-09-05T23:00:00.000Z"},{"title":"焼きたてパン食べ放題1120円！“高級店の味”が1000円台で！超お得なモーニング【特集それスタ】 | TBS NEWS DIG","summary":"お財布に優しく、贅沢気分が味わえると人気上昇中の「モーニング」。モーニング愛好家の大木奈ハル子さんが厳選した、今行くべき「超お得なモーニング」を取材しました。","source":"TBSニュース","author":"TBS NEWS DIG","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924337?utm_source=lootura.com","publishedAt":"2026-09-06T08:05:52.000Z"},{"title":"来週のAppleイベントで、楽しみにしておかない方がいいプロダクト3つ","summary":"先日、ティム・クック氏の後任としてApple CEOに着任したジョン・ターナス氏。さっそく従業員に向けて「来週には大きな発表があり､驚異的なものになるでしょう」とメッセージを残しています。そう！ 来週の新製品発表イベントでは、満を持した折り…","source":"ギズモード・ジャパン","author":"mio","category":"technology","url":"https://www.gizmodo.jp/article/apple-products-rumored-not-to-be-released-this-time/?utm_source=lootura.com","publishedAt":"2026-09-06T09:00:00.000Z"},{"title":"JR東日本 あす（7日） 千葉県内の在来線・特急列車で運転見合わせ 大雨の影響で","summary":"JR東日本は大雨予報に伴い、きょう（6日）とあす（7日）、千葉県内の在来線や特急列車で運転を見合わせると発表しました。 JR東日本によりますと、きょう（6日）運転を見合わせる在来線は以下の通りです。 ▼内房線 君津－安房鴨川間 午後8時ごろから終日運転見合わせ ▼外房線 誉田－安房鴨川間 午後9時ごろから終日運転見合わせ あす（7日）始発から夕方ごろまで運転を見合わせる在来線は以下の通りです。 ▼内房線 君津－安房鴨川間 ▼外房線 誉田－安房鴨川間 ▼久留里線 木更津－久留里間 ▼総武本線 佐倉－銚子間 ▼成田線 成田－我孫子間 成田－銚子間 ▼東金線 大網－成東間 ▼鹿島線 佐原－鹿島神宮間 あす（7日）始発から終日運転を見合わせる在来線は以下の通りです。 ▼久留里線 久留里－上総亀山間 あす（7日）始発から夕方ごろまで運転を見合わせる特急は以下の通りです。 ▼内房線 さざなみ ▼外房線 わかしお ▼総武本線 しおさい JR東日本は今後の気象情報や最新の運転状況に注意して、時間に余裕をもって出かけるよう呼びかけています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924336?utm_source=lootura.com","publishedAt":"2026-09-06T07:59:36.000Z"},{"title":"もはや自作PC感覚か。Acer「Vero 16」はCPUからポート類までとことん交換修理可能","summary":"パソコンは決して安い買い物ではありませんから。お気に入りの1台を、ずっと中身をアップグレードしたり修理交換して大切に使い続けたい。そんなユーザーの修理する権利への関心が高まるなか、Acerから究極のモデルが登場しました。もっとも修理交換しや…","source":"ギズモード・ジャパン","author":"湯木進悟","category":"technology","url":"https://www.gizmodo.jp/article/acers-vero-16-is-its-most-repairable-laptop-ever/?utm_source=lootura.com","publishedAt":"2026-09-06T07:35:00.000Z"},{"title":"靴を細工した小型カメラで少女のスカートの中を盗撮した疑い 高松市の会社員の男（28）を逮捕【香川】","summary":"高松市の大型商業施設で少女のスカートの中を盗撮しようとしたとして、男がきょう（6日）逮捕されました。 香川県迷惑防止条例違反の容疑で逮捕されたのは、高松市の会社員の男（28）です。 警察によりますと、男は、きょう午後1時半ごろ、高松市の大型商業施設で香川県の少女（16）の後ろから近づき、靴に忍ばせた小型カメラで少女のスカートの中を盗撮しようとした疑いです。 警察の調べに対し男は、「下着を盗撮しようとしたことに間違いありません」と容疑を認めているということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924312?utm_source=lootura.com","publishedAt":"2026-09-06T07:54:41.000Z"},{"title":"ハンディファンにプラスアルファ。残暑を乗り切るアイスミスト","summary":"夏も後半戦、そろそろ秋の準備をしたい気持ちもありつつ、実際にはまだまだ暑い日が続いていますね。最近ハマっているのは、頭のてっぺんを冷やすこと。ハンディファンの風をあてるだけでも涼しいのですが、もうひとつプラスするとさらに涼しさを感じられると…","source":"ギズモード・ジャパン","author":"haco","category":"technology","url":"https://www.gizmodo.jp/article/country-and-stream-minty-ice-mist/?utm_source=lootura.com","publishedAt":"2026-09-06T06:00:00.000Z"},{"title":"熊本県で最大震度1の地震 熊本県・水俣市","summary":"6日午後4時48分ごろ、熊本県で最大震度1を観測する地震がありました。 気象庁によりますと、震源地は熊本県天草・芦北地方で、震源の深さはごく浅い、地震の規模を示すマグニチュードは1.7と推定されます。 この地震による津波の心配はありません。 最大震度1を観測したのは、熊本県の水俣市です。 【各地の震度詳細】 ■震度1 □熊本県 水俣市 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924327?utm_source=lootura.com","publishedAt":"2026-09-06T07:53:21.000Z"},{"title":"とうもろこしは「レンジよりフライパン」が正解。ゆでた翌日までおいしい「保存のひと工夫」はね…","summary":"ROOMIE 2023年8月8日掲載の記事より転載甘くてシャキシャキとした食感が楽しめる、とうもろこし。真夏にとうもろこしにかぶりつくおいしさは格別ですよね。でも、大きな鍋で茹でるのは大変だし、時間が経ってくるとなんだか食感がイマイチ……と…","source":"ギズモード・ジャパン","author":"渡辺 文芽","category":"technology","url":"https://www.gizmodo.jp/article/corn-roomie-re/?utm_source=lootura.com","publishedAt":"2026-09-06T05:35:00.000Z"},{"title":"【ソフトバンク】西武に3タテならず 6差で優勝マジック14のまま ...上茶谷が小島に先制打＆3ラン被弾の6回5失点2敗目 打線10安打も3併殺11残塁","summary":"■プロ野球 ソフトバンク2ー5西武 （6日 みずほPayPay） ソフトバンクは西武に同一カード3連勝ならず、2位・西武と6ゲーム差で優勝マジックは14のまま。先発・上茶谷は初回、小島に適時打に打たれ先制されると2回も小島に9号3ランをを献上。上茶谷は6回、林安可に8号ソロを許し6回7安打5失点で2敗目。打線は初回と2回に8回と10安打も3併殺打が響く、6回に山本祐の内野間、9回に近藤の適時二塁打で2点を返すのみ。7回2死満塁で栗原は凡退。 先発・上茶谷は今季33度目（先発7）の登板、8勝1敗、防御率2.59。上茶谷は1回、先頭・カナリオに右安打、滝澤の犠打で1死二塁から小島に右翼線へタイリーツーベースを放たれ1点を先制される。 西武の先発・武内は今季ソフトバンク戦、1勝2敗、防御率5.89だった。1回、先頭・正木が四球も周東が二ゴロ併殺打で好機を作れず。 すると上茶谷は2回に源田に右中間へツーベース、カナリオに四球から2死二・三塁のピンチを招くと再び小島にライトスタンドへ9号3ランを突き刺され、0ー4となった。 直後の2回の攻撃で栗原が右中間へツーベース、柳田は右安打で無死一・三塁の好機に山本祐は空振り三振、柳町は二ゴロ併殺打に倒れた。 3回も2死から正木が四球、周東が中安打で一・二塁とするも近藤は二ゴロに倒れた。 上茶谷は3、4回ともに三者凡退に抑え5回は1死から小島に中安打もネビン、長谷川を凡打に打ち取る。 5回の攻撃も1死から庄子が左安打も正木は遊ゴロ、周東は左飛とつながらない。上茶谷は6回、先頭・林安可にライトスタンドへ8号ソロを運ばれ、0ー5となる。上茶谷は6回を108球、7安打、3四死球、4奪三振の5失点（自責5）で降板。 だが6回の攻撃で近藤が右安打、栗原が左中間へツーベースで無死二・三塁とすると柳田は空振り三振も山本祐の遊ゴロ間で、1ー5とした。 7回、2番手・伊藤は1死から小島に4安打目の内安打、ネビンに中安打で一・二塁も長谷川を見逃し三振、林安可を右飛に打ち取る。 7回の攻撃は西武2番手・篠原に牧原大が左安打に暴投で無死二塁、庄子は見逃し三振、正木は捕ゴロも周東と近藤が連続四球で2死満塁に。ここで西武は3番手左腕・佐藤隼に代わり栗原は初球ストレートを叩き投ゴロに倒れた。 8回、3番手・小林が渡部に四球、源田に中安打も桑原を犠打失敗の投ゴロ、カナリオと滝澤も内野ゴロに仕留める。8回の攻撃は西武3番手・黒木に柳田が中安打、柳町が四球で1死一・二塁も牧原大が二ゴロ併殺だと好機が潰える。 9回は西武・守護神の甲斐野に2死から周東がツーベース、近藤が右中間へタイムリーツーベースで2ー5とするも及ばず。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924322?utm_source=lootura.com","publishedAt":"2026-09-06T07:48:06.000Z"},{"title":"AI監視をあざむくクルマ、人間の目にはド派手に見える","summary":"シャツではなく本物のクルマで実験だ。いまアメリカでは、道行くクルマのナンバープレートを自動で収集するカメラ「Automatic Number Plate Recognition（ALPR/自動ナンバープレート認識）」が物議を醸しています。住…","source":"ギズモード・ジャパン","author":"岡本玄介","category":"technology","url":"https://www.gizmodo.jp/article/anti-anpr-car/?utm_source=lootura.com","publishedAt":"2026-09-06T03:00:00.000Z"},{"title":"JR日南線・志布志～青島 7日も始発から運転見合わせ 大雨の影響続く 鹿児島","summary":"ＪＲ九州によりますと、大雨の影響で、JR日南線はあす7日も志布志と青島の間で運転を見合わせるということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924308?utm_source=lootura.com","publishedAt":"2026-09-06T07:36:06.000Z"},{"title":"まだ7年前のiPhone。限界ギリギリまで使うためにやったこと、“もうムリ“と感じている理由","summary":"2025年9月2日の記事を編集して再掲載しています。さすがにもう限界かもしれません。毎年発売されるiPhone。実は私、毎年Appleの発表会をリアタイしつつも、最新のiPhoneをスルーし続けていました。気がつけばiPhone XS（20…","source":"ギズモード・ジャパン","author":"宮城圭介","category":"technology","url":"https://www.gizmodo.jp/article/iphone_xs_genkai-enc/?utm_source=lootura.com","publishedAt":"2026-09-06T02:35:00.000Z"},{"title":"「男性が浮かんでいる。頭だけ出ている」ふ頭近くの海面で発見された遺体は23歳ベトナム人男性と判明","summary":"5日、福岡市東区の海面で発見された男性の遺体は、23歳のベトナム国籍の男性であることがわかりました。 5日午後0時半ごろ、東区箱崎ふ頭の近くを通りかかった男性から「男性が浮かんでいる。頭だけ出ている」と110番通報がありました。 警察や救急隊が駆けつけ、100メートルほど離れたところに浮いている男性を発見し、救助しましたが、その場で死亡が確認されました。 亡くなった男性について、警察は6日、福岡県志免町に住むベトナム国籍のパート従業員ファム・ヴァン・クイさん（23）であることを明らかにしました。 在留カードなどから身元が判明したということです。 ファムさんの遺体に目立った外傷はなく、警察はファムさんが何らかの原因で海に転落した可能性があるとみて調べを進めています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924310?utm_source=lootura.com","publishedAt":"2026-09-06T07:36:00.000Z"},{"title":"Philips Hueが新スマート照明を一挙発表。ロープみたいな自由変形タイプも","summary":"独ベルリンで開催中のテクノロジー展示会「IFA 2026」にて、お披露目された斬新なスマートライトたち。つくったのは、2013年に誕生した照明ブランド、Philips Hue（フィリップス・ヒュー）です。インテリアに溶け込む照明たち「Lia…","source":"ギズモード・ジャパン","author":"高橋真紀","category":"technology","url":"https://www.gizmodo.jp/article/philips-hue-liane-360-rope-light-signe-pendant-lights/?utm_source=lootura.com","publishedAt":"2026-09-06T02:00:00.000Z"},{"title":"【 齊藤京子 】「カヌレ作ってみました」 手作りカヌレを公開 艶やかな焼き上がりと〝断面ショット〟も チーズケーキはプロ級の腕前","summary":"8月31日、元日向坂46のメンバーで俳優の齊藤京子さんが、自身のInstagramを更新。手作りのカヌレを公開しました。 齊藤京子さん インスタグラムより引用 齊藤さんは「カヌレ作ってみました」と、クマと茶色のハートの絵文字を添え、3枚の写真と1本の動画を投稿。 齊藤京子さん インスタグラムより引用 写真には、白い皿に積み重ねられたカヌレが。表面はカリッとつやのある濃い茶色に焼き上がり、半分にカットされたカヌレからは、もっちりとしていそうな黄色い生地の断面も見えています。 齊藤京子さん インスタグラムより引用 齊藤京子さん インスタグラムより引用 また他にも、焼き型に入ったままのカヌレの写真も。丸いくぼみのひとつひとつに、こんがりと焦げ茶色に焼き上がった生地が収まっています。 齊藤京子さん インスタグラムより引用 齊藤京子さん インスタグラムより引用 さらに、型から外したカヌレが網の上に並んだ写真では、表面には照りがあり、縦の溝が刻まれた形がはっきりと見て取れます。 齊藤京子さん インスタグラムより引用 齊藤京子さん インスタグラムより引用 あわせて投稿された動画にも、同じ皿に盛られたカヌレが映し出されており、皿に盛り付けたカヌレを近くからドリー撮影している様子が収まっています。 齊藤京子さん インスタグラムより引用 齊藤京子さん インスタグラムより引用 齊藤さんは、これまでにも、自身のインスタグラムでチーズケーキ作りにハマっていることを明かし、「ベイクドチーズケーキ」「バスクチーズケーキ」「レアチーズケーキ」「オレオチーズケーキ」「かぼちゃチーズケーキ」「アールグレイチーズケーキ」と、6種類のチーズケーキを投稿。プロ級の腕前を披露しています。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924055?utm_source=lootura.com","publishedAt":"2026-09-06T02:40:55.000Z"},{"title":"でかっ！ 4年前に予想されたApple折りたたみ端末は20インチ","summary":"この記事は「ギズモード・タイムマシン」──すこし前の今日って、何があったんだろう？未来から観察してみたら、懐かしさだけでなく、意外な発見だってあるかもしれません。2022年2月28日、「近未来のAppleには20インチの曲がるディスプレイの…","source":"ギズモード・ジャパン","author":"カタヤママコト","category":"technology","url":"https://www.gizmodo.jp/article/apple-20-inch-foldable-gtm/?utm_source=lootura.com","publishedAt":"2026-09-06T01:00:00.000Z"},{"title":"コンクリート製造会社で在庫管理を担当していた元社員が資材を横領か 佐賀県警が逮捕 売却額は約１００万円","summary":"佐賀県内のコンクリート製品製造会社で資材管理などを担当していた元社員の男が、資材を売却し横領したとして逮捕されました。 ６日、業務上横領の疑いで逮捕されたのは、福岡市城南区に住む配送業、押川佑（おしかわ・ゆう）容疑者（38）です。 押川容疑者は、佐賀県内のコンクリート製品製造会社で資材の在庫管理などを担当していた3年前、資材約2万3400キログラムを104万円で金属買い取り店に売却し横領した疑いがもたれています。 警察によりますと今年3月、押川容疑者が「資材を売却した」と出頭し、事件が発覚しました。 取り調べに対し「間違いありません」と容疑を認めているということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924046?utm_source=lootura.com","publishedAt":"2026-09-06T02:28:33.000Z"},{"title":"マットで紙っぽい独自ディスプレイ。TCLが新型タブレット「A1 NXTPAPER」発表","summary":"開催中のIFAL 2026で、TCLのタブレット新モデル「A1 NXTPAPER」が発表されました。TCLのタブレットA1シリーズには、これでディスプレイの異なる「TAB A1」と「TAB A1 NXTPAPER」、それぞれに11インチの基…","source":"ギズモード・ジャパン","author":"そうこ","category":"technology","url":"https://www.gizmodo.jp/article/tcl-tab-a1-nxtpaper-tablets-mix-business-and-pleasure/?utm_source=lootura.com","publishedAt":"2026-09-05T22:00:00.000Z"},{"title":"#ボブ【 秋元真夏 】「さらに切った」今年7月に〝25cm切っちゃった〟からの「ボブ止まらない」","summary":"元乃木坂46メンバーでタレントの秋元真夏さんが自身のインスタグラムで、更に髪を切ったことを投稿しています。 秋元真夏さん 自身のインスタグラム投稿より 秋元真夏さん 自身のインスタグラム投稿より 秋元さんは「Jam」とプリントの入った白のTシャツを来て、こちらを見下ろすような視線での自撮りを投稿。襟元はすっきりと抜けていて、秋元さんは「さらに切った ボブ止まらない」とハマってしまうほどお気に入りになっている様子を明かしています。 秋元真夏さん 今年7月下旬のインスタグラム投稿より 秋元真夏さん 今年7月下旬のインスタグラム投稿より 秋元真夏さん 今年8月下旬のインスタグラム投稿より 秋元さんは今年7月にも「5年ぶりのボブ 25cm切っちゃった」「はっぴー」とテキストし、ロングからボブに鮮やかに返信する動画を投稿していました。また、先月下旬の誕生日を報告する投稿では、ほんの少し襟元に届くくらいのヘアスタイルを見せていました。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924020?utm_source=lootura.com","publishedAt":"2026-09-06T02:26:19.000Z"},{"title":"【関東甲信地方・東海地方】線状降水帯が発生して大雨災害発生の危険度が急激に高まる可能性 気象庁 6日10時44分発表","summary":"気象庁は「全般気象解説情報（線状降水帯半日前予測）」を6日10時44分に発表しました。 それによりますと関東甲信地方、東海地方では、線状降水帯が発生して大雨災害発生の危険度が急激に高まる可能性があります。 【写真で見る】雨と風のシミュレーション ［気象現象の予想］ 線状降水帯が発生して大雨災害発生の危険度が急激に高まる可能性のある地域と期間は以下のとおりです。 （関東甲信地方）東京地方 ６日夜遅くから７日昼前にかけて （関東甲信地方）伊豆諸島 ６日昼前から７日明け方にかけて （関東甲信地方）埼玉県 ６日夜遅くから７日昼前にかけて （関東甲信地方）神奈川県 ６日夜遅くから７日昼前にかけて （関東甲信地方）千葉県 ６日夜遅くから７日昼前にかけて （東海地方）静岡県 ６日夜のはじめ頃から７日昼前にかけて （東海地方）愛知県 ６日夜のはじめ頃から７日朝にかけて （東海地方）三重県 ６日夜のはじめ頃から７日朝にかけて ［補足事項］ 大雨に対する心構えを一段高めていただき、段階的に発表する防災気象情報やキキクル等の情報に留意してください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924017?utm_source=lootura.com","publishedAt":"2026-09-06T02:25:50.000Z"},{"title":"【 森高千里 】 全国ツアー初日八王子公演の終了を報告 熱気あふれる客席に「負けないように歌うことができました！」","summary":"歌手の森高千里さんが9月5日、自身のインスタグラムを更新。東京・J:COMホール八王子で全国ツアー「森高千里2026-27 今夜もWe feel fine♪」の初日公演が終了したことを報告しました。 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 森高千里さんは、「初日からすごい盛り上がりでしたね〜最高でした〜！」と公演を振り返りました。「皆さんの声がすごく大きくてパワーがあって、私もその声に負けないように歌うことができました！」とも綴り、観客との熱気あふれる時間を伝えています。 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 今回のツアータイトル「We feel fine」について、森高千里さんは「\"みんなで今夜は楽しもう！\"という意味です」と説明しています。 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 公演の前後には、八王子市内の「道の駅 滝山」を訪れた様子も投稿されています。 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 また、「これから皆さんと特別な時間を作っていけたらと思います」とつづり、次回公演は9月19日、茨城・大昭ホール龍ケ崎（龍ケ崎市文化会館）大ホールで開催することを告知しました。森高千里さんは「盛り上がっていきましょ〜」とファンへメッセージを送っています。 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 森高千里さん インスタグラムより引用 この投稿に「ツアー初日の緊張感を感じないとても楽しい熱いステージでした」「新衣装がめちゃくちゃ可愛くて素敵で史上最高にお似合いでした！」「お衣装よく映えてますねー！ステキです」「今日のセトリには感動しました」「森高さんのドラム姿もカッコ良かったなあ」などの声が寄せられています。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924013?utm_source=lootura.com","publishedAt":"2026-09-06T02:19:41.000Z"},{"title":"村上宗隆、17試合ぶりの先制30号2ラン放つもその後は3三振 ホワイトソックスも痛恨の逆転負け","summary":"■MLB ホワイトソックス 4ー6 ツインズ（日本時間6日、レート・フィールド） ホワイトソックスの村上宗隆（26）が本拠地でのツインズ戦に“3番・一塁”で先発出場し、4 打数1安打（1本塁打）2打点3三振だった。1回、村上の17試合ぶりとなる2ラン本塁打などで3点を先制したホワイトソックス。しかし、4回に2点を奪われると、5回にも3ランを打たれ逆転される。その裏にM.バルガス（26）の適時打で1点を返すが、7回に追加点を奪われ、痛恨の逆転負け。ア・リーグ中地区2位のガーディアンズが敗れたため、首位・ホワイトソックスとのゲーム差は変わらず、「2.5」のままとなった。 前日5日のツインズ戦では4打数無安打に終わり2試合連続ノーヒットの村上。この日のツインズ先発は、T.ブラッドリー（25）。1死一塁で迎えた第1打席、2ボール2ストライクからの5球目、外角のスプリットを捉えた打球は、高々と舞い上がり、左翼スタンドに飛び込む2ラン本塁打で、さらに、C.モンゴメリー（24）にもソロ本塁打が飛び出し、ホワイトソックスが初回に3点を先制した。 3回の第2打席は見逃し三振に倒れた村上。4回には先発のA.ケイ（31）が2点を奪われると、5回にも3ラン本塁打を浴び、3－5と逆転されてしまう。それでも5回、ホワイトソックスは2死一・二塁でM.バルガス（26）が左前適時打を放ち、4－5と1点差に詰め寄る。尚も一・二塁で村上に打席が回った。しかし、158キロの速球に空振り三振に倒れ、チャンスをいかすことができなかった。8回の第4打席も、外角低めのカットボールに空振り三振に倒れ、この日は先制の本塁打を放ったものの、その後は3三振に終わり、チームも逆転負けとなった。 【メジャー日本選手1年目のホームラン数】 1位：村上宗隆（26年Wソックス） 30本 2位：岡本和真（26年Bジェイズ） 28本 3位：大谷翔平（18年エンゼルス） 22本 4位：城島健司（06年マリナーズ） 18本 5位：松井秀喜（03年ヤンキース） 16本 6位：井口資仁（05年Wソックス） 15本 吉田正尚（23年Rソックス） 8位：鈴木誠也（22年カブス） 14本 9位：新庄剛志（01年メッツ） 10本 福留孝介（08年カブス） 青木宣親（12年ブルワーズ） 12位：イチロー（01年マリナーズ） 8本 筒香嘉智（20年レイズ）","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924004?utm_source=lootura.com","publishedAt":"2026-09-06T02:10:39.000Z"},{"title":"関東甲信・東海地方に「線状降水帯半日前予測」の情報を発表 大雨災害の発生度が急激に高まる可能性","summary":"気象庁は関東甲信、東海地方に「線状降水帯半日前予測」の情報を出しました。 線状降水帯が発生して、大雨災害発生の危険度が急激に高まる可能性のある地域と期間です。 関東甲信地方 東京地方 6日夜遅くから7日昼前 伊豆諸島 6日昼前から7日明け方 埼玉県 6日夜遅くから7日昼前 神奈川県 6日夜遅くから7日昼前 千葉県 6日夜遅くから7日昼前 東海地方 静岡県 6日夜のはじめ頃から7日昼前 愛知県 6日夜のはじめ頃から7日朝 三重県 6日夜のはじめ頃から7日朝 長野県では、6日夜遅くから7日夜遅くにかけて、雷を伴った激しい雨の降るところがある見込みです。 7日午前6時までに予想される24時間降水量は多いところで 北部80ミリ 中部100ミリ 南部100ミリ 8日午前6時までに予想される24時間降水量は多いところで 北部60ミリ 中部80ミリ 南部100ミリ となっています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2924002?utm_source=lootura.com","publishedAt":"2026-09-06T02:08:20.000Z"},{"title":"“プーチン大統領がキーウへの攻撃を禁止するよう命じた”ペスコフ大統領報道官の話として ロシア・タス通信報道","summary":"ロシアのプーチン大統領が5日、ウクライナの首都キーウへの攻撃を停止するように命じたと報じられました。 アメリカのウィットコフ特使とトランプ大統領の娘婿クシュナー氏は、ロシアとウクライナの和平協議のため5日、モスクワを訪問しています。 これに関連してロシアのタス通信は、ペスコフ大統領報道官の話としてプーチン大統領が「5日午前0時から3日間、キーウへの攻撃を禁止するよう命じた」と伝えました。 一方、ウクライナのゼレンスキー大統領は5日、自身のSNSで「モスクワへの攻撃を控える準備ができている」とした上で、ロシア側にもキーウへの攻撃停止を求めました。 また、ゼレンスキー氏はアメリカの代表団について「モスクワを訪問した後、6日にキーウを訪れる」としています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2923997?utm_source=lootura.com","publishedAt":"2026-09-06T02:00:55.000Z"}];

		const userAgent = navigator.userAgent;
		const isStandalone = isLooturaPwaRuntime();
		const userAgentDataPlatform = navigator.userAgentData?.platform || '';
		const legacyPlatform = navigator.platform || '';
		const maxTouchPoints = navigator.maxTouchPoints || 0;
		const platform = (() => {
			if (/Android/i.test(userAgentDataPlatform) || /Android/i.test(userAgent)) return 'android';
			if (/iPad|iPhone|iPod/i.test(userAgent) || /iPad|iPhone|iPod/i.test(legacyPlatform)) return 'ios';
			if (/Mac/i.test(userAgentDataPlatform || legacyPlatform) && maxTouchPoints > 1) return 'ios';
			return 'desktop';
		})();
		const browser = (() => {
			if (/CriOS/i.test(userAgent)) return 'Chrome iOS';
			if (/FxiOS/i.test(userAgent)) return 'Firefox iOS';
			if (/EdgiOS/i.test(userAgent)) return 'Edge iOS';
			if (/Edg/i.test(userAgent)) return 'Edge';
			if (/OPR|Opera/i.test(userAgent)) return 'Opera';
			if (/Chrome|Chromium|CriOS/i.test(userAgent)) return 'Chrome';
			if (/Safari/i.test(userAgent)) return 'Safari';
			if (/Firefox/i.test(userAgent)) return 'Firefox';
			return 'Other';
		})();

		return {
			appMode: isStandalone ? 'pwa' : 'browser',
			platform,
			browser,
		};
	};

	const trackLooturaContext = (attempt = 0) => {
		if (!window.umami) {
			if (attempt < 20) window.setTimeout(() => trackLooturaContext(attempt + 1), 250);
			return;
		}

		const context = detectLooturaClient();
		window.looturaClient = context;
		window.umami.identify?.(context);

		const sessionKey = `lootura:context-tracked:${context.appMode}:${context.platform}:${context.browser}`;
		if (!sessionStorage.getItem(sessionKey)) {
			sessionStorage.setItem(sessionKey, 'true');
			window.umami.track?.('App context', context);
		}
	};

	const lockPortraitOrientation = async () => {
		const orientationApi = screen.orientation;
		if (!isLooturaPwaRuntime() || !orientationApi?.lock) return;

		try {
			await orientationApi.lock('portrait-primary');
		} catch {
			// iOS Safari and some browsers ignore orientation lock for web apps.
		}
	};

	const enforcePortraitOrientation = () => {
		lockPortraitOrientation();

		window.addEventListener('focus', lockPortraitOrientation);
		window.addEventListener('pageshow', lockPortraitOrientation);
		window.addEventListener('orientationchange', lockPortraitOrientation);
		screen.orientation?.addEventListener?.('change', lockPortraitOrientation);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') lockPortraitOrientation();
		});
	};

	if (!isProduction && 'serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistrations?.().then((registrations) => {
			registrations.forEach((registration) => registration.unregister());
		});
	}

	if (isProduction && 'serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			const reloadForUpdate = () => {
				if (isReloadingForUpdate) return;
				isReloadingForUpdate = true;
				window.location.reload();
			};
			const checkPublishedBuild = async () => {
				try {
					const response = await fetch(`${baseUrl}app-build.json?ts=${Date.now()}`, {
						cache: 'no-store',
						headers: { accept: 'application/json' },
					});
					if (!response.ok) return;
					const publishedBuild = await response.json();
					const publishedBuildId = getBuildId(publishedBuild);
					if (!publishedBuildId || publishedBuildId === currentBuildId) return;
					maybeShowReleaseUpdateNotice(publishedBuild);
				} catch {
					// Update checks should never block normal reading.
				}
			};

			navigator.serviceWorker.addEventListener('controllerchange', reloadForUpdate);

			navigator.serviceWorker
				.register(`${baseUrl}sw.js`, { updateViaCache: 'none' })
				.then((registration) => {
					const checkForUpdates = () => registration.update().catch(() => {});

					checkForUpdates();
					checkPublishedBuild();
					window.setInterval(checkForUpdates, 60_000);
					window.setInterval(checkPublishedBuild, 60_000);
					window.addEventListener('focus', checkForUpdates);
					window.addEventListener('focus', checkPublishedBuild);
					document.addEventListener('visibilitychange', () => {
						if (document.visibilityState === 'visible') {
							checkForUpdates();
							checkPublishedBuild();
						}
					});
				})
				.catch(() => {});
		});
	}

	window.addEventListener('load', () => {
		trackLooturaContext();
		enforcePortraitOrientation();
		window.setTimeout(() => maybeShowReleaseNotice(), 250);
	});
})();</script></body></html>
