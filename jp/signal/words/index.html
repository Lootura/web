const stories = [{"title":"ペットフード販売ベッツ、値下げ禁止を指示か 公取委が立ち入り | 毎日新聞","summary":"犬や猫向けのプレミアムペットフードブランド「セレクトバランス」の製品を、自社が定めた価格より値下げ販売しないよう小売業者に指示した独占禁止法違反（再販売価格の拘束）の疑いがあるとして、公正取引委員会は20日、ペットフード販売のベッツ・チョイス・ジャパン（愛知県春日井市）を立ち入り検査した。関係者へ","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/040/208000c?utm_source=lootura.com","publishedAt":"2026-10-20T03:00:14.000Z"},{"title":"今日の断片を開く","summary":"今日という日が過去に何を残したかを一つだけ見る。ニュースではなく、文脈の小さな窓。","source":"Lootura日誌","author":"","category":"history","url":"https://ja.wikipedia.org/wiki/10%E6%9C%8820%E6%97%A5?utm_source=lootura.com","publishedAt":"2026-10-20T04:00:00.000Z"},{"title":"新名神6人死亡事故 元トラック運転手に拘禁刑7年の判決 津地裁 | 毎日新聞","summary":"三重県亀山市の新名神高速道路で3月、大型トラックが乗用車に衝突し6人が死亡した事故で、自動車運転処罰法違反（過失致死）の罪に問われた元トラック運転手、水谷水都代（みつよ）被告（55）＝広島県安芸高田市＝に対し、津地裁（出口博章裁判官）は20日、求刑通り拘禁刑7年の判決を言い渡した。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/040/260000c?utm_source=lootura.com","publishedAt":"2026-10-20T02:55:03.000Z"},{"title":"「Uber Eats」配達ロボの進路ふさいだ女性逮捕 「人間の仕事奪う」「世界を支配」 米国","summary":"米東部ペンシルベニア州フィラデルフィアで、配達ロボットの前に立ちはだかって進路をふさいだ女性が、公共の秩序を乱した疑いで地元警察に逮捕された。","source":"アイティメディア","author":"[産経新聞]","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002416/?utm_source=lootura.com","publishedAt":"2026-10-20T02:51:33.000Z"},{"title":"2時間で建つ家「災害時の助けに」 和歌山・田辺市が企業と協定 | 毎日新聞","summary":"和歌山県田辺市は、災害時の避難所環境を整備するため、短時間で完成する簡易住宅の「インスタントハウス」を供給する「LIFULL ArchiTech」（東京都）と協定を結んだ。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/310/020000c?utm_source=lootura.com","publishedAt":"2026-10-19T23:15:10.000Z"},{"title":"AWS Transformが機能拡充 Azure Functions用のコードをAWS Lambda用に変換など、Azure→AWSへの移行に対応","summary":"米Amazon Web Services（AWS）は、Azure SDKで書かれた.NETアプリケーションをAWS SDKを用いたコードに変換する新機能をAWS Transformに搭載したと発表しました。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002414/?utm_source=lootura.com","publishedAt":"2026-10-20T02:24:52.000Z"},{"title":"龍馬賞にアンパンマンミュージアム 人生は喜ばせごっこの精神で | 毎日新聞","summary":"土佐の高知が誇る坂本龍馬に続く人材の輩出を願って創設された「龍馬賞」（龍馬賞基金主催）の第41回受賞者に、高知県香美市の公益財団法人「やなせたかし記念アンパンマンミュージアム振興財団」が選ばれた。龍馬の生誕・没日の11月15日、高知市のオリエントホテル高知で授賞式が行われる。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/310/156000c?utm_source=lootura.com","publishedAt":"2026-10-19T22:45:13.000Z"},{"title":"メドレー、不正アクセスで停止中のサービスを作り直して再開へ 従来システムは再稼働させず","summary":"メドレーは10月19日、不正アクセスを受けて停止している医療機関向け業務支援システム「@link（アットリンク）」について、22日から一部機能の提供を再開すると発表した。従来のシステムは再稼働させず、別の環境に新たに構築したサービスにデータを移行して提供する。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002413/?utm_source=lootura.com","publishedAt":"2026-10-20T02:23:28.000Z"},{"title":"小泉大臣、防衛省の“AI基本方針”の見直し検討へ","summary":"小泉防衛大臣は、防衛省のAI=人工知能の活用を推進する基本方針を見直す考えを示しました。 小泉進次郎 防衛大臣 「意思決定のスピードが飛躍的に高まることで、戦闘全体のテンポ、いわゆるバトルリズムについても、これまでとは全く異なる速さになってきています」 小泉防衛大臣はきょう（20日）の会見でこのように述べ、2年前に策定された「防衛省AI活用推進基本方針」について、内容を見直す考えを示しました。 現代におけるAI活用の重要性について、「高度なデータ処理・分析を背景とした戦い方が顕在化している」として、政府が年内に目指している安全保障関連の3文書改定の議論をふまえ、見直しを行うとしています。 小泉大臣はきのう（19日）の参議院・予算委員会で、「（基本方針を）見直す上でもAIに単独で判断させるのではなく、人間の判断を介在させることが重要だ」と強調していました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023963?utm_source=lootura.com","publishedAt":"2026-10-20T03:17:23.000Z"},{"title":"日本郵政「ゆうID」不正ログイン、他社で流出したパスワード使うリスト攻撃か……2段階認証必須に","summary":"安全性強化のため20日から、「ゆうID」へのログインに2段階認証を必須にする。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002412/?utm_source=lootura.com","publishedAt":"2026-10-20T01:19:34.000Z"},{"title":"特殊詐欺の被害を何度も未然に防ぐ 宮崎市の郵便局員2人が「特殊詐欺被害防止マイスター」に認定","summary":"特殊詐欺の被害を何度も未然に防いだとして、宮崎市清武町の郵便局員が警察から「特殊詐欺被害防止マイスター」に認定されました。 警察から「特殊詐欺被害防止マイスター」に認定されたのは、清武郵便局の坂本幸司局長と飯干圭祐さんの2人です。 2人は、先月、それぞれが対応した顧客からキャッシュカードの送付や外国人名義の口座への振り込みの相談を受け、聞き取りを行ったところSNSのやりとりに不審な点があったため、詐欺を疑い、警察に通報しました。 2人が詐欺の被害を未然に防いだのは3回目で、警察は感謝状を贈るとともに、2人を「特殊詐欺被害防止マイスター」に認定しました。 （清武郵便局 飯干圭祐さん） 「（マイスターの指定を受け）身の引き締まる思い」 （清武郵便局 坂本幸司局長） 「アンテナを高くして、緊張感を持って、お客様に対応したい」 県内では、今年、特殊詐欺の被害総額が、8月末時点であわせて9億8470万円に上っています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023910?utm_source=lootura.com","publishedAt":"2026-10-20T03:17:12.000Z"},{"title":"「My SoftBank」サイト停止中 不正アクセスの試み検知 「My Y!mobile」も","summary":"「My SoftBank」の一部のシステムに対して、第三者による不正アクセスの試みがあったため、安全措置の一環として「MySoftBank」「My Y!mobile」「My Menu」のWebサイトを停止している。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002410/?utm_source=lootura.com","publishedAt":"2026-10-20T00:16:09.000Z"},{"title":"東海地方は夕方まで雷や急な激しい雨に注意 あすも昼過ぎ以降に雨雲広がる 愛知･名古屋･岐阜･三重の天気予報（10/20 昼）","summary":"きょうは大気の状態が不安定で、雷や急な激しい雨に注意が必要です。 正午前の名古屋市内は厚い雲に覆われていて、時々雨が降っています。この時間の気温は24.5℃で、空気がジメジメとしています。 きょうは午後も曇り空が続き、雨が降る所もあるでしょう。大気の不安定な状態が続くため、夕方までは雷や急な激しい雨にご注意ください。 最高気温は名古屋で27℃、高山で22℃、尾鷲では29℃の予想です。湿度が高く、平野部を中心に空気がムシムシとするでしょう。 あすも昼過ぎ以降に雨雲広がる 【週間予報】 あすは晴れ間もありますが、昼過ぎ以降は再び雨雲が広がるでしょう。各地で最高気温が30℃以上の真夏日になる見込みです。 あさって木曜日は晴れ間が広がり、日中も過ごしやすくなるでしょう。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023930?utm_source=lootura.com","publishedAt":"2026-10-20T03:16:24.000Z"},{"title":"メール配信のユミルリンクに不正アクセス メアドなど約900万件漏えいか","summary":"専用ASPプランのうち、合計5システムに対して、不正アクセスとデータの出力を確認。メールアドレスを含む情報のべ約900万件が出力されたと試算している。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002409/?utm_source=lootura.com","publishedAt":"2026-10-19T23:59:17.000Z"},{"title":"「違反建築防止週間」にあわせ 宮崎県内各地の工事現場で一斉パトロール","summary":"違反建築防止週間にあわせ、宮崎県内各地の工事現場で一斉パトロールがありました。 このパトロールは、違反建築防止週間にあわせて、毎年、行われているもので、自治体や労働基準監督署などの職員らが参加しました。 このうち、宮崎市のマンションの建設現場では、図面通りに工事が進められているかや、建築基準法や消防法などで定められた表示板が正しく設置されているかなどを確認しました。 （宮崎市建築行政課 清水英二さん） 「きょうのパトロールを通して、少しでも違反建築物がなくなるように現場等を進めてもらえればと思っている」 県によりますと、去年行われた一斉パトロールでは、違反による指導はなかったものの、表示板が正しく設置されていなかった建設現場が10件確認されたということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023784?utm_source=lootura.com","publishedAt":"2026-10-20T03:15:54.000Z"},{"title":"マスク氏、米国のすべての子供にSpaceX株を1株ずつ贈与すると宣言 「Trump Account」経由か","summary":"SpaceXのイーロン・マスクCEOは、米国のすべての子供に自身の保有する同社株を1株ずつ贈ると表明した。総額約105億ドル規模となる見込み。トランプ政権が導入した子供向け投資口座制度「Trump Account」を通じた配布が有力視されているが、具体的な時期や方法は明らかにしていない。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002408/?utm_source=lootura.com","publishedAt":"2026-10-19T23:55:56.000Z"},{"title":"食品・農産物などのアジア市場への輸出や観光客や企業の誘致促進へ 都農町と地域商社が包括連携協定","summary":"観光振興や特産品の販売促進を図ろうと、宮崎県都農町とMRT宮崎放送グループのと地域商社「トレードメディアジャパン」が包括連携協定を結びました。 20日は都農町役場で締結式があり、坂田広亮町長とトレードメディアジャパンの高田智康社長が協定書を取り交わしました。 協定では、食品や農産物などのアジア市場への輸出をはじめ、観光客や企業の誘致促進などに連携して取り組むとしています。 （都農町 坂田広亮町長） 「特に都農町は都農ワインという特産品があるので、そのワインを核に、農産物、水産物をしっかりと世界にアピールしていきたい」 都農町とトレードメディアジャパンは、今後、海外に向けた事業を展開し、地域の活性化を図っていくとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023713?utm_source=lootura.com","publishedAt":"2026-10-20T03:15:21.000Z"},{"title":"旧統一教会・韓総裁の保釈決定 保釈金2300万円 ソウル高裁 | 毎日新聞","summary":"ソウル高等裁判所は19日、世界平和統一家庭連合（旧統一教会）総裁の韓鶴子（ハン・ハクチャ）被告（83）の保釈を認めた。公共放送KBSによると、保釈保証金は2億ウォン（約2300万円）。高裁は理由について「（韓被告の）健康状態や証拠収集の程度などを考慮した」と説明した。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261020/k00/00m/030/001000c?utm_source=lootura.com","publishedAt":"2026-10-19T16:56:46.000Z"},{"title":"音源販売「SONICWIRE」不正アクセス、「Mythosで状況把握」 会員情報最大42万件漏えいか","summary":"運営元は「Claude Mythos」（クロード ミュトス）を活用して状況を把握。「安全な復旧に努めている」という。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002406/?utm_source=lootura.com","publishedAt":"2026-10-19T23:08:04.000Z"},{"title":"カンボジアから警察官装い現金約250万円を詐取容疑で3人逮捕 「トー横」で“かけ子”勧誘か 詐欺拠点とみられる場所の写真も","summary":"カンボジアから警察官などを装ってウソの電話をかけ、20代の男性からおよそ250万円をだましとったとして、女2人と暴力団組員の男が警視庁に逮捕されました。 詐欺の疑いで逮捕されたのは、指定暴力団住吉会系傘下組織の組員・山尾輝斗容疑者（26）と、名古屋市の20歳の女と、北海道釧路市の22歳の女です。 3人はことし1月、カンボジアから京都府の男性（20代）に「マネロン疑惑がかけられている」などと警察官などを装ってウソの電話をかけ、およそ250万円をだまし取った疑いが持たれています。 警視庁によりますと、山尾容疑者が東京・歌舞伎町の「トー横」で女2人を勧誘しカンボジアに渡航させていて、山尾容疑者のスマートフォンからは女2人がいた詐欺拠点とみられる場所の写真が見つかったということです。 山尾容疑者をめぐっては、他にも4人を海外の詐欺拠点に渡航させる目的で誘拐した疑いなどでたびたび逮捕されていて、警視庁は余罪を調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023966?utm_source=lootura.com","publishedAt":"2026-10-20T03:15:01.000Z"},{"title":"米国土安全保障省、中国DeepSeek製品を連邦民間機関から排除する命令","summary":"米国土安全保障省は、中国DeepSeekの製品および関連サービスを連邦民間機関の調達とITシステムから排除する命令を官報で公示した。自社製だけでなく、同社の実装を用いた第三者製品も排除対象とする。連邦調達サプライチェーン安全法に基づく措置で、勧告と証拠を検討した上で発令された。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002405/?utm_source=lootura.com","publishedAt":"2026-10-19T22:07:09.000Z"},{"title":"車いすテニス 小田凱人 地元愛知で1ゲームも与えずに快勝「このまま最後まで突っ走りたい」大会連覇へ好スタート【アジアパラ】","summary":"■第5回 アジアパラ競技大会 愛知・名古屋 車いすテニス（20日、名古屋市東山公園テニスセンター） アジアパラ競技大会2日目、車いすテニス男子シングルス2回戦に小田凱人（20、東海理化）が出場し、Y.カディムベルゲノフ（カザフスタン）をセットカウント2ー0（6－0、6－0）で勝利を収めた。 去年、最年少生涯ゴールデンスラム（四大大会、五輪）を達成した小田、今大会は地元開催となり、会場に登場すると大歓声があがった。第1セットから正確なフォア、相手の動きを見て深い位置への絶妙なショットと完璧な試合運びで6－0と圧倒。 第2セットも集中した表情で隙を見せず、相手に1ゲームも許さずにセットカウント2－0（6－0、6－0）と大会連覇に向けて完璧な勝利でようやく笑顔を見せた。試合後には会場に訪れたファンにサインボールをプレゼントし、地元での勝利を味わっていた。 小田は試合後に「お客さんがたくさん入ってくれてうれしい、このまま最後まで突っ走りたい」と宣言、地元での試合には「いつも海外ばっかりで愛知で大会があるというのは“うわー、やべー”って感じだった」と観客を笑わせると「いい準備をしてきたのでベストを尽くして、この後もレベルが上がってくるので見て欲しい」と話した。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023962?utm_source=lootura.com","publishedAt":"2026-10-20T03:14:33.000Z"},{"title":"Apple、10月28日にイベント開催へ タッチスクリーン「MacBook Pro」など発表か","summary":"Appleは、「Pro and tell.」と題した製品発表イベントをロサンゼルスで開催する。グレッグ・ジョズウィアック上級副社長のX投稿やメディアが公開した招待状で明らかになった。タッチ操作対応のOLED搭載「MacBook Pro」や新型「iPad mini」などの発表が予想されている。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/20/2000002404/?utm_source=lootura.com","publishedAt":"2026-10-19T21:32:03.000Z"},{"title":"”秋の一斉清掃”に合わせネーミングライツを持つ企業が帯屋町公園を清掃活動（高知）","summary":"住宅のリフォームなどを手がける企業が、高知市の帯屋町公園で清掃活動を行いました。 清掃活動を行ったのは、住宅のリフォームなどを手がける「タイヘイ」の社員と、高知市の職員です。「タイヘイ」は帯屋町公園の下にある駐輪場のネーミングライツを取得していて、定期的に清掃活動を行っています。 20日は、県内一斉に行われている「あったか高知。秋のおもてなし一斉清掃」に合わせて、公園内のトイレや駐輪場でゴミ拾いや掃き掃除などを行いました。 ▼タイヘイ 西森大 社長 「カップ麺（の容器）やペットボトル、タバコなども毎回落ちているので、皆さんちょっとでも気づいていただければ」 「タイヘイ」は今後も清掃活動を続け地域に貢献していきたいとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023958?utm_source=lootura.com","publishedAt":"2026-10-20T03:12:05.000Z"},{"title":"転がりながら逃げるヘビ 高速移動の謎を解明 東邦大など研究 | 毎日新聞","summary":"東南アジアなどに生息する「ハダカメヘビ」は、敵に出合うと体を輪の形にして、前転するように転がりながら素早く逃げる珍しい行動を取る。東邦大などの研究チームはこの動きを詳細に解析し、常に頭を進行方向に向けて安定させることで、通常時の4倍もの高速移動を可能にしていたと明らかにした。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/100/114000c?utm_source=lootura.com","publishedAt":"2026-10-19T15:00:13.000Z"},{"title":"アマゾン「プライム感謝祭」 日用品・家電・iPhoneなど人気商品","summary":"10月16日にスタートしたAmazonのプライム会員限定セール「プライム感謝祭」ですが、10月19日23時59分まで開催されます。主要カテゴリの多数の商品がセールになるほか、Amazonデバイスなども値引きされています。","source":"インプレス","author":"編集部","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149280.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"上皇后美智子さま92歳に 天皇皇后両陛下や皇族方があいさつ 体調に大きな変化なく静かで穏やかな日々","summary":"上皇后美智子さまがきょう、92歳の誕生日を迎えられました。両陛下や皇族方がお祝いのあいさつをされています。 こちらは、きょう公開された映像で、上皇后美智子さまがお住まいの仙洞御所で上皇さまと談笑されています。 上皇后さまは、きょう、92歳の誕生日を迎えられました。 午前11時ごろには、天皇皇后両陛下や秋篠宮ご夫妻、愛子さまら皇族方がお祝いのあいさつをされました。 側近によりますと、最近の上皇后さまは、「以前に比べて疲れやすくなることが多く、散策で歩く距離も次第に短くなっている」ということです。 一方で、体調に大きな変化はなく、普段はテレビで音楽番組やスポーツの国際試合を見るなど、「静かで穏やかな日々」を過ごされているということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023956?utm_source=lootura.com","publishedAt":"2026-10-20T03:10:00.000Z"},{"title":"三菱UFJニコス、推しキャラを表示できるプリペイド決済アプリ","summary":"三菱UFJニコスは19日、カードにアニメやゲームのキャラなどをデザインできるプリペイド式決済サービスアプリ「応援+カード(オウエンプラスカード)」の提供を開始した。15歳以上のユーザーが申し込める。発行手数料および年会費は無料。希望者には有料で物理媒体のカードを発行する。","source":"インプレス","author":"関根慎一","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149281.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"東北自動車道で車6台が絡む事故 乗用車1台が炎上し1人が死亡 トラックの1人がけがも意識あり 岩手・盛岡市","summary":"20日未明、岩手県盛岡市の東北自動車道でトラックと乗用車あわせて6台が絡む事故があり、1人が死亡しました。 事故があったのは、東北自動車道の盛岡南インターチェンジ近くの上り線です。警察によりますと20日午前0時半ごろ、トラック4台と乗用車2台のあわせて6台が絡む事故が発生したということです。このうち乗用車1台が炎上し、トラック1台が横転しました。 この事故で炎上した乗用車に乗っていた1人の死亡が確認されました。また、路外に逸脱したトラックの運転手1人がけがをして病院に運ばれましたが、意識はあり命に別状はないということです。 事故の影響で東北自動車道は盛岡南インターチェンジと盛岡インターチェンジの間の上り線が通行止めとなっています。解除のめどは立っていません。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023348?utm_source=lootura.com","publishedAt":"2026-10-19T23:09:19.000Z"},{"title":"「My Softbank」に不正アクセスの試み Webを一時停止","summary":"ソフトバンクは、利用者向け会員サイト「My SoftBank」の一部のシステムに対して、第三者による不正アクセスの試みがあったとし、17日午前8時から「My SoftBank」「My Y!mobile」「My Menu」のWebサイトを一時停止した。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149441.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"【レベル３大雨警報】静岡県・袋井市に発表 08:05時点","summary":"気象台は、20日午前8時05分に、レベル３大雨警報を袋井市に発表しました。 西部では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■浜松市南部 ●レベル２大雨注意報 ■磐田市 ●レベル２大雨注意報 ■袋井市 ●レベル３大雨警報【発表】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023347?utm_source=lootura.com","publishedAt":"2026-10-19T23:05:34.000Z"},{"title":"「ふるさとチョイス」がサービス一時停止 不正アクセスの疑いを検知","summary":"ふるさと納税サイト「ふるさとチョイス」は、不正アクセスの疑いがある事象を検知したため、サービスを一時停止した。被害の拡大防止と安全確保を最優先とした措置で、現在、事実関係や影響範囲について調査を進めている。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149387.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"歩行者が軽乗用車にはねられる事故 高齢とみられる女性が意識不明の重体 運転手の女（75）を過失運転傷害の疑いで現行犯逮捕 岡山市南区","summary":"昨夜（19日）岡山市南区の県道で女性が軽乗用車にはねられる事故がありました。この事故で高齢とみられる女性が意識不明の重体です。 警察によりますと、19日午後9時ごろ、岡山市南区箕島の県道で歩行者の女性が軽乗用車にはねられました。この事故で高齢とみられる女性が倉敷市内の病院に搬送されましたが意識不明の重体です。 警察は車を運転していた岡山市南区のパート従業員の女（75）を過失運転傷害の疑いで現行犯逮捕しました。警察の調べに対して女（75）は「前をよくみずに横断歩道を渡っていた相手にぶつかりけがを負わせた交通事故を起こしたことに間違いない」と容疑を認めているということです。 警察は女から当時の状況を聞くなどして事故の原因を調べるとともに、女性の身元の確認を進めています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023344?utm_source=lootura.com","publishedAt":"2026-10-19T23:04:05.000Z"},{"title":"AIが若手の採用を減らし、ボトルネックは「人間の注意」に アンソロピックで起きた変化","summary":"Anthropicは16日(米国時間)、AIが雇用に与える影響についてのレポートを発表した。公開された2本のレポートでは、AnthropicにおけるAI活用の変化とともに採用や雇用の現場の変化について説明している。ジュニアレベルのエンジニアが減少し、働き方も大きく変わった一方で、AIを駆使する人々の中でも「失業」への懸念は高いとする。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149442.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"姫路 大型トラック衝突し電柱が折れ信号消える","summary":"20日の午前1時すぎ、兵庫県姫路市花田町上原田の交差点で、大型トラックが電柱に衝突する事故があり、電柱が折れ交差点の信号が消えました。警察によりますと大型トラックは南から北に向かって走行していて、運転していた60代の男性は「小動物がでてきた」と話しているということです。 この事故によるけが人はいません。 現場では新しい信号機の設置作業が行われていて、復旧は昼ごろまでかかる見込みです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023343?utm_source=lootura.com","publishedAt":"2026-10-19T23:03:41.000Z"},{"title":"なぜいま「ピックルボール」が人気なのか 誰でも楽しめるルールとちょうどいい運動量","summary":"世界的に人気が拡大しているスポーツで、日本でも競技人口がここ数年で爆発的に増えている「ピックルボール」。メディアで紹介されることも多くなっているので、名前だけは聞いたことがある、という人も少なくないはず。","source":"インプレス","author":"中野悦子","category":"technology","url":"https://www.watch.impress.co.jp/docs/topic/2147284.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.293Z"},{"title":"元グーグルCEOのシュミット氏、アンソロピック株1%保有で巨額利益へ","summary":"（ブルームバーグ）： グーグルの元最高経営責任者（CEO）、エリック・シュミット氏は、米AI開発企業アンソロピックへの初期投資により、同社株を約1%保有している。事情に詳しい複数の関係者が明らかにした。近く予定される同社の新規株式公開（IPO）により、個人として最大級の利益を得る可能性がある。 関係者によると、シュミット氏はアンソロピックのシリーズA資金調達ラウンドで数千万ドルを投資した。非公開情報について話す権限がないとして、関係者は匿名で語った。シュミット氏が当初の投資以降、保有株の一部を売却したかどうかは不明だ。 シュミット氏とアンソロピックはコメントを控えた。 大きな注目を集めるアンソロピックのIPOは、従業員や投資家に巨額の利益をもたらすと見込まれている。直近の資金調達ラウンドに基づくと、同社の共同創業者7人はすでにそれぞれ80億ドル（約1兆2680億円）の資産を保有しており、世界の富豪上位500人を対象とするブルームバーグ・ビリオネア指数入りを果たしている。 Photographer: Eva Marie Uzcategui/Bloomberg シュミット氏（71）が2021年にアンソロピックへ初めて投資した当時、同社の評価額は4億6100万ドルだった。データ会社ピッチブックによると、投資家は先週、同社の妥当な評価額として1兆8000億－2兆ドル程度との見方を示した。このレンジの上限では、アンソロピックの評価額はシリーズA資金調達時の4300倍を超える。 ブルームバーグの指数に基づけば、この評価額を前提とした場合、アンソロピック株の保有によってシュミット氏の純資産は約3分の1増え、800億ドル近くに達する。アンソロピックの直近の評価額9650億ドルを使った場合でも、シュミット氏は現在の575億ドルの資産に100億ドル近くを上乗せすることになる。 シュミット氏は過去15年ほどの間に、テクノロジー投資を積極的に進めた。トゥモロー・ベンチャーズ、イノベーション・エンデバーズ、自身のファミリーオフィスであるヒルスパイアなど複数の投資プラットフォームを通じて投資しており、ピッチブックはこれらを数百件に上るベンチャーキャピタル投資と関連付けている。 初期の投資先は消費者向けインターネット、ソフトウエア、金融テクノロジーが中心だったが、最近はAIが主要な投資分野となっており、アンソロピックのほか、ミストラルAI、リフレクションAI、ワールド・ラボに投資している。 アンソロピックが評価額2兆ドルで株式市場にデビューすれば、シュミット氏による同社への投資は、イノベーション・エンデバーズが11年に行ったウーバー・テクノロジーズへの初期投資を上回ることになる。ウーバーが19年に上場するまでに、その評価額は約1400倍の820億ドルに増加した。 事情に詳しい関係者が今月明らかにしたところでは、アンソロピックは11月9日の週にもIPOの正式なマーケティングを開始する予定で、米感謝祭（同月26日）前に取引を開始できる日程となる。遅くとも年末までには上場する見通しだ。 アンソロピックの他の主要な出資者には、アルファベット、アマゾン・ドット・コム、エヌビディア、マイクロソフトが含まれ、いずれもアンソロピックに数十億ドルを投じている。ベンチャーキャピタルのアルティメーター・キャピタル、ドラゴニア・インベストメント・グループ、グリーンオークス、セコイア・キャピタルも、5月に主導した650億ドルの資金調達ラウンドでそれぞれ20億ドル超を投資した。この資金調達により、アンソロピックの評価額は初めて競合するOpenAIを上回った。 事情に詳しい関係者によると、アンソロピックは、6月に過去最大となる1兆7700億ドル規模のIPOを実施したスペースXに匹敵するか、それを上回る規模での上場を見込んでいる。 原題：Eric Schmidt’s 1% Anthropic Stake Set to Pay Massive Windfall（抜粋） --取材協力：Shirin Ghaffary. もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/3023340?utm_source=lootura.com","publishedAt":"2026-10-19T23:01:14.000Z"},{"title":"JR東日本のコード決済「テッペイ」スタート 2万円超え決済などSuica拡張","summary":"10月20日11時、JR東日本は新たなコード決済サービス「teppay(テッペイ)」をスタートした。モバイルSuicaアプリで利用できるコード決済サービスで、Suica電子マネーの上限額の2万円を超える買い物や、利用者間での残高の送金などに対応する。モバイルPASMOでも2027年春に提供予定。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149413.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.292Z"},{"title":"豪銀NAB、2500人削減へ－コンサルタントや契約社員の活用も縮小","summary":"（ブルームバーグ）： ナショナル・オーストラリア銀行（NAB）は、業務の重複を減らして意思決定を迅速化するため、全社で最大2500人を削減する。コンサルタントや契約社員の活用も減らす。 メルボルンに本拠を置くNABは20日の発表資料で、2027年度に約3億豪ドル（約332億円）の税引き前リストラ費用を計上すると明らかにした。NABの従業員数は約4万2000人。 アンドリュー・アーバイン最高経営責任者（CEO）は「今回の変更の影響を受ける従業員や、その周囲の人々にとって厳しい時期になると認識している」とし、「各自の尊厳を守り、敬意を持って対応する」とコメントした。 オーストラリアの各行は、住宅ローン市場で激しい競争に直面。税制変更や住宅価格の下落を受け、住宅ローンの取扱高は落ち込んでいる。インフレが企業や家計の支出を圧迫し、消費者信頼感も悪化している。 アーバイン氏は「今回の変更は、業務の重複を減らして意思決定を迅速化することで、顧客にとってより良い成果につながると見込んでいる」と説明。「特に本社部門の規模縮小に重点を置いている。顧客対応を担う銀行業務の人員に重大な影響はない」とした。 NABによると、27年度中に約6%の人員を削減する見通しで、このうち約1500人を26年末までに削減する予定だ。アーバイン氏はまた、今回の変更によってチーム間の業務も改善すると述べた。 「チーム間の業務を簡素化し、従業員それぞれの役割、優先事項、責任を明確にすることで、部門横断的なプロセスを改善する」としている。 競合するANZグループ・ホールディングスは昨年、ヌノ・マトスCEOの下で進める広範なコスト削減策の一環として、3000人を超える人員を削減する計画を発表した。 原題：NAB to Cut 2,500 Jobs, Use Fewer Consultants and Contractors (1)（抜粋） もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/3023339?utm_source=lootura.com","publishedAt":"2026-10-19T23:01:11.000Z"},{"title":"「Androidのマイナンバーカード」ついにスタート スマホだけで本人確認","summary":"「Androidのマイナンバーカード」が10月20日スタートした。25年6月に対応した「iPhoneのマイナンバーカード」から約1年4カ月でAndroidスマホでもマイナンバーカードのより多くの機能が利用可能となる。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149394.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.292Z"},{"title":"【速報】仙台北部道路で自衛隊の大型車両と軽乗用車の事故 事故の影響で利府JCT～利府しらかし台（上下）で通行止め","summary":"警察によりますと、20日午前7時頃、宮城県利府町沢乙欠下北の仙台北部道路の下り線で軽乗用車と自衛隊の大型車両の2台が絡む事故が発生しました。 この事故の影響で仙台北部道路は、利府ジャンクションから利府しらかし台インターチェンジの間の上下線で通行止めとなっています。この事故によるけが人の情報はまだ入っていないということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023334?utm_source=lootura.com","publishedAt":"2026-10-19T22:50:03.000Z"},{"title":"ストアーズ、追加費用なしの店舗向けBGMサービス","summary":"店舗向けのPOSレジなどを展開するSTORES(ストアーズ)は、店舗向けBGMサービス「STORES BGM」の提供を開始した。ストアーズのスタンダードプランを契約中のユーザーは手続きや追加料金なしで利用できる。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149402.html?utm_source=lootura.com","publishedAt":"2026-10-20T03:22:42.292Z"},{"title":"【台風情報】「大型」で「猛烈」な台風30号 最大瞬間風速80m/s・中心気圧925hPa予想 今後の進路は？【気象庁・台風情報・雨風の予想シミュレーション】","summary":"気象庁によりますと、大型で猛烈な台風30号は20日午前6時時点でフィリピンの東にあり、1時間におよそ20キロの速さで西北西へ進んでいます。 中心の気圧は935ヘクトパスカル、中心付近の最大風速は55メートル、最大瞬間風速は75メートルで中心の東側650キロ以内と西側500キロ以内では風速15メートル以上の強い風が吹いています。 「台風30号」沖縄の南から台湾方面へ... 台風30号は、今週半ばごろにかけて西北西に進路をとる見込みです。 台風周辺の海域の海面水温は今週後半にかけても、台風が発達する目安の27℃を上回っています。 そのため、22日ごろには、猛烈な勢力を維持したまま沖縄の南に達する見込みです。 雨と風のシミュレーションによると、台風による反時計回りの渦が北西方向に進んで、22日から23日ごろにかけて、沖縄の南に近づく予測が出ています。 22⽇から24⽇頃は、沖縄・奄美では、⼤荒れや⼤しけとなり、台風の進路等によっては警報級の⾼潮となるおそれがあります。 最新の情報をご確認ください。 ▼▼▼ 台風30号(チャンパー) ▼▼▼ ▼20日06時の実況 種別：台風 大きさ：大型 強さ：猛烈な 存在地域：フィリピンの東 進行方向、速さ：西北西 20 km/h 中心気圧：935 hPa 中心付近の最大風速：55 m/s 最大瞬間風速：75 m/s 25m/s以上の暴風域：全域 150 km (80 NM) ▼20日18時の予報 種別：台風 強さ：猛烈な 存在地域：フィリピンの東 進行方向、速さ：西北西 25 km/h 中心気圧：925 hPa 中心付近の最大風速：55 m/s 最大瞬間風速：80 m/s ▼21日06時の予報 種別：台風 強さ：猛烈な 存在地域：フィリピンの東 進行方向、速さ：西北西 25 km/h 中心気圧：925 hPa 中心付近の最大風速：55 m/s 最大瞬間風速：80 m/s ▼22日03時の予報 種別：台風 強さ：猛烈な 存在地域：沖縄の南 進行方向、速さ：西北西 20 km/h 中心気圧：925 hPa 中心付近の最大風速：55 m/s 最大瞬間風速：75 m/s ▼23日03時の予報 種別：台風 強さ：非常に強い 存在地域：沖縄の南 進行方向、速さ：北西 10 km/h 中心気圧：935 hPa 中心付近の最大風速：50 m/s 最大瞬間風速：70 m/s ▼24日03時の予報 種別：台風 強さ：非常に強い 存在地域：沖縄の南 進行方向、速さ：北西 15 km/h 中心気圧：950 hPa 中心付近の最大風速：45 m/s 最大瞬間風速：60 m/s ▼25日03時の予報 種別：台風 存在地域：東シナ海 進行方向、速さ：北北西 15 km/h 中心気圧：985 hPa 中心付近の最大風速：25 m/s 最大瞬間風速：35 m/s","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023316?utm_source=lootura.com","publishedAt":"2026-10-19T22:47:03.000Z"},{"title":"貴重なトレーディングカードを鑑定する「PSA」の鑑定済みカード配送車両を狙った盗難事件が発生","summary":"トレーディングカードの鑑定およびグレーディングを行う「PSA」が、鑑定済みカードを配送する車両を狙った盗難事件にあったことが明らかになりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-psa-graded-trading-cards-stolen-delivery-truck/?utm_source=lootura.com","publishedAt":"2026-10-20T03:19:00.000Z"},{"title":"【レベル３大雨警報】新潟県・新潟市に発表 07:25時点","summary":"気象台は、20日午前7時25分に、レベル３大雨警報を新潟市に発表しました。 下越では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■新潟市 ●レベル３大雨警報【発表】 ■長岡市 ●レベル２大雨注意報 ■三条市 ●レベル２大雨注意報 ■柏崎市 ●レベル２大雨注意報 ■小千谷市 ●レベル２大雨注意報 ■加茂市 ●レベル２大雨注意報 ■見附市 ●レベル２大雨注意報 ■燕市 ●レベル２大雨注意報 ■五泉市 ●レベル２大雨注意報 ■阿賀野市 ●レベル２大雨注意報 ■佐渡市 ●レベル２大雨注意報【発表】 ■田上町 ●レベル２大雨注意報 ■出雲崎町 ●レベル２大雨注意報","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023332?utm_source=lootura.com","publishedAt":"2026-10-19T22:25:37.000Z"},{"title":"ADHDの人は死亡リスクが高いがADHD治療薬を服用するとリスクが軽減される可能性","summary":"注意力の欠如や多動性、衝動性などを特徴とする注意欠如多動症(ADHD)は、人間関係や学業、仕事など日常生活のさまざまな場面に支障を来す発達障害です。そんなADHDを持つ人は自殺や事故などさまざまな原因による死亡リスクが高いものの、ADHD治療薬によって死亡リスクが軽減される可能性があるとの研究結果が発表されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-adhd-drugs-reduce-risk-early-death/?utm_source=lootura.com","publishedAt":"2026-10-20T03:00:00.000Z"},{"title":"【レベル３大雨警報】石川県・金沢市に発表 07:11時点","summary":"気象台は、20日午前7時11分に、レベル３大雨警報を金沢市に発表しました。 石川県では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■金沢市 ●レベル３大雨警報【発表】 ■七尾市 ●レベル２大雨注意報 ■小松市 ●レベル２大雨注意報 ■輪島市 ●レベル３大雨警報 ■珠洲市 ●レベル２大雨注意報 ■加賀市 ●レベル２大雨注意報 ■羽咋市 ●レベル２大雨注意報 ■かほく市 ●レベル２大雨注意報 ■白山市 ●レベル２大雨注意報 ■能美市 ●レベル２大雨注意報 ■野々市市 ●レベル２大雨注意報 ■川北町 ●レベル２大雨注意報 ■津幡町 ●レベル２大雨注意報 ■内灘町 ●レベル２大雨注意報 ■志賀町 ●レベル２大雨注意報 ■宝達志水町 ●レベル２大雨注意報 ■中能登町 ●レベル２大雨注意報 ■穴水町 ●レベル２大雨注意報 ■能登町 ●レベル２大雨注意報","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023330?utm_source=lootura.com","publishedAt":"2026-10-19T22:12:51.000Z"},{"title":"ハッカーが企業のシステムに侵入して8億円分のギフトカードを不正発行、全米の店舗で高額商品を買いあさっていたことが判明","summary":"アメリカの大手オフィス用品販売企業「Staples(ステープルズ)」の社内システムに中国系犯罪組織が侵入し、500万ドル(約8億円)以上に相当するギフトカードを不正発行していたことが明らかになりました。犯罪組織は発行したギフトカードを使ってアメリカ各地の小売店で大量の電子機器を購入し、一部の商品を中国に送っていたとのことです。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-chinese-crime-ring-hacked-staples/?utm_source=lootura.com","publishedAt":"2026-10-20T02:05:00.000Z"},{"title":"食らいつき「終盤の鬼」実る 仙台育英・砂、2試合連続複数打点 | 毎日新聞","summary":"高校野球・秋季東北大会決勝（19日、宮城・石巻市民球場） ○仙台育英（宮城1位）8―3青森山田（青森2位）● 準々決勝、準決勝と2試合続けて延長タイブレークを制して迎えた決勝。リードを広げて流れを大きく引き寄せたのは、準決勝でサヨナラ打を放った仙台育英の2年・砂涼人だった。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/050/189000c?utm_source=lootura.com","publishedAt":"2026-10-19T09:28:33.000Z"},{"title":"曲げてもねじっても3D形状を読み取れる柔らかいセンサーシートをMITが開発、VRやリハビリへの応用に期待","summary":"マサチューセッツ工科大学(MIT)の研究チームが、曲げたりねじったりした際の形状を読み取り、コンピューター上で3D形状として再現できる柔らかいセンサーシートを開発しました。内部に埋め込んだ光の通り道を使って変形を検出する仕組みで、ゲームやVR、ロボットの遠隔操作、リハビリテーションへの応用を想定しています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-optical-waveguide-arrays-shape-sensing/?utm_source=lootura.com","publishedAt":"2026-10-20T02:03:00.000Z"},{"title":"「どうしても行きたかった」 休職中にパチンコ 佐倉市職員処分 | 毎日新聞","summary":"病気休職中にパチンコをしていたとして、千葉県佐倉市は19日、市上下水道部の主査補の男性職員（49）を停職6カ月の懲戒処分にした。地方公務員法上の信用失墜行為に当たると判断した。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261019/k00/00m/310/184000c?utm_source=lootura.com","publishedAt":"2026-10-19T09:16:34.000Z"},{"title":"イーロン・マスクがSpaceX株をアメリカのすべての子どもに贈ると発表、トランプ口座を通じて提供予定","summary":"SpaceXのイーロン・マスクCEOが、アメリカのすべての子どもにSpaceXの株式を1株ずつ贈ると発表しました。この株式はアメリカの子ども向けの資産形成口座である「トランプ口座」を通じて提供される予定です。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-elon-musk-spacex-stock-trump-accounts/?utm_source=lootura.com","publishedAt":"2026-10-20T01:53:00.000Z"},{"title":"米中ロ首脳会談の調整 ルビオ米国務長官が認める プーチン大統領が提案 ウクライナ情勢を議題に","summary":"アメリカのルビオ国務長官は、トランプ大統領とロシアのプーチン大統領、中国の習近平国家主席による米中ロ首脳会談が検討されていると明らかにしました。 記者 「（米中ロ首脳会談が提案されたとの報道は）正しいですか。調整しているのですか」 アメリカ ルビオ国務長官 「会談の話は出ている。具体的なことが決まったかはわからない」 ルビオ国務長官は19日、プーチン大統領がトランプ大統領に対し、習主席を交えた米中ロ3か国の首脳で、ウクライナ情勢を協議することを提案したと報じられたことについて、このように話しました。 そのうえで、「トランプ大統領は、ウクライナとロシアの戦闘の終結を望んでいる」とし、「我々は戦闘終結を促すために出来る限りのことを行ってきたし、今後も続けていく」と主張しました。 米中ロ首脳会談をめぐっては、ウォール・ストリート・ジャーナルが来月、中国で開かれるAPEC＝アジア太平洋経済協力会議の首脳会議にあわせて開催することをプーチン氏がトランプ氏に提案したと報じていました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023284?utm_source=lootura.com","publishedAt":"2026-10-19T17:22:25.000Z"},{"title":"コンビニのおにぎり1個に払える金額は？GIGAZINE読者から圧倒的支持を集める3大コンビニは？","summary":"総務省統計局によると、2021年9月から60カ月連続で消費者物価指数(CPI)は上昇し続けています。物価が上がり続ける日本において、「コンビニのおにぎり1個当たり、いくらまで許せるか？」を、GIGAZINE読者に聞いてみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-gigazine-convenience-store-rice-ball/?utm_source=lootura.com","publishedAt":"2026-10-20T00:00:00.000Z"},{"title":"フーシ派が弾道ミサイル攻撃 イエメン暫定政権側53人死亡、200人以上けが","summary":"中東イエメンで、親イラン武装組織フーシ派が暫定政権側の軍事施設を弾道ミサイルで攻撃し、少なくとも53人が死亡、200人がけがをしました。 AP通信によりますと、攻撃があったのはイエメン南部シャブワ州にある軍事施設で、19日フーシ派が発射した弾道ミサイルが着弾しました。 これまでに少なくとも53人が死亡、200人がけがをしたということですが、地元当局は、死者数はさらに増える可能性があるとしています。 フーシ派は攻撃を認めたうえで、施設について、サウジアラビア軍の将校らによって運営されていて、サウジ側にも死者が出たと主張しています。 イエメンでは今年夏以降、暫定政権側とフーシ派の戦闘が再び激化していて、AP通信は今回の攻撃は戦闘再燃後、最大規模の犠牲者が出た攻撃になったと報じています。 一方、サウジアラビア主導の連合軍も、フーシ派から領土を奪還するため大規模な軍事作戦を行っていて、戦闘のさらなる激化が懸念されています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023283?utm_source=lootura.com","publishedAt":"2026-10-19T17:20:34.000Z"},{"title":"トイレ清掃も JR東、センサーやAI・ロボットで「駅舎清掃DX」","summary":"JR東日本は、東京・北区の赤羽駅において、AIやIoT、清掃ロボットを活用する「駅舎清掃DX」の実証実験を実施する。期間は10月27日～2027年1月中旬。一部の内容は王子駅・十条駅・東十条駅でも実施される。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149225.html?utm_source=lootura.com","publishedAt":"2026-10-19T23:18:18.182Z"},{"title":"ミラノの高級店、衝突警戒で営業切り上げ－政府は治安対策強化へ","summary":"（ブルームバーグ）： イタリア政府は暴力行為を抑えるべく、治安対策を強化する方針だ。ミラノでは新たな衝突への懸念から、高級店などが19日、営業時間を繰り上げて閉店した。 メローニ政権は、警察が未成年のデモ参加者に事情を聴く権限を拡大し、集団での集合を制限する新たな政令を、早ければ20日にも承認する方向だ。コリエレ・デラ・セラ紙が、ローマで開かれた政府会合での決定を引用して報じた。 高級ブランド「セリーヌ」の店舗で空になった商品棚（10月19日、ミラノで） ミラノでは先週末に暴力行為が発生し、暴徒が店舗から商品を略奪したほか、建物などに放火した。さらなる衝突への警戒が強まる中、高級ブランド店が建ち並ぶモンテナポレオーネ通りでは、19日午後、被害の拡大を懸念して複数の店舗が営業を切り上げた。同地区ではジョルジオ・アルマーニ、プラダ、ミュウミュウの店舗などが早めに店を閉め、人通りは次第に途絶えた。 メローニ首相はSNSへの投稿で暴力行為を非難し、「デモをするのは権利だが、われわれの街に火を放つのは権利ではない」と述べた。 原題：Italy Set to Tighten Rules As Milan Luxury Shops Lock Up Early （抜粋） --取材協力：Flavia Rotondi. もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/3023279?utm_source=lootura.com","publishedAt":"2026-10-19T17:01:02.000Z"},{"title":"ローソン、九州初の車中泊「RVパーク」 佐賀･長崎･大分の11店舗","summary":"ローソンは、店舗駐車場を活用した車中泊サービス「RVパーク」を、30日から佐賀県、長崎県、大分県の計11店舗に拡大する。九州エリアでは初の展開となり、全国の対応店舗は37店舗から48店舗に増える。利用料金は1回1区画あたり2,500～3,000円。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149282.html?utm_source=lootura.com","publishedAt":"2026-10-19T23:18:18.182Z"},{"title":"「実践的訓練」でサイバー攻撃へ備え 「ふるさとチョイス」「ニフティ」「阪急阪神百貨店」19日も相次ぐサイバー攻撃【news23】","summary":"連日続くサイバー攻撃に対し、企業はどう対応していくのか。都内では本番さながらのサイバー攻撃に対応する訓練が行われています。 連日相次ぐサイバー攻撃。19日も新たな被害が出ています。 「ふるさとチョイス」を運営するトラストバンクは19日、システムに不正アクセスの疑いがあることを検知し、サービスを一時停止したと発表しました。 インターネット接続サービスを提供する「ニフティ」も19日夜、個人情報およそ54万件が流出したおそれがあると明らかに。 また、阪急阪神百貨店は、予約サイトなどが不正アクセスを受け、およそ126万件の個人情報が流出したと発表。ほぼ全会員の情報が流出したということです。 情報を守るために企業はどうすればいいのか。 喜入友浩キャスター 「こちら、その名もサイバージム。これからまさにサイバー攻撃に対する実践的なトレーニングが行われます。いわば道場です」 東京・赤坂では、企業のサイバーセキュリティの担当者が集まり、訓練が行われていました。訓練では、模擬ハッカーが脆弱性を突き、そこからシステムに侵入します。 喜入友浩キャスター 「開始から10分ですが、前のモニターにドクロマークが出てきて、侵入されたと担当の方が話しています」 対応策を練りますが、次々に攻撃が来るため、食い止めきれません。 喜入友浩キャスター 「すごい勢いでスクロールしたりして、何かこう探したりチェックしたりしていますね。かなり慌ただしくなってきました。いろんなモニターを行ったり来たりして確認をしています」 攻撃は進み、ついには… 喜入友浩キャスター 「どんどんと、ほぼすべてのパソコンが今、ハッキングされてしまいました」 最終的にはシステムが乗っ取られ、画面には「ハック」の文字が並びました。 参加者からは… 参加した企業のセキュリティ担当者 「（Q.サイバー攻撃を経験したことはあるか）僕は初めてです。（Q.もしこれが本番だったら）今の状況だと、ちょっと怖いですよね。最近AIが台頭してきているので、被害も広がっていっている状況なので、我々としても早急に対策ができるように進めていかないといけないと感じている」 「見えないところで話が進んでいって、いつの間にか不正な形でアクセスされて、パソコンが使えないってなるところが、すごくドキッとした」 担当者によると、こうした訓練を受けた企業や組織は、一年でこれまでの2倍になったといいます。 VLCセキュリティアリーナ エグゼクティブトレーナー 浅香洋介さん 「緊迫感を持って受講される方が非常に増えている。セキュリティ要員って今、非常に少ないと言われているので、セキュリティ要員を1人でも多く増やして、対応できる人が多くなればなるほど、やっぱり組織としては強くなるのかなと考えております」","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023276?utm_source=lootura.com","publishedAt":"2026-10-19T16:44:05.000Z"},{"title":"三越伊勢丹、年会費7.7万円の招待制カード Visa Infiniteを百貨店初導入","summary":"エムアイカードは、Visaの最上位ランク「Visa Infinite」を採用した招待制クレジットカード「MICARD+ THE ONE(エムアイカード プラス ザ・ワン)」を27年2月上旬に発行する。年会費は77,000円で、家族会員は4枚まで無料。国内百貨店業界でVisa Infiniteを導入するのは初。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149251.html?utm_source=lootura.com","publishedAt":"2026-10-19T23:18:18.182Z"},{"title":"高市政権発足1年 高支持率を支える“高市流の言葉” 発信力が一転…諸刃の剣にも 問われる2年目の真価【news23】","summary":"10月21日で、就任から1年を迎える高市総理。news23では、2夜にわたってその1年を特集します。第1回は高市総理の「言葉」について。依然として高い内閣支持率を維持するその背景に迫ります。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023277?utm_source=lootura.com","publishedAt":"2026-10-19T16:39:09.000Z"},{"title":"エミュレーターを使わずにブラウザ上でPSPゲームが動作するというプロジェクト「PSP Web Recomp」","summary":"PSPゲームをエミュレーターを介することなくウェブブラウザで実行できるというプロジェクト「PSP Web Recomp」を、ソフトウェアエンジニアのsnuri00氏がGitHubで公開しています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-psp-web-recomp/?utm_source=lootura.com","publishedAt":"2026-10-19T23:00:00.000Z"},{"title":"「子ども2人目望む」過去最少28.2％に お金・時間・年齢…家庭の数だけ見える事情 子どもの将来と目の前の生活…広がる「二重の不安」【news23】","summary":"子育て中の親で「2人目を望む」と回答した人が3割を下回り、過去最少となったことがわかりました。そこには、「望んでも踏み出しにくい」現実があるようです。街で様々な思いを聞きました。 ※動画内で紹介したアンケートは20日午前8時で終了します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023273?utm_source=lootura.com","publishedAt":"2026-10-19T16:24:10.000Z"},{"title":"イギリスとアメリカをつないでいた極秘ホットラインプロジェクト「SIGSALY」とは？","summary":"第二次世界大戦時、アメリカとイギリスは敵国に通信を傍受される心配のない、極秘ホットラインの「SIGSALY」を運用していました。このSIGSALYについて、イギリスの国立博物館組織である帝国戦争博物館が解説しています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-sigsaly/?utm_source=lootura.com","publishedAt":"2026-10-19T22:00:00.000Z"},{"title":"「パリがここまで荒らされるとは…」生活費高騰などに抗議 「夜間外出禁止令」の要請も フランス大規模デモが欧州各地にも拡大【news23】 | TBS NEWS DIG","summary":"いまだ収まる気配がみえないフランスの抗議デモ。一部で暴徒化し、放火や略奪が相次ぐ事態となっています。パリに暮らす日本人が緊迫する現地の様子を語りました。","source":"TBSニュース","author":"TBS NEWS DIG","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023271?utm_source=lootura.com","publishedAt":"2026-10-19T16:06:00.000Z"},{"title":"CSSでテーマ設定を行いMermaidダイアグラムをSVGとしてレンダリングする軽量なオープンソースライブラリ「Pele」をObsidianの作者kepanoがリリース","summary":"PeleはMermaid記法で記述された図をSVG形式にレンダリングするための軽量なオープンソースライブラリです。特徴の一つにCSS変数ベースのテーマ機能があり、図の見た目を簡単にカスタマイズできます。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261020-pele/?utm_source=lootura.com","publishedAt":"2026-10-19T21:00:00.000Z"},{"title":"清里町でクマ１頭を駆除 車を荒らした個体か","summary":"10月19日、道東の清里町でオスのヒグマ1頭が駆除されました。 町は軽乗用車を荒らした個体の可能性があるとみて調べています。 19日午後2時ごろ、清里町青葉の畑に体長1メートルほどのオスのクマが出没し、その後、ハンターに駆除されました。 畑から4キロほど離れた札弦町では18日、軽乗用車がクマに荒らされていました。 車の窓ガラスには幅16センチほどの足跡がついていて、駆除されたクマの足と大きさがほぼ同じことから、町は、同一個体の可能性があるとみて調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023270?utm_source=lootura.com","publishedAt":"2026-10-19T16:04:18.000Z"},{"title":"ニフティ、54万件超漏えいの可能性 光回線の申し込みシステムに不正アクセス","summary":"ニフティが、同社の回線申し込みや受付管理に関するシステムが不正アクセスを受け、最大54万2513件の情報が漏えいした可能性があると発表した。","source":"アイティメディア","author":"[ITmedia]","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002399/?utm_source=lootura.com","publishedAt":"2026-10-19T10:34:36.000Z"},{"title":"知人の２０代女性に性的暴行疑い 教員の男逮捕","summary":"函館の自宅で20代の知人女性に性的暴行を加えた疑いで、公立学校教諭の男が逮捕されました。 逮捕されたのは函館の公立学校教諭、阿部修也（あべ・しゅうや）容疑者25歳です。 阿部容疑者は先月10日夜、松陰町の自宅で20代の知人女性に性的暴行を加えた疑いがもたれています。 警察の調べに対し、阿部容疑者は行為については認めているということですが、「無理やりではなかった」として容疑を一部否認しています。警察が事件のいきさつのほか、余罪を調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3023265?utm_source=lootura.com","publishedAt":"2026-10-19T16:01:12.000Z"},{"title":"スクエニアカウントに不正ログイン、他社で流出の情報使用か 全アカウントのパスワード強制リセットも視野に","summary":"ゲーム大手のスクウェア・エニックスは10月19日、「スクウェア・エニックス アカウント」への不正ログインを確認したと発表した。他社から流出したとみられるID・パスワードを悪用する、いわゆる「パスワードリスト型攻撃」によるもので、パスワードを使い回している利用者などに至急変更するよう呼びかけた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002397/?utm_source=lootura.com","publishedAt":"2026-10-19T09:58:47.000Z"},{"title":"JPモルガン、経済安保関連の取り組みに初年度2300億ドル投入","summary":"（ブルームバーグ）： 米銀JPモルガン・チェースは、米国の経済安全保障を強化する産業に10年間で1兆5000億ドル（約240兆円）を投じるプログラムの初年度に2300億ドルの資金を投入した。 19日の発表資料によると、エネルギー自立や防衛・航空宇宙など複数の重点分野で、株式やデットファイナンスによる資金調達を手掛けた。韓国の高麗亜鉛がテネシー州に建設する74億ドル規模の製錬所、地熱エネルギー開発会社ファーボ・エナジーの新規株式公開（IPO）、再生可能エネルギー会社ブルーフィールド・ソーラー・インカム・ファンドをドラックス・グループが買収するための債務による資金調達などが含まれる。 JPモルガンの共同社長で商業・投資銀行部門を率いるダグ・ペトノ氏はインタビューで、「最大の教訓は、機会が当初考えていたよりはるかに大きく、課題もより複雑だということだ」と述べた。「やるべきことは多い」とも語った。 同行は、長年にわたり地政学的リスクに警鐘を鳴らしてきたジェイミー・ダイモン最高経営責任者（CEO）の下、「セキュリティー・アンド・レジリエンシー・イニシアチブ」と呼ばれるプログラムを開始した。 初年度の資金供給額は当初目標の約15%に相当するが、ダイモン氏は最終的な総額が「はるかに大きく」なる可能性があると述べている。JPモルガンはこの取り組みを専任で担当する35人余りのバンカーからなるチームを編成し、対象地域をカナダと欧州にも拡大した。 このプログラムでは、国家安全保障に不可欠な産業の企業に、JPモルガン自身の資本を最大100億ドル直接投資する計画も掲げている。 原題：JPMorgan Deployed $230 Billion in First Year of Security Effort （抜粋） もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/3023267?utm_source=lootura.com","publishedAt":"2026-10-19T16:01:07.000Z"},{"title":"阪急阪神百貨店などの共通ID、ほぼ全会員分漏えい 約126万件 予約サイトに不正アクセス","summary":"エイチ・ツー・オー リテイリングは10月19日、子会社の阪急阪神百貨店が運営する予約サイトなどが不正アクセスを受け、グループ企業の共通会員ID「H2O ID」に関する個人情報約126万件の一部が漏えいしたと発表した。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002398/?utm_source=lootura.com","publishedAt":"2026-10-19T09:53:08.000Z"},{"title":"相次ぐ不正アクセスで需要高まる｢ホワイトハッカー｣ セキュリティー人材は約11万人不足 専門学校で進む育成","summary":"企業や自治体などでも相次ぐサイバー攻撃。 「名古屋デザイン＆テクノロジー専門学校」には、コンピューターなどの高度な知識や技術を善良な目的のために利用する「ホワイトハッカー」を育成するコースがあります。 いま、サイバー攻撃で世間を混乱させているのは、「ブラックハッカー」と呼ばれる悪意あるハッカーのことです。 （ホワイトハッカー専攻担任 大谷啓介さん） Q.パソコンに向かって何をしている？ 「アプリケーションの開発の授業をしている」 Q.ホワイトハッカーの育成に役立つ？ 「アプリを開発することで、どう動いて設計されているかを学び、セキュリティーに強い作りに設計することが可能になる」 相次ぐ不正アクセスで「ホワイトハッカー」の需要高まる これまでには、全国の自治体の防災情報サービスのシステムを運営するIT企業「アルカディア」への不正アクセスで、自治体に関連した情報漏えいもおきました。 こうしたことから「ホワイトハッカー」への需要は急速に高まっています。 この専門学校では、約50人の学生が4年間でホワイトハッカーの国際認定資格の取得を目指し、学んでいます。 （3年生 中澤愛莉さん 21歳） 「パソコンに向かって速くコマンドを打ち、サイバー攻撃から守るだけではなく、コミュニケーションや人から聞くことの大事さも最近学んだ」 学生たちは知識や技術の習得に加え、企業の内情をヒアリングしてしっかり対応できるコミュニケーション力も大事だという自覚が。 企業向けに「セキュリティー対策」を提案するカリキュラムも 学校では実際に、企業が抱える課題に応じたセキュリティー対策を提案するなど、実践的なカリキュラムも行われています。 （3年生 岩井愁翠さん 20歳） Q.学びになったことは？ 「企業プロジェクト。プレゼンして企業の社長から『取り入れて成果が出ている』と言われ、自分の学びになったと実感している」 提供：名古屋デザイン＆テクノロジー専門学校 （3年生 杉山大成さん 20歳） Q.どんなホワイトハッカーになりたい？ 「セキュリティーで弱いところがある会社を助けたい」 （3年生 岩井愁翠さん 20歳） Q.あなたにとってホワイトハッカーとは？ 「陰ながら社会を支える一つの柱」 日本はサイバー攻撃に弱い？ これまでの卒業生は通信会社や医療業界など、さまざまな業界で企業のシステムを守るプロフェッショナルとして活躍しています。 （ホワイトハッカー専攻担任 大谷啓介さん） Q.日本はサイバー攻撃に弱い？ 「AIの進歩によって日本語の言語の壁がなくなり、どこの国からでも攻撃しやすくなり日本への攻撃が増え始めた」 Q.現状を変えるためには？ 「人材育成は急務。セキュリティー人材が約11万人不足しているので、セキュリティーの知識を持った人間を育成していきたい」","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022249?utm_source=lootura.com","publishedAt":"2026-10-19T08:40:12.000Z"},{"title":"ChatGPTにスライド作成機能「ChatGPT Slides」 共同編集も","summary":"OpenAIは、ChatGPTでプレゼン資料を作成・編集できる「ChatGPT Slides」を提供開始した。Pro(16,800円～)、Business、Enterpriseプランで利用できる。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149226.html?utm_source=lootura.com","publishedAt":"2026-10-19T18:20:29.481Z"},{"title":"凍結路面や雪道の運転に慣れていない自治体の職員らを対象にした車の運転の講習会 岩手・雫石町","summary":"冬場の運転にも備えが必要です。 凍結路面や雪道の運転に慣れていない自治体の職員らを対象にした講習会が岩手県雫石町で行われました。 この講習会は、冬の間も安全運転で業務にあたってもらうことを目的に、2012年から毎年行われているものです。 19日は県と花巻市、北上地区の消防署員合わせて12人が集まりました。 参加者は、鉄板に水をまいて人工的に再現した凍結路面の上で、急ブレーキをかけた時や横滑りした場合の対処方法などを学びました。 （受講者は） 「実際に運転してみると、思うようにハンドルが切れなかったり、ブレーキがかけられなかったり、難しいなと感じました」 この運転講習会は29日まで行われます。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022784?utm_source=lootura.com","publishedAt":"2026-10-19T08:40:00.000Z"},{"title":"「ゲオ」「セカスト」運営元に不正アクセス 公式アプリや通販を停止、メンテナンス実施中","summary":"ゲームやスマートフォンなどを販売する「ゲオ」や、リユースショップ「セカンドストリート」などを展開するセカンドリテイリングは10月17日、社内システムへの不正アクセスを確認したと発表した。二次被害を防ぐため、同日午後9時から両ブランドなどのアプリやWebサービスを停止し、システムメンテナンスを実施している。再開時期は目途が確認でき次第案内するとしている。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002392/?utm_source=lootura.com","publishedAt":"2026-10-19T08:08:39.000Z"},{"title":"元特捜検事「検察の理念に反する取り調べではなかった」“検察なめんなよ”取り調べの違法性問う裁判で改めて無罪主張","summary":"特捜検事の取り調べを問う裁判で、罪に問われた検事は「検察の理念に反する取り調べではなかった」と主張しました。 （田渕大輔検事）「私は、いち検察官として一生懸命自分の職務を遂行して取り調べをやってきた。（罪を）到底受け入れることはできません」 10月19日、法廷で改めて自らの無罪を主張した、田渕大輔検事（54）。 【田渕検事による取り調べ映像より】 「検察なめんなよ」 「あなたはプレサンスの評判をおとしめた、世間の評判をおとしめた大罪人ですよ」 田渕大輔検事（54）は大阪地検特捜部に所属していた2019年、不動産会社「プレサンスコーポレーション」と学校法人の土地取引をめぐる巨額横領事件の捜査で、当時の社長・山岸忍さん（63）の部下にどう喝的・侮辱的な取り調べをしたとして特別公務員暴行陵虐の罪に問われています。 これまでの裁判で田渕検事は無罪を主張してきました。 10月16日の被告人質問では、「検察なめんなよ」と迫った発言について… （田渕大輔検事）「検察のひとりである私もしっかり覚悟してこの取り調べに臨んでいる。その私の問いかけを軽々に扱わないでほしいと」 （弁護人）「なめたらひどい目にあわせるという意味ですか?」 （田渕大輔検事）「違います」 発言は「取り調べに向き合ってもらいたい」という思いからで、脅したり侮辱したりする意図はなかったと主張しました。 10月19日の裁判でも引き続き被告人質問が行われ、取り調べでの「大罪人」などといった発言について問われると… （田渕大輔検事）「本当にそのような弁解でいいのかと問いただすつもりでした。例えとしては大げさで、もっと違う言い方はあったかなと思います」 また、取り調べた相手やその家族に対しては「私の発言のせいでたびたび報道で事件のことが取り上げられ本当に申し訳なく思っている」などと謝罪しました。 午後からは検察官役の指定弁護士から被告人質問が行われ、検察の理念に即した取り調べだったかどうかを問われると… （田渕大輔検事）「全体としてみると、経緯や必要な弁解を聞いていた。検察の理念にもとる（反する）取り調べではなかったと当時も思っています」 また、机を叩いたことに関しては、当時はやむを得ない方法だったとした上で、他の方法も取り得たと思うなどと話しました。 20日も被告人質問が行われる予定です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022804?utm_source=lootura.com","publishedAt":"2026-10-19T08:39:14.000Z"},{"title":"「ふるさとチョイス」不正アクセスの疑いでサービス停止","summary":"専門チームで調査し、事実関係・影響範囲を確認しているという。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002391/?utm_source=lootura.com","publishedAt":"2026-10-19T07:54:24.000Z"},{"title":"犬猫に「無資格で注射」させた疑い…投薬などの知識を問う「独自のテスト問題」押収 コスト削減のため従業員に学習させていたか 大阪府警","summary":"無資格の従業員らに犬などへの注射をさせたとしてペットショップ代表らが逮捕された事件で、従業員の投薬への理解を問う独自のテスト問題が押収されていたことがわかりました。 ペットショップチェーン店「Aペット」の代表・天見恭之容疑者（42）ら4人は、去年から今年1月にかけて、大阪府内の4店舗で獣医師資格のない従業員らに指示をして、犬と猫計9匹に抗ウイルス薬を注射させた疑いがもたれています。 今年3月に行われた家宅捜索で複数の店舗から従業員向けの指示が書かれた「投薬マニュアル」が押収されていますが、捜査関係者によりますと、投薬などの知識を問う独自のテスト問題も押収されていたということです。 また、逮捕された幹部の一人は、逮捕前の任意の取り調べで「獣医師に見せるコストを減らしたかった」などと話していたということです。 警察は、天見容疑者らが茨城県の獣医師・埜田博実容疑者（78）と峯苫稔三容疑者（79）から薬を入手し、コスト削減のためにマニュアルやテスト問題を活用し従業員に学習させ注射させていたとみて、実態解明を進めています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022801?utm_source=lootura.com","publishedAt":"2026-10-19T08:39:06.000Z"},{"title":"情報漏えい「経験あり」は企業の16.2％、「発生したか分からない」の声も──帝国データバンク調査","summary":"帝国データバンクは10月19日、情報漏えいの発生状況に関する企業アンケートの結果を発表した。漏えいやその可能性のある事案を経験した企業は16.2％で、大企業に限ると3割に上った。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002390/?utm_source=lootura.com","publishedAt":"2026-10-19T07:31:48.000Z"},{"title":"【介護報酬を不正請求】市が事業者の指定取り消し 監査で虚偽の説明も…市は不正受領分の返還求める考え 山口・下関","summary":"山口県下関市は１９日、介護報酬を不正に請求するなどしたとして、福浦リハビリデイサービス（彦島福浦町）を運営するオーイーシー（綾羅木新町）に対し、指定地域密着型サービス事業者などの指定を取り消すと発表しました。 市によると、算定要件を満たしていないにもかかわらず、２０２３年４月から２０２５年８月までの期間、介護職員処遇改善加算などを請求して受け取ったほか、監査の際に虚偽の説明をしたり、繰り返し求められた資料を提出しなかったりしたということです。 指定の取り消しは介護保険法に基づく措置で、効力が発生するのは１１月２６日です。 市は事業者に対し、介護報酬の不正受領分の返還を求める予定で、額は精査中としています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022814?utm_source=lootura.com","publishedAt":"2026-10-19T08:38:11.000Z"},{"title":"サムスン中の人も認める、iPhone DuoのおかげでGalaxy Z Fold8の売り上げ伸びてます（しかも今すぐ入手可能）","summary":"AppleのiPhone Duo登場により、ライバルであるGalaxy Z Fold8の売上が急増。サムスンの関係者もその効果を認める理由と、両機種の価格や違いを解説します。","source":"ギズモード・ジャパン","author":"そうこ","category":"technology","url":"https://www.gizmodo.jp/article/2610-iphone-duo-galaxy-z-fold8-sales/?utm_source=lootura.com","publishedAt":"2026-10-20T03:10:00.000Z"},{"title":"清水町→「十勝清水町」変更問う 住民グループが署名集め町長に住民投票直接請求 町は11月議会に条例案提出","summary":"北海道十勝地方の清水町の町名変更を問う住民投票の実施を目指す住民グループが、10月19日、辻 康裕町長に直接請求を行いました。 住民投票の実施を町長に直接請求する様子(北海道清水町 午前10時前) 北海道清水町の辻町長に直接請求を行ったのは、町名を「十勝清水町」に変更するか問う住民投票を目指すグループです。 清水町では6月、町が住民投票の実施に必要な条例案を議会に提出したものの、否決。その後、住民グループが実施に向けて署名活動を始め、直接請求に必要な有権者144人を大きく上回る2,488人分の有効署名を集めました。 住民グループ代表 宮川司さん 住民グループ代表 宮川 司さん 「町民の思いを無事に町長に提出できたことが、第1段階クリアかなと思う。あとは議会に託したい」 直接請求を受け、清水町は住民投票の実施に向けた条例案を11月上旬の臨時議会に提出する見込みで、議会の判断が注目されます。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022546?utm_source=lootura.com","publishedAt":"2026-10-19T08:38:00.000Z"},{"title":"AIがおすすめしてきたソフト、ウイルス入りでした。人気も開発歴も偽装されてた | ギズモード・ジャパン","summary":"AIがおすすめするソフトにウイルスが混入。開発歴や人気度も巧妙に偽装されたマルウェアの手口とセキュリティ対策を解説します。","source":"ギズモード・ジャパン","author":"平木昌宏","category":"technology","url":"https://www.gizmodo.jp/article/ai-recommended-malware-software/?utm_source=lootura.com","publishedAt":"2026-10-20T03:00:00.000Z"},{"title":"軽乗用車がクマに荒らされる 後部座席が破られ窓ガラスに16センチの足跡 北海道・清里町の住宅前","summary":"北海道で住宅の前に止められていた軽乗用車がクマに荒らされる被害がありました。 ドアが開けられた軽乗用車。後部座席が大きく破られています。 きのう朝、北海道清里町の住宅で、止めてあった軽乗用車に住人が乗ろうとした際、運転席側の後ろのドアが開いていることに気がつきました。 車内を確認したところ後部座席が破られていて、窓ガラスには幅およそ16センチのクマの足跡が付いていました。 車は前の日の夜から鍵をかけずに止められていて、後部ドアはボタンを押すと自動で開くタイプでした。 これまでに、このクマによる人的被害はないということです。 現場は住宅の少ない農村地帯で、近くにはクマのものとみられる足跡が複数発見されたということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022811?utm_source=lootura.com","publishedAt":"2026-10-19T08:37:48.000Z"},{"title":"情報漏えい続きの日本へ。デンマーク880万人分の流出が教えてくれた“基本のキ” | ギズモード・ジャパン","summary":"デンマークで起きた880万人分の情報流出事件から学ぶサイバーセキュリティの基本。パスワード管理やアクセス権限の重要性を解説します。","source":"ギズモード・ジャパン","author":"長谷川賢人","category":"technology","url":"https://www.gizmodo.jp/article/2610-denmark-data-leak-security-basics/?utm_source=lootura.com","publishedAt":"2026-10-20T02:40:00.000Z"},{"title":"【台風情報】台風30号は｢猛烈な｣勢力に発達 最大瞬間風速80ｍへ 22日（木）ごろ｢沖縄の南｣へ ※雨と風のシミュレーション（気象庁）","summary":"台風30号は19日15時現在、大型で猛烈な勢力に発達しました。フィリピンの東の海上にあって、西北西に時速15キロで進んでいます。沖縄の南に近づく22日（木）ごろに「非常に強い」勢力となる見通しです。 台風の強さ･大きさの定義は? 気象庁の定義では、以下の用語を使い分けて、台風のおおよその勢力を表現しています。 【強さの階級分け】 ･強い 最大風速33m／s（64ノット）以上～44m／s（85ノット）未満 ･非常に強い 最大風速44m／s（85ノット）以上～54m／s（105ノット）未満 ･猛烈な 最大風速54m／s（105ノット）以上 【大きさの階級分け】 ･大型（大きい） 風速15m／s以上の半径500km以上～800km未満 ･超大型（非常に大きい） 風速15m／s以上の半径800km以上 台風30号 20日~21日の予想進路 20日03時の予報 強さ 猛烈な 存在地域 フィリピンの東 進行方向、速さ 北西20km／h（12kt） 中心気圧 920hPa 中心付近の最大風速 55m／s（105kt） 最大瞬間風速 75m／s（150kt） 20日15時の予報 強さ 猛烈な 存在地域 フィリピンの東 進行方向、速さ 西北西25km／h（13kt） 中心気圧 910hPa 中心付近の最大風速 55m／s（110kt） 最大瞬間風速 80m／s（155kt） 21日15時の予報 強さ 猛烈な 存在地域 フィリピンの東 進行方向、速さ 西北西25km／h（13kt） 中心気圧 910hPa 中心付近の最大風速 55m／s（110kt） 最大瞬間風速 80m／s（155kt） 台風30号 22日以降の予想進路 22日15時の予報 強さ 非常に強い 存在地域 沖縄の南 進行方向、速さ 西北西15km／h（8kt） 中心気圧 935hPa 中心付近の最大風速 50m／s（100kt） 最大瞬間風速 70m／s（140kt） 23日15時の予報 強さ 非常に強い 存在地域 沖縄の南 進行方向、速さ 北西15km／h（8kt） 中心気圧 940hPa 中心付近の最大風速 45m／s（90kt） 最大瞬間風速 65m／s（130kt） 24日15時の予報 強さ－ 存在地域 台湾海峡 進行方向、速さ 西北西15km／h（8kt） 中心気圧 985hPa 中心付近の最大風速 30m／s（55kt） 最大瞬間風速 40m／s（80kt） 20日~23日の雨と風のシミュレーション 24日~27日の雨と風のシミュレーション 28日以降の雨と風のシミュレーション","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022775?utm_source=lootura.com","publishedAt":"2026-10-19T08:36:29.000Z"},{"title":"「飛行機ではスマホを機内モードに」って、もうやめてもよくない？","summary":"機内ナビや管制塔との通信に支障をきたすという理由でのスマホの機内モード。実は科学的根拠はあまりない。","source":"ギズモード・ジャパン","author":"satomi","category":"technology","url":"https://www.gizmodo.jp/article/no-need-for-airplane-mode-ojk/?utm_source=lootura.com","publishedAt":"2026-10-20T02:35:00.000Z"},{"title":"アジアパラ大会「何キロ挙げたか純粋に評価される」パワーリフティング坂元智香選手 自己ベスト80キロ目指す","summary":"国内で初めて開催されるアジアパラ競技大会が10月18日に開幕し、東京パラリンピックにした出場大分県日出町の坂元智香選手（44）が、パワーリフティング女子で自己ベストの更新に挑みます。 別府市にある「太陽の家」のトレーニング施設で練習を重ねる坂元智香選手（44）。高校生の頃に事故で脊髄を損傷し、車いすマラソンやバスケなどを経て、2017年からパワーリフティングに取り組んでいます。 パラパワーリフティング日本代表 坂元智香選手： 「機能がどうしても私は限られるので、腹筋とかが上手に利かない分、もう胸から上で挙げている感じになる」 坂元選手は2021年の東京パラリンピックで、この競技に日本女子として初めて出場し、8位入賞しました。 目指すは自己ベスト80キロ 肩の怪我乗り越え挑む パラパワーリフティングは障害の程度に関わらず体重で階級を分けていて、坂元選手は4年前に肩を痛め79キロ級から73キロ級へ。 階級を下げたものの、5月の大会で自己ベストとなる77キロを持ち上げ、復活へ着実に進んでいます。 坂元智香選手： 「ベンチの上に乗ってしまったら、もう自分自身の力の勝負なので。だからもう、誰が何キロ上げたっていうところが純粋に評価されるところはすごく面白いなと思いますね」 坂元さんが目指すのは、東京パラリンピックと前回のアジアパラで挙げられなかった80キロ。東京パラはコロナ禍で無観客だったため、国際大会で戦う姿を日本で披露できる初の舞台です。 坂元智香選手： 「競技の面白さだとか迫力だとかをまずは感じてもらうことと、頑張ってるねって、よかったねって言ってもらえるように、みんなが喜んでくれるようなパフォーマンスを今はできるようにしたいなと思ってます」 一瞬の勝負に人生を込めて、目標の80キロを突破できるか。アジアパラパワーリフティング女子73キロ級の試合は、21日に行われます。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022609?utm_source=lootura.com","publishedAt":"2026-10-19T08:34:42.000Z"},{"title":"異世界（設定）のNape Proが来た。スケルトンボディにヘビーボールを乗っけたヤツ、出るよ","summary":"Nape Pro、また出ます。キーボードに添えて、ホームポジションから自在にPCを操る──ギズモードと「Keychron（キークロン）」が共同開発、クラウドファンディングで累計4億円超の支援を集めた「Keychron Nape Pro」。先…","source":"ギズモード・ジャパン","author":"内藤 青也","category":"technology","url":"https://www.gizmodo.jp/article/keychron-nape-pro-se-release/?utm_source=lootura.com","publishedAt":"2026-10-20T02:00:00.000Z"},{"title":"【飲酒運転】一週間で30～60代の男5人を摘発 1人は追突事故を起こし現行犯逮捕 山梨","summary":"山梨県警は10月12日から18日の1週間で30代～60代の男5人を飲酒運転で摘発しました。 摘発状況（違反日、時間帯、場所、路線、年齢性別、摘発内容） ①10月12日 15時 上野原市 国道20号 60代男 酒気帯び ②10月12日 23時 甲府市 市道 60代男 酒酔い ③10月16日 0時 甲府市 県道 30代男 酒気帯び ④10月17日 0時 甲府市 市道 60代男 酒気帯び ⑤10月18日 1時 甲府市 市道 40代男 酒気帯び 警察によりますと①④が4輪車、②③⑤は自転車でした。 また①は事故で、その他は職務質問・検問で飲酒運転が発覚しました。 なお、①は12日に上野原市内の国道20号で酒気を帯びた状態で運転し、乗用車に追突する事故を起こし現行犯逮捕されています。 山梨県警察本部 警察では、曜日や時間帯、場所を限定しない飲酒検問を実施していて、取り締まりなどを強力に推進するとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3022093?utm_source=lootura.com","publishedAt":"2026-10-19T08:22:36.000Z"},{"title":"ゴジラ来襲！ ギズモード出動せよ!! 川崎市民を守るんだ!!!","summary":"CEATECの富士通ブースで、ゴジラ来襲を想定した災害対策デジタルリハーサルをギズモードが体験。リアルな仮想空間での避難誘導シミュレーションの模様をお届けします。","source":"ギズモード・ジャパン","author":"三浦一紀","category":"technology","url":"https://www.gizmodo.jp/article/ceatec-2026-fujitsu/?utm_source=lootura.com","publishedAt":"2026-10-20T01:00:00.000Z"},{"title":"「Renta!」停止は「不正アクセスの可能性」のため 詳細は調査中、再開未定","summary":"「Renta!」が18日から一時サービス停止。「Renta!のサーバに対して外部からの不正なアクセスの可能性があることを把握したため」","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/19/2000002379/?utm_source=lootura.com","publishedAt":"2026-10-19T04:53:22.000Z"},{"title":"規制が厳しい現代社会に「オトナ」なアニメ表現を届ける気概と工夫を男2人が密室でみっちり語り倒す『ダークサモナーとデキている』『彼女の友達』プロデューサートーク濃密レポート","summary":"株式会社ウェイブのアニメーション部統括である後藤礼雅さんとフリーアナウンサーの吉田尚記さんがテレビアニメ『ダークサモナーとデキている』と『彼女の友達』について語るイベントがマチ★アソビ vol.31で開催されました。どちらもかなり過激でアダルトな内容が含まれる作品について、1時間にわたってufotableCINEMAの密室で高濃度かつ高密度で繰り広げられたトークをがっつりまとめてみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261019-darksummoner-kanojo-no-tomodachi-machiasobi31/?utm_source=lootura.com","publishedAt":"2026-10-19T14:30:00.000Z"},{"title":"新型iPad miniの画面、60Hzか120Hzか？ 世に出るのはドッチ!?","summary":"僕らには2つの未来が用意されています。まもなく発表されるのでは？ と期待が高まる新型iPad mini。今回はチップの更新だけでなく、画面のOLED化や防水設計など、大幅なリニューアルが遂げられると噂されています。そしてそのOLEDパネルに…","source":"ギズモード・ジャパン","author":"小暮ひさのり","category":"technology","url":"https://www.gizmodo.jp/article/2610-new-ipad-mini-display-refresh-rate/?utm_source=lootura.com","publishedAt":"2026-10-20T00:00:00.000Z"},{"title":"ウィリアム・ギブスンの「ニューロマンサー」で言及された「サイバースペース」という用語が第三者に商標登録されギブスンが報復したという話は本当なのか","summary":"著名SF作家のウィリアム・ギブスン氏は、1984年の長編小説「ニューロマンサー」で「サイバースペース(電脳空間)」という概念を広めました。当時画期的だったこの用語を、アメリカのソフトウェア開発企業であるAutodeskが商標登録し、報復としてギブスン氏が「エリック・グリクセン」という個人名を商標登録しようとしたというウワサがテクノロジー業界には存在します。このウワサの真実について、本物のエリック・グリクセン氏が解説しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20 :"https://gigazine.net/news/20261019-front-lines-debate-ai-future-math/?utm_source=lootura.com","publishedAt":"2026-10-19T12:00:00.000Z"},{"title":"“究極のMacBook Pro”降臨か。Appleが新製品発表イベントを10月29日に開催","summary":"Appleが新製品発表イベントの開催を発表。新型MacBook Proや有機EL搭載の新型iPad miniが登場する見込みです。","source":"ギズモード・ジャパン","author":"かみやまたくみ","category":"technology","url":"https://www.gizmodo.jp/article/2610-oled-macbook-pro-apple-event-2026/?utm_source=lootura.com","publishedAt":"2026-10-19T20:45:00.000Z"},{"title":"AIのベンチマークテストは人間の仕事の1割しかカバーできていない","summary":"AIの性能を測定するベンチマークテストの中には「人間の仕事をどれだけの精度でこなせるか」を測定するものが多く含まれています。ところが、こうしたベンチマークは「一部のタスク」しかカバーしておらず、AIが労働を代行できるという結果が出たとしても、それは労働全体のうちほんのわずかであることを意味する可能性があるという分析結果が公表されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261019-ai-benchmark-mapping/?utm_source=lootura.com","publishedAt":"2026-10-19T11:00:00.000Z"},{"title":"BASE子会社の「Eストアー」、2336万人の情報漏えい","summary":"BASE子会社のEストアーは16日、ECサイト構築システム「ショップサーブ」で8月に発生した不正アクセスによる情報漏えいに関して、一連の調査が完了したと発表した。最終的な情報漏えいの対象者は約2,335万6,000人、対象店舗は7,858店。また、約209万人については、クレジットカード情報の一部(カード名義、カード番号の一部)などを含んでいる。","source":"インプレス","author":"関根慎一","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2149147.html?utm_source=lootura.com","publishedAt":"2026-10-19T09:35:29.954Z"},{"title":"Metaが「ニュースサイトからの情報収集を可能とする利用規約」を削除","summary":"Metaは2026年10月初頭に商用利用規約を変更し、Facebook・Instagram・Messenger・WhatsAppにビジネスアカウントを持つ企業や著名人は、そのアカウントに関連付けられたウェブサイトをMetaがクロールすることに同意したものと見なされることを明記しました。MetaのSNSアカウントを持つニュースサイトなどからMetaがコンテンツを収集し放題になるとして批判が集まった結果、Metaは規約を再度更新して該当する記述を削除しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261019-meta-removes-scrape/?utm_source=lootura.com","publishedAt":"2026-10-19T10:30:00.000Z"},{"title":"シチズン、グラデーションダイヤルのレトロなクロノグラフ","summary":"シチズン時計は、「シチズンコレクション」の「RECORD LABEL」の新作として、グラデーションカラーのダイヤルを搭載したレトロデザインのクロノグラフ「Gradation TSUNO」を発売した。電池駆動のクオーツ式腕時計で、価格は29,700円。","source":"インプレス","author":"太田 亮三" fpsの動画再生にも対応","summary":"2026年10月15日、E Inkがカラー電子ペーパー「E Ink Kaleido 4」を発表しました。色域や明るさ、コントラストを改善した新世代モデルで、動画再生は最大18fpsに対応しています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261019-e-ink-kaleido-4/?utm_source=lootura.com","publishedAt":"2026-10-19T07:40:00.000Z"},{"title":"純正じゃなくても大満足。2,000円台で買えるUGREENのiPadペン","summary":"iPadの登場以来、タブレット端末はビジネスからクリエイティブ作業、日常使いまで幅広く普及してきました。しかし、指だけの操作では細かい作業に限界を感じることも。 そんななか、3,000円台で購入できるUGREENの互換スタイラスペンが、Apple Pencilに迫る機能性と使い勝手で注目を集めています。","source":"ギズモード・ジャパン","author":"お買いものサポーター","category":"technology","url":"https://www.gizmodo.jp/article/305668-2610-amazon-ugreenpencil-ano/?utm_source=lootura.com","publishedAt":"2026-10-19T12:55:00.000Z"},{"title":"7日間バッテリーが持続するスマートウォッチ「Google Fitbit Edge」の見た目はこんな感じ","summary":"多機能スマートウォッチ「Google Pixel Watch」と、画面なしウェアラブルデバイス「Google Fitbit Air」の中間を目指して開発されたスマートウォッチ「Google Fitbit Edge」が2026年10月27日に発売されます。一足先にGoogle Fitbit Edgeを借りることができたので、まずは外観を詳しく観察してみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261019-google-fitbit-edge-appearance/?utm_source=lootura.com","publishedAt":"2026-10-19T07:25:00.000Z"},{"title":"中身の交換でずっと長持ち。リサイクル素材と3Dプリントで作ったモバイルバッテリー | ギズモード・ジャパン","summary":"電池交換でずっと使えるサステナブルなモバイルバッテリーZEROを紹介。連結や機能拡張も可能でエコに長く使える注目のガジェットです。","source":"ギズモード・ジャパン","author":"岡本玄介","category":"technology","url":"https://www.gizmodo.jp/article/2610-zero-modular-power-bank/?utm_source=lootura.com","publishedAt":"2026-10-19T12:30:00.000Z"}];
const isEnglish = false;
const isJapanese = true;
const editionIds = ["es","us","za","mx","ar","jp"];

		const root = document.querySelector('[data-signal-words-page]');
		const form = document.querySelector('[data-signal-words-form]');
		const input = document.querySelector('[data-signal-words-input]');
		const termsRoot = document.querySelector('[data-signal-words-terms]');
		const resultsRoot = document.querySelector('[data-signal-words-results]');
		const preferencesKey = 'lootura.preferences.v1';
		const maxWatchingTerms = 20;
		const isEnglishPage = isEnglish;
		const isJapanesePage = isJapanese;
		const defaultCategories = ['politics', 'economy', 'sports', 'ai', 'culture'];

		const escapeHtml = (value) =>
			String(value || '')
				.replaceAll('&', '&amp;')
				.replaceAll('<', '&lt;')
				.replaceAll('>', '&gt;')
				.replaceAll('"', '&quot;')
				.replaceAll("'", '&#039;');

		const normalizeText = (value) =>
			String(value || '')
				.normalize('NFD')
				.replace(/[\u0300-\u036f]/g, '')
				.toLowerCase();

		const getSearchTokens = (value) =>
			normalizeText(value).match(/[\p{L}\p{N}]+/gu) || [];

		const doesTextMatchTerm = (text, term) => {
			const termTokens = getSearchTokens(term);
			if (!termTokens.length) return false;
			const textTokens = getSearchTokens(text);
			return textTokens.some((token, index) =>
				token === termTokens[0] && termTokens.every((termToken, offset) => textTokens[index + offset] === termToken)
			);
		};

		const normalizeTerm = (term) => {
			const normalizedTerm = String(term || '').replace(/\s+/g, ' ').trim();
			return normalizedTerm.length >= 2 && normalizedTerm.length <= 40 ? normalizedTerm : '';
		};

		const readPreferences = () => {
			try {
				const value = JSON.parse(localStorage.getItem(preferencesKey) || 'null');
				if (value && typeof value === 'object' && !Array.isArray(value)) return value;
			} catch {}
			return {};
		};

		const normalizePreferences = (preferences) => {
			const categoriesByEdition = {};
			const watchingByEdition = {};
			for (const edition of editionIds) {
				categoriesByEdition[edition] = Array.isArray(preferences.categoriesByEdition?.[edition])
					? preferences.categoriesByEdition[edition]
					: defaultCategories;
				watchingByEdition[edition] = Array.isArray(preferences.watchingByEdition?.[edition])
					? preferences.watchingByEdition[edition]
					: [];
			}
			return {
				selectedEdition: preferences.selectedEdition || locale,
				categoriesByEdition,
				watchingByEdition,
			};
		};

		const getWatchingTerms = () => {
			const preferences = normalizePreferences(readPreferences());
			const seen = new Set();
			return (preferences.watchingByEdition[locale] || [])
				.map(normalizeTerm)
				.filter((term) => {
					const key = term.toLowerCase();
					if (!term || seen.has(key)) return false;
					seen.add(key);
					return true;
				})
				.slice(0, maxWatchingTerms);
		};

		const writeWatchingTerms = (terms) => {
			const preferences = normalizePreferences(readPreferences());
			preferences.selectedEdition = locale;
			preferences.watchingByEdition[locale] = terms.slice(0, maxWatchingTerms);
			localStorage.setItem(preferencesKey, JSON.stringify(preferences));
			window.dispatchEvent(new CustomEvent('lootura:preferences-updated', { detail: preferences }));
		};

		const getStorySearchText = (story) =>
			normalizeText([
				story.title,
				story.summary,
				story.source,
				story.author,
				story.category,
			].join(' '));

		const getMatchesByTerm = (terms) =>
			terms.map((term) => {
				const matches = stories
					.filter((story) => doesTextMatchTerm(getStorySearchText(story), term))
					.slice(0, 12);
				return { term, matches };
			});

		const formatRelative = (value) => {
			const time = new Date(value || '').getTime();
			if (!Number.isFinite(time)) return '';
			const minutes = Math.max(1, Math.round((Date.now() - time) / 60000));
			if (isJapanesePage) {
				if (minutes < 60) return `${minutes}分前`;
				const hours = Math.round(minutes / 60);
				if (hours < 48) return `${hours}時間前`;
				const days = Math.round(hours / 24);
				return `${days}日前`;
			}
			if (minutes < 60) return isEnglishPage ? `${minutes}m ago` : `hace ${minutes}min`;
			const hours = Math.round(minutes / 60);
			if (hours < 48) return isEnglishPage ? `${hours}h ago` : `hace ${hours}h`;
			const days = Math.round(hours / 24);
			return isEnglishPage ? `${days}d ago` : `hace ${days}d`;
		};

		const render = () => {
			const terms = getWatchingTerms();
			const matchesByTerm = getMatchesByTerm(terms);
			const matchCount = matchesByTerm.reduce((total, group) => total + group.matches.length, 0);

			if (termsRoot instanceof HTMLElement) {
				termsRoot.innerHTML = terms.length
					? terms.map((term) => `
						<button class="inline-flex min-h-10 items-center gap-2 rounded-full border border-neutral-950/10 bg-neutral-950/[0.035] px-3 text-sm font-bold text-neutral-700 transition hover:bg-neutral-950/[0.06] focus:outline-none focus:ring-2 focus:ring-neutral-950/20" type="button" data-signal-word-remove="${escapeHtml(term)}">
							<span>${escapeHtml(term)}</span>
							<span aria-hidden="true"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>
						</button>
					`).join('')
					: `<p class="text-sm font-medium leading-6 text-neutral-500">${isJapanesePage ? 'フォロー中の言葉はまだありません。' : isEnglishPage ? 'No followed words yet.' : 'Aún no sigues palabras.'}</p>`;
			}

			if (!(resultsRoot instanceof HTMLElement)) return;
			root?.setAttribute('data-signal-words-match-count', String(matchCount));
			if (terms.length === 0) {
				resultsRoot.innerHTML = `<p class="text-sm font-medium leading-6 text-neutral-500">${isJapanesePage ? '言葉を追加すると、一致するリンクがここに出ます。' : isEnglishPage ? 'Add a word to see matching links here.' : 'Añade una palabra para ver enlaces aquí.'}</p>`;
				return;
			}
			if (matchCount === 0) {
				resultsRoot.innerHTML = `<p class="text-sm font-medium leading-6 text-neutral-500">${isJapanesePage ? '現在のリンクに一致するものはありません。' : isEnglishPage ? 'No current links match your words.' : 'No hay enlaces actuales con tus palabras.'}</p>`;
				return;
			}
			resultsRoot.innerHTML = matchesByTerm
				.filter((group) => group.matches.length > 0)
				.map((group) => `
					<section class="mb-8">
						<p class="text-sm font-medium uppercase tracking-normal text-neutral-500">${escapeHtml(group.term)}</p>
						<div class="mt-3 grid border-t border-neutral-950/10">
							${group.matches.map((match) => `
								<a class="grid gap-1 border-b border-neutral-950/10 py-4 text-neutral-950 no-underline transition hover:bg-neutral-950/[0.025] focus:outline-none focus:ring-2 focus:ring-neutral-950/20" href="${escapeHtml(match.url)}" target="_blank" rel="noopener noreferrer">
									<span class="text-[11px] font-bold uppercase tracking-normal text-neutral-400">${escapeHtml([match.source, formatRelative(match.publishedAt)].filter(Boolean).join(' · '))}</span>
									<strong class="text-lg font-semibold leading-snug text-neutral-950">${escapeHtml(match.title)}</strong>
								</a>
							`).join('')}
						</div>
					</section>
				`).join('');
		};

		form?.addEventListener('submit', (event) => {
			event.preventDefault();
			if (!(input instanceof HTMLInputElement)) return;
			const term = normalizeTerm(input.value);
			if (!term) return;
			const terms = getWatchingTerms();
			const exists = terms.some((existingTerm) => existingTerm.toLowerCase() === term.toLowerCase());
			if (!exists) writeWatchingTerms([term, ...terms]);
			input.value = '';
			render();
		});

		termsRoot?.addEventListener('click', (event) => {
			const button = event.target instanceof Element ? event.target.closest('[data-signal-word-remove]') : null;
			if (!(button instanceof HTMLElement)) return;
			const term = button.getAttribute('data-signal-word-remove') || '';
			writeWatchingTerms(getWatchingTerms().filter((item) => item !== term));
			render();
		});

		window.addEventListener('storage', render);
