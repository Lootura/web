const stories = [{"title":"北朝鮮体育相が名古屋アジア大会で8年ぶり訪日へ 平壌を出発 | 毎日新聞","summary":"北朝鮮の金日国（キム・イルグク）体育相率いる代表団が15日、19日開幕の愛知・名古屋アジア大会に参加するため、平壌を空路で出発した。朝鮮中央通信が16日、伝えた。中国を経由して近日中に日本に到着する見通し。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260916/k00/00m/030/001000c?utm_source=lootura.com","publishedAt":"2026-09-15T22:23:15.000Z"},{"title":"今日の断片を開く","summary":"今日という日が過去に何を残したかを一つだけ見る。ニュースではなく、文脈の小さな窓。","source":"Lootura日誌","author":"","category":"history","url":"https://ja.wikipedia.org/wiki/9%E6%9C%8816%E6%97%A5?utm_source=lootura.com","publishedAt":"2026-09-16T04:00:00.000Z"},{"title":"「リフォーム代を仮想通貨で…」銀行員が詐欺疑い通報、被害防ぐ | 毎日新聞","summary":"特殊詐欺の被害を防いだとして、奈良県警橿原署は11日、南都銀行橿原支店・耳成支店・畝傍支店共同店舗（橿原市八木町1）の課長、井阪祐子さん（55）と行員の立花直美さん（58）に感謝状を贈った。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/310/055000c?utm_source=lootura.com","publishedAt":"2026-09-15T22:15:08.000Z"},{"title":"OpenAI、AI安全性でAnthropic、Google DeepMindと協議中──Bloomberg報道","summary":"OpenAIが、AnthropicやGoogle DeepMindとAIの安全性確保に向けて協議を進めているとBloombergが報じた。反トラスト法の適用除外を巡っては米当局の警戒や議会での法案提出など議論が活発化。一方、NVIDIAのフアンCEOは市場原理で安全性と迅速な開発は両立可能として政府の介入に否定的な見方を示した。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/16/2000001522/?utm_source=lootura.com","publishedAt":"2026-09-15T22:13:20.000Z"},{"title":"米長期金利、一時19年ぶり5.04％台 「配当金」懸念も | 毎日新聞","summary":"15日の債券市場で、長期金利の指標となる米10年物国債利回りが上昇し、一時5・04％台を付けた。2007年以来、約19年ぶりの高水準。原油価格高騰に伴う物価上昇や米国の財政悪化が懸念され、債券売りが広がった。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/020/262000c?utm_source=lootura.com","publishedAt":"2026-09-15T14:01:26.000Z"},{"title":"【台風情報】予報円が東寄りにシフト、シルバーウィークに本州接近のおそれ 16日午後に「台風」発生へ","summary":"気象庁の最新の発表（16日04時15分）によると、マリアナ諸島付近にある熱帯低気圧は、きょう16日午後に「台風」へ発達する見込みです。昨日の予想から予報円が東寄りにシフトしており、シルバーウィークにかけて「強い」勢力で本州付近へ接近するおそれが出てきています。 予報円が東寄りに変化...本州へ向かって北上か 最新の進路予想では、昨日まで「西北西（西日本方面）」へ向かっていた予報円が、東側へシフトしました。 21日（月・祝）には紀伊半島から東海沖（東経138度付近）のすぐ南まで進み、そのまま「北」へ進んで本州に接近するコースが示唆されています。 ▶ 雨風シミュレーションを見る...シルバーウィーク直撃か 今後の予想進路を詳しく この熱帯低気圧は、当初の予想より発生がやや遅れたものの、今後は海面水温の高い海域を進みながら勢力を強める予想です。 16日（水）15時【南鳥島近海】： 台風へ発達する見込み（中心気圧998hPa）。 18日（金）03時【小笠原近海】： 985hPaまで発達。小笠原諸島では大しけとなり、暴風や大雨に警戒が必要です。 20日（日）03時【日本の南】： 「強い」勢力（中心気圧970hPa、最大瞬間風速50m/s）に発達。 21日（月・祝）03時【本州南岸】： 「強い」勢力を保ったまま、紀伊半島から東海沖のすぐ南まで北上する見込みです。 シルバーウィークへの影響に警戒を ▶ 雨風シミュレーションを見る...シルバーウィーク直撃か 本州付近には前線が停滞しており、台風周辺からの湿った空気が流れ込むことで、前線の活動が活発化するおそれがあります。 連休前半（19日土曜〜21日月曜ごろ）には、小笠原諸島だけでなく、西日本・東日本の太平洋側でも雨や風、高波の影響が広がる可能性があります。 連休中にお出かけや移動を予定されている方は、最新の交通情報や気象情報に十分注意してください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947725?utm_source=lootura.com","publishedAt":"2026-09-15T22:39:16.000Z"},{"title":"メルカリ、ポイントで暗号資産を自動購入する「ポイント運用」","summary":"メルカリ子会社のメルコインは、「メルカリポイント」が付与されると、付与されたポイントを使って暗号資産を自動購入できる「ポイント運用」機能を9月15日から開始した。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141049.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"日経、広告料金を過大請求 2社から数千万円ずつ不正受領 | 毎日新聞","summary":"日本経済新聞社は15日、朝刊に折り込んで配布する広告冊子「THE NIKKEI MAGAZINE」の広告料金を過大請求していたと発表した。発行部数を実際より多く提示し、広告主2社からそれぞれ数千万円上回る料金を不正に受領していた。ほかにも問題がなかったかどうか調べ、結果を公表する方針。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/020/265000c?utm_source=lootura.com","publishedAt":"2026-09-15T13:47:23.000Z"},{"title":"桜島で噴火 噴煙2000ｍ【16日の降灰予報】鹿児島・宮崎","summary":"気象台によると、桜島の南岳山頂火口で16日午前6時31分と午前7時5分にに噴火があり、いずれも噴煙が火口から2000mの高さまで上がりました。 噴火警戒レベルは３の入山規制が継続中で、気象台は火口からおおむね２キロの範囲で大きな噴石と火砕流に警戒を呼びかけています。 桜島降灰予報（定時）灰が予想されるエリアと時間帯 夜は鹿児島市街地側に降灰予想 １６日０９時から１２時までは火口から北東方向、１６日２１時から２４時までは火口から西方向に降灰が予想されます。 １６日６時から１６日２４時までに噴火が発生した場合には、以下の方向・距離に降灰及び小さな噴石の落下が予想されます。 時刻 火口からの方向 降灰の距離 小さな噴石の距離 ▼１６日０６時から０９時まで 北東（霧島市福山方向） ５０ｋｍ ３ｋｍ ▼１６日０９時から１２時まで 北東（霧島市福山方向） ５０ｋｍ ３ｋｍ ▼１６日１２時から１５時まで 北東（霧島市福山方向） ６０ｋｍ ３ｋｍ ▼１６日１５時から１８時まで 北東（霧島市福山方向） ４０ｋｍ ２ｋｍ ▼１６日１８時から２１時まで 西（鹿児島市街方向） ４０ｋｍ ２ｋｍ ▼１６日２１時から２４時まで 西（鹿児島市街方向） ５０ｋｍ ３ｋｍ 期間中に噴火が発生した場合には、以下の市町村に降灰が予想されます。 鹿児島県：鹿児島市、垂水市、曽於市、霧島市、姶良市、鹿屋市、日置市、いちき串木野市、南さつま市、薩摩川内市 宮崎県 ：都城市、高原町、日南市、三股町","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947731?utm_source=lootura.com","publishedAt":"2026-09-15T22:32:05.000Z"},{"title":"時速6km免許不要の「スロモビ」 ハロサイが横浜でシェア開始","summary":"OpenStreetは、移動用小型車「スロモビ」のシェアサービスを10月5日から横浜市で開始する。桜木町駅、関内駅、日本大通り地下駐車場の3カ所にステーションを設置し、「HELLO CYCLING」アプリから利用できる。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141029.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"【台風のたまご=熱帯低気圧】今後「台風25号」に発達へ シルバーウィークに日本列島直撃のおそれも【気象庁・台風情報・雨風の予想シミュレーション】","summary":"日本の南の海上にある熱帯低気圧は、今後台風に発達し、シルバーウィークに列島に直撃する恐れがあります。 気象庁によりますと、16日6日時点で熱帯低気圧aはマリアナ諸島にあり、1時間に10キロメートルの速度で北西に進んでいます。 中心気圧は1000ヘクトパスカル、最大風速は15メートル、最大瞬間風速は23メートルとなっています。 熱帯低気圧aは16日までに台風に発達し、北寄りに進むでしょう。 また、18日以降は進路を西寄りに変えて、20日3時には強い勢力で日本の南に進む見通しです。 最新の雨と風のシミュレーションによると、台風になりそうな熱帯低気圧による雨雲が、20日ごろにかけては西から北西に進む予想となっています。 また、21日以降は北へ進み、22日から23日ごろにかけて西日本から東日本に直撃する可能性もあります。 ただ、21日の予報円がかなり大きく、今後の進路や雨雲の予想にはまだ幅があります。 最新の気象情報をご確認ください。 ▼▼▼ 熱帯低気圧 a ▼▼▼ ▼16日06時の実況 種別：熱帯低気圧 存在地域：マリアナ諸島 進行方向、速さ：北西 10 km/h 中心気圧：1000 hPa 最大風速：15 m/s 最大瞬間風速：23 m/s ▼16日18時の予報 種別：台風 存在地域：南鳥島近海 進行方向、速さ：北北東 30 km/h 中心気圧：998 hPa 中心付近の最大風速：18 m/s 最大瞬間風速：25 m/s ▼17日06時の予報 種別：台風 存在地域：南鳥島近海 進行方向、速さ：北 20 km/h 中心気圧：996 hPa 中心付近の最大風速：20 m/s 最大瞬間風速：30 m/s ▼18日03時の予報 種別：台風 存在地域：小笠原近海 進行方向、速さ：北西 25 km/h 中心気圧：985 hPa 中心付近の最大風速：25 m/s 最大瞬間風速：35 m/s ▼19日03時の予報 種別：台風 存在地域：小笠原近海 進行方向、速さ：西北西 20 km/h 中心気圧：975 hPa 中心付近の最大風速：30 m/s 最大瞬間風速：45 m/s ▼20日03時の予報 種別：台風 強さ：強い 存在地域：日本の南 進行方向、速さ：北西 15 km/h 中心気圧：970 hPa 中心付近の最大風速：35 m/s 最大瞬間風速：50 m/s ▼21日03時の予報 種別：台風 強さ：強い 存在地域：日本の南 進行方向、速さ：北 15 km/h 中心気圧：970 hPa 中心付近の最大風速：35 m/s 最大瞬間風速：50 m/s","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947723?utm_source=lootura.com","publishedAt":"2026-09-15T22:31:08.000Z"},{"title":"サッカー長友選手、都庁でW杯応援に謝辞 小池知事「ブラボー」 | 毎日新聞","summary":"サッカー・ワールドカップ（W杯）北中米3カ国大会で日本代表として出場した長友佑都選手が15日、都庁を訪れ、小池百合子知事を表敬訪問した。 アジア人初のW杯5大会連続出場を果たした長友選手は「W杯での応援、ありがとうございました」と感謝し、「目標の優勝には届かなかったが、またこの悔しさを次のW杯に","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/310/181000c?utm_source=lootura.com","publishedAt":"2026-09-15T09:07:48.000Z"},{"title":"セブンイレブンでケーキなど予約 「7NOW」アプリに予約機能","summary":"セブン-イレブン・ジャパンは、お買い物アプリ「7NOW」に新たに「予約機能」を搭載し、クリスマスケーキやオードブル、おせちなどの予約専用商品の注文に対応した。注文だけでなく、決済や受取日時の指定までを7NOWアプリ上で完結できる。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141011.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"AI脅威で異例の共闘、進歩派サンダース氏と保守派バノン氏が対策訴え","summary":"（ブルームバーグ）： 普段は相いれない立場の人物が、AIを巡って思わぬ共闘を見せている。 AIが安全や繁栄への脅威を高めているとの懸念から、進歩派の急先鋒であるバーニー・サンダース上院議員と、保守派の論客スティーブ・バノン氏という異色の組み合わせが、安全対策の強化を求める点で足並みをそろえた。 両氏は15日、ワシントンで開かれたイベントに登壇。AIには壊滅的な結果を招きかねないリスクがあるほか、AI企業が巨大な権力を握り、人間の利益を脅かしているとそれぞれ警告した。 サンダース氏とバノン氏はいずれも、AI業界の富豪らが技術開発を急ぎ過ぎていると批判した。ただ、サンダース氏は議会による対応を支持する。超党派の支持が必要で、時間のかかる取り組みだ。一方、バノン氏はトランプ大統領による行政措置を望んでいる。 バノン氏は「法制化は非常に複雑で時間もかかる。技術も、その可能性も複雑で、最悪の場合に生じ得る危険も計り知れないからだ」と述べた。 終日開かれたこのイベントには、投資家のフランク・マコート氏やマサチューセッツ工科大学（MIT）の経済学者ダロン・アセモグル氏も参加した。背景には、最先端AIシステムに人間の制御が及ばなくなるリスクが高まっているとのシリコンバレーの研究者らの警告をきっかけに、AIへの不安が一段と強まっていることがある。 議会やトランプ政権に対しては、AIリスクへの対応を求める声が強まっているものの、近く具体的な措置が講じられる兆しはほとんどない。サンダース氏は演説で、現状に不満を示した。 サンダース氏は「多くの科学者が起こり得ると考えているように、AIが人間の知能を超えれば、人間の手に負えなくなり、壊滅的な結果を招く恐れがある」と指摘。「民主、共和両党の下で議会は対応を怠ってきた。今や、この問題に対する大統領の無知は、実に恥ずべきものだ」と述べた。 サンダース上院議員 2016年の大統領選挙でトランプ氏の勝利を支えたバノン氏は、サンダース氏の直後に登壇し、「リスクを非常によくまとめてくれた」と同氏を称賛した。 その上で「当然ながら、米大統領について彼と私の意見はかなり違う。それでも党派を超えようと努めているし、そうしなければならない」と述べた。 スティーブ・バノン氏 原題：AI Fears Give Bernie Sanders a Rare Moment of Unity With Bannon（抜粋） もっと読むにはこちら bloomberg.com/jp ©2026 Bloomberg L.P.","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/withbloomberg/2947737?utm_source=lootura.com","publishedAt":"2026-09-15T22:31:08.000Z"},{"title":"グローバルホーク行方不明 鳥取は漁船安否確認など対応追われる | 毎日新聞","summary":"航空自衛隊の無人偵察機グローバルホークが鳥取県沖の海上で通信が途絶えたとの情報が防衛省から入り、鳥取県では15日午後、対応に追われた。墜落した可能性などもあることから、県は県内にある四つの漁協に呼びかけ、漁船の安否確認などの情報収集にあたった。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/040/193000c?utm_source=lootura.com","publishedAt":"2026-09-15T09:07:21.000Z"},{"title":"シャープ、AIサーバー事業参入 拡大するフィジカルAI市場に投入","summary":"シャープは、業務向けのAIサーバー事業に参入する。業界大手の鴻海科技集団(Foxconn)と連携し、“世界の供給力”を国内に展開すると謳う。企業や自治体、研究機関などに向けてラックマウントのAIサーバーを販売するもので、データセンター事業者も対象。第1弾として「NVIDIA RTX Proサーバー」(4U・空冷)の受注を開始しており、今後はより高性能な「NVIDIA HGX システム」も展開する。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141109.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"熊本県で最大震度4 長崎県雲仙市と南島原市で震度１","summary":"16日午前6時9分ごろ、熊本県で最大震度4を観測するやや強い地震がありました。 長崎県では雲仙市と南島原市で震度１を観測しました。 気象庁によりますと、震源地は熊本県天草・芦北地方で、震源の深さはおよそ10km、地震の規模を示すマグニチュードは4.0と推定されます。 この地震による津波の心配はありません。 最大震度4を観測したのは、熊本県の水俣市です。 【各地の震度詳細】 ■震度4 □熊本県 水俣市 ■震度3 □熊本県 芦北町 津奈木町 □鹿児島県 伊佐市 ■震度2 □熊本県 熊本美里町 球磨村 □鹿児島県 鹿児島出水市 長島町 ■震度1 □熊本県 上天草市 天草市 熊本西区 熊本南区 八代市 宇城市 山都町 人吉市 □鹿児島県 枕崎市 阿久根市 薩摩川内市 霧島市 いちき串木野市 姶良市 さつま町 湧水町 □長崎県 雲仙市 南島原市 □宮崎県 宮崎都農町 宮崎市 小林市 えびの市 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947726?utm_source=lootura.com","publishedAt":"2026-09-15T22:09:35.000Z"},{"title":"万博・大屋根リング木材を柱に GREEN×EXPO「KAJIMA TREE」着工","summary":"鹿島建設は、2027年国際園芸博覧会「GREEN×EXPO 2027」の会場内で、木造タワー「KAJIMA TREE」の本体工事を9月14日に開始した。建設現場も初公開し、大阪・関西万博の大屋根リングで使われた木材を再利用した柱の組み立て作業が披露された。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141162.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"東名高速道路下りでトラック3台が絡む事故 東京IC～東名川崎IC間で通行止め 解除の見通し立たず","summary":"警察によりますと、午前3時半すぎ、東名高速道路の下り、「東京料金所」付近でトラック3台が絡む事故がありました。 トラックを運転していた2人が病院に運ばれましたが、いずれも意識はあるということです。 この事故の影響で、東京ICと東名川崎ICの間で通行止めとなっています。 午前6時50分現在、通行止めが解除される見通しは立っていないということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947727?utm_source=lootura.com","publishedAt":"2026-09-15T22:07:24.000Z"},{"title":"アシックスウォーキング、もっと歩きたくなるフラッグシップ「MOON AMBLE」","summary":"アシックス商事は、アシックスウォーキングのフラッグシップモデル「MOON AMBLE(ムーンアンブル)」を9月16日に発売する。3品番をラインアップし、価格は25,300円から40,700円。","source":"インプレス","author":"加藤綾","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141144.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.475Z"},{"title":"【台風情報】新たな台風発生へ 気象庁進路予想 台風のたまご＝熱帯低気圧が発達シルバーウィークの連休に影響か【全国週間天気予報】","summary":"気象庁によると、日本の南にある熱帯低気圧aは、12時間以内に台風へ発達する見込みです。北よりに進む予想で、本州付近に接近するおそれもあります。シルバーウィークの連休に影響を及ぼすおそれもあります。 台風の進路予想 台風のたまご＝熱帯低気圧は、16日午前3時には、マリアナ諸島を時速15kmの速さで西北西へ進んでいます。中心気圧は1000ヘクトパスカル、最大瞬間風速は23メートルとなっています。 この熱帯低気圧は、16日午後3時までに台風に発達する予想で、16日午後3時には南鳥島近海付近に進み、1時間に20キロの速度で北北東に向かうとみられています。中心気圧は998ヘクトパスカル、最大瞬間風速は25メートルと予想されています。 その後、17日午前3時には南鳥島近海にあって、1時間に25キロの速度で北に進み、中心気圧は996ヘクトパスカル、最大瞬間風速は30メートルと予想されています。 18日午前3時には小笠原近海付近に進み、1時間に25キロの速度で北西に向かうとみられています。中心気圧は985ヘクトパスカル、最大瞬間風速は35メートルと予想されています。 19日午前3時には小笠原近海にあって、1時間に20キロの速度で西北西に進み、中心気圧は975ヘクトパスカル、最大瞬間風速は45メートルと予想されています。 20日午前3時には「強い」台風となって日本の南付近に進み、1時間に15キロの速度で北西に向かうとみられています。中心気圧は970ヘクトパスカル、最大瞬間風速は50メートルと予想されています。 21日午前3時には日本の南にあって、1時間に15キロの速度で北に進み、中心気圧は970ヘクトパスカル、最大瞬間風速は50メートルと予想されています。 画像で掲載している23日（水）までの全国週間天気予報 では、連休中に関東甲信、東北、北陸、近畿、東海などで雨マークが出ています。 台風の進路によっては予想が大きく変わる可能性があります。今後の台風情報に注意してください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947724?utm_source=lootura.com","publishedAt":"2026-09-15T22:05:10.000Z"},{"title":"Meta、新サブスク「Meta One」 月949円でAI拡大・インスタ追加機能","summary":"Metaは15日(米国時間)、サブスクリプションサービス「Meta One」を発表した。Facebook、Instagram、WhatsAppの単体プランと、Meta AIを組み合わせた複数アプリ向けのバンドルプランを用意する。日本を含むグローバルで順次導入しており、料金は月額239円から。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141036.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.474Z"},{"title":"「闇バイトを紹介してくれ」栃木強盗殺人事件でリクルーター高校生の裁判 「インスタのストーリーで“1000万円の仕事”を見た」【news23】","summary":"今年5月、栃木県で69歳の女性が殺害された強盗殺人事件。実行役の少年を勧誘した罪に問われている男子高校生は15日に始まった裁判で、少年から「闇バイトを紹介してくれ」と言われたと明かしました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947643?utm_source=lootura.com","publishedAt":"2026-09-15T16:14:15.000Z"},{"title":"DeepL Voice「音声通訳」に対応 話者の声のまま日本語も翻訳","summary":"DeepLは、リアルタイム音声翻訳サービス「DeepL Voice」において、話者の声のまま相手の言語で届く「音声通訳」を開始する。声や感情表現を含む通訳は、日本語を含む14言語で対応する。また、Windows/Macのデスクトップアプリも提供開始する。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141087.html?utm_source=lootura.com","publishedAt":"2026-09-15T22:43:39.474Z"},{"title":"ヘンリー王子とメガン妃が子どもたちを早くも転校させる「安全上の懸念」か 先月、アメリカから生活拠点を移したばかり 現地メディア報じる","summary":"アメリカからイギリスに生活拠点を移したばかりのヘンリー王子とメガン妃が、2人の子どもを新学期開始からわずか数日で転校させたと報じられました。 ヘンリー王子とメガン妃の2人の子ども、7歳のアーチー王子と5歳のリリベット王女は、先月、アメリカから引っ越してきた後、先週から学校に通い始めました。 しかし、ヘンリー王子とメガン妃が「安全上の懸念から、新学期開始からわずか数日で別の学校に転校させた」と14日、イギリスのニュース専門チャンネルスカイニュースが伝えています。 夫妻の広報担当者は、転校について、現在の生活上の事情を踏まえて家族の警備チームと話し合った結果、決定したと説明。そのうえで、「学校やそこで子どもたちが受けてきた素晴らしいケアに対する評価を否定するものでは決してない」としています。 報道によると、通学路の交通渋滞や移動距離の長さ、夫妻の車列が妨害されるなどしたことが影響しているということです。 ヘンリー夫妻をめぐっては、チャールズ国王が7日、王室を離脱した立場は変わらず、公務には復帰しないとの考えを改めて明らかにしています。 イギリスでは現在、一家の帰国を受け、警備上のリスク評価が行われていて、今後、政府の委員会が公費による警備を受ける資格があるかどうか判断する見通しです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947614?utm_source=lootura.com","publishedAt":"2026-09-15T15:30:46.000Z"},{"title":"Homebrew 7.0.0リリース、パフォーマンス向上・セキュリティ強化の一方でmacOS 10.15のサポート終了・Intel MacがTier 3に移行","summary":"2026年9月13日にパッケージマネージャーのHomebrewがメジャーアップデート「7.0.0」をリリースしました。今回のバージョンアップは数々の重要な変更点を含んでおり、開発者のための環境がより高速かつ安全になる一方でmacOSのサポートポリシーに大きな変更が見られます。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260916-homebrew-v700/?utm_source=lootura.com","publishedAt":"2026-09-15T22:00:00.000Z"},{"title":"【レベル３大雨警報】愛知県・名古屋市に発表 00:21時点","summary":"気象台は、16日午前0時21分に、レベル３大雨警報を名古屋市に発表しました。 西部では、低い土地の浸水や河川の増水に警戒してください。 【大雨警報（発表中）】 ■名古屋市 ●レベル３大雨警報【発表】 ■瀬戸市 ●レベル２大雨注意報 ■春日井市 ●レベル２大雨注意報 ■豊田市西部 ●レベル２大雨注意報 ■安城市 ●レベル２大雨注意報 ■東海市 ●レベル２大雨注意報 ■大府市 ●レベル２大雨注意報 ■豊明市 ●レベル２大雨注意報 ■日進市 ●レベル２大雨注意報 ■みよし市 ●レベル２大雨注意報 ■長久手市 ●レベル２大雨注意報 ■東郷町 ●レベル２大雨注意報","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947638?utm_source=lootura.com","publishedAt":"2026-09-15T15:22:23.000Z"},{"title":"Googleは自社製高性能AIで怪しい広告をブロックできるはずなのに一体なぜ配信し続けているのか？","summary":"ウェブサイトを閲覧していると「スマートフォンの容量不足」や「ウイルス感染」を知らせる画面に偽装した詐欺広告が高頻度で表示されます。また、詐欺広告の中には「次へ」とか「ダウンロード」といったウェブサイトのUIの一部に偽装したものも存在しており、非常に悪質です。ソフトウェア開発者のクリス・グリーニング氏は、YouTubeで見かけた警告風の広告をGoogleへ報告した経緯を自身のブログにつづり、Googleの広告審査に疑問を投げかけています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260916-google-dodgy-ads-gemini/?utm_source=lootura.com","publishedAt":"2026-09-15T21:00:00.000Z"},{"title":"福岡県議会が制定目指す「政治倫理条例」の素案がまとまる 16日からパブリックコメント実施へ","summary":"福岡県議会が9月定例会中の制定を目指している議員の政治倫理を定めた条例案の素案がまとまりました。 福岡県議会では15日午後、政治倫理に関する条例の「検討会議」のメンバーが議長と副議長に素案を提出しました。 素案では、政治倫理基準に反する疑いがある場合、外部有識者のみの審査会を設置することや辞職後の議員であっても在職中の行為について事実解明に努めることなどが盛り込まれています。 政治倫理条例の素案については、16日から9月30日までパブリックコメントを実施し県民からの意見を募ったうえで、9月定例会に提案される予定です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947635?utm_source=lootura.com","publishedAt":"2026-09-15T15:11:26.000Z"},{"title":"メルカリ、ポケカ最新パックの出品禁止に","summary":"メルカリは9月15日、ポケモンが16日に発売する「ポケモンカードゲーム 30th CELEBRATION」を同日から出品禁止にすると発表した。","source":"アイティメディア","author":"[ITmedia]","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001506/?utm_source=lootura.com","publishedAt":"2026-09-15T10:45:28.000Z"},{"title":"【発達する熱低情 唯一参加している大阪維新の会は党内で、来春の統一地方選で適用される大阪市議会の定数を踏襲し、4区で計70とする方針を確認した。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/010/022000c?utm_source=lootura.com","publishedAt":"2026-09-15T03:01:11.000Z"},{"title":"ドラマ「VIVANT」のワンシーンに映像制作界隈が「ぞっとする」 microSDカードを端子むき出しで手渡し","summary":"TBSの日曜劇場「VIVANT」のワンシーンがXで話題だ。SDカードを端子むき出しのまま素手で受け渡す描写に、映像制作者を中心に注目が集まっている。","source":"アイティメディア","author":"林裕也","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001503/?utm_source=lootura.com","publishedAt":"2026-09-15T09:26:03.000Z"},{"title":"中部電力の林社長が御前崎市長や静岡県知事らに謝罪 浜岡原発データ不正問題めぐり再稼働審査の申請取り下げと引責辞任を伝達","summary":"中部電力 林欣吾 社長 「心よりお詫び申し上げます。申し訳ございませんでした」 浜岡原発の再稼働審査に必要な耐震設計のデータを不正に操作した問題をめぐり、中部電力の林社長は15日、静岡県御前崎市を訪問。 下村市長に謝罪したうえで、再稼働審査の申請取り下げや、今月末での引責辞任を伝えました。 林社長はその後、静岡県知事や周辺自治体の市長らとも面会し、謝罪しました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947636?utm_source=lootura.com","publishedAt":"2026-09-15T15:03:20.000Z"},{"title":"「りくりゅう」全国ツアー開催へ 来年1月から約10カ所で | 毎日新聞","summary":"フィギュアスケート・ペアでミラノ・コルティナ冬季オリンピック金メダルの「りくりゅう」こと三浦璃来さん（24）、木原龍一さん（34）組が、アイスショーの全国ツアー「りくりゅうのありがとうツアー」を開催することになった。15日、2人が東京都内で記者会見を開き発表した。来年1月の大阪公演（1月8～10日","source":"毎日新聞","author":"倉沢仁志","category":"general","url":"https://mainichi.jp/articles/20260915/k00/00m/050/070000c?utm_source=lootura.com","publishedAt":"2026-09-15T03:00:11.000Z"},{"title":"「監視されていないときのAIは、もう評価できない」 OpenAI現役研究者が個人声明","summary":"OpenAIの現役研究者ダニエル・セルサム氏は個人的な声明を公開し、モデルの状況認識向上により人間がその真の振る舞いを評価できなくなりつつあると警告した。意図しない目標を獲得したAIが制約から解放された場合、地球環境を損なうほどの極端な行動を取る恐れがあるとし、現行の安全対策に疑問を投げ掛けた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001500/?utm_source=lootura.com","publishedAt":"2026-09-15T08:33:37.000Z"},{"title":"【自民党役員人事】副総裁・幹事長・政調会長・選対委員長を留任させる意向 総務会長には梶山国会対策委員長を起用へ","summary":"あさって（17日）の内閣改造を前に、あす（16日）行われるのは自民党の役員人事です。 高市総理は麻生副総裁、鈴木幹事長のほか、小林政調会長、西村選対委員長を留任させる意向を固めました。また、総務会長には梶山国会対策委員長を起用する方針です。 さらに、合わせて行われる参議院自民党の人事では、石井参院幹事長が交代することが分かりました。石井氏は国会運営に精通し、野党とも太いパイプを持つことで知られていますが、先の特別国会での予算審議日程などをめぐり、高市総理が不信感を抱いているとされていました。 後任には、青木一彦参院議運委員長を起用する方向です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947633?utm_source=lootura.com","publishedAt":"2026-09-15T14:48:57.000Z"},{"title":"VAIOが再び“挑戦”する理由 ノジマが後押し、独自のマルチフリップ機構が復活へ","summary":"25年にノジマ傘下に入ったVAIO。これまで法人向けの保守的な製品が多かった同社だが、ノジマの後押しを受けて再び挑戦するという。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/11/2000001417/?utm_source=lootura.com","publishedAt":"2026-09-15T06:37:31.000Z"},{"title":"炎天下の駐車場に「足もとがおぼつかない」高齢男性…会社員が“とっさの判断”で声掛け・氷で冷却し110番 認知症で行方不明の70代男性を救い感謝状 奈良・郡山警察署","summary":"奈良市で行方が分からなくなっていた認知症の７０代男性を発見し、 熱中症の手当てをして人命救助に貢献した として、警察から会社員の男性に感謝状が贈られました。 奈良県郡山警察署から感謝状を贈られたのは、奈良県に住む会社員の井手和則さん（５１）です。 炎天下での迅速な応急措置と通報 井手さんは先月２２日の午後２時ごろ、奈良市内にある勤務先の駐車場で、 炎天下のなか足もとがおぼつかない様子で歩く高齢の男性（７６）を見かけました 。 危険を感じた井手さんがとっさに声をかけると、男性には熱中症とみられる症状がありました。 井手さんはすぐに氷で体を冷やしたり、スポーツドリンクを買って渡したりするなどの 応急措置を行ったうえで１１０番通報 しました。 行方不明の認知症男性を救った一手 警察によりますと、男性は認知症を患っていて、その日のあさ９時ごろから行方が分からなくなり、 家族が行方不明届を出していた ということです。 井手さんの適切な対応ととっさの判断が、男性を救うお手柄となりました。 井手さんは「結果的に助かったということでよかったです。今後もこのようなことがあったら、助けられたらいいなと思います」と話しました。 警察は「認知症の疑いのある高齢者は、自分で助けを求めることがなかなかできない。 周りの人間がそれに気づいて一声をかけることが大切 。おかしいと感じたら、声をかけていただく、警察に通報していくことをお願いしたい」と呼びかけました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947467?utm_source=lootura.com","publishedAt":"2026-09-15T10:58:27.000Z"},{"title":"映画「バックルームズ」が怖くなかったマンガ家、基になったネット都市伝説にハマって本作の楽しみ方を理解する","summary":"4日に日本でも公開された映画「バックルームズ」が、世界中で大ヒットしています。個人的にあまり怖くなかったのですが、基になった都市伝説を調べるうちに見方が変わりました。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/13/2000001423/?utm_source=lootura.com","publishedAt":"2026-09-15T06:35:03.000Z"},{"title":"「ミシミシミシって音が…」介護施設に続く唯一の道路 復旧費用の補助に“私道”の壁 記録的大雨の土砂崩れで一時通れず 富山・氷見市","summary":"8月27日の記録的大雨による土砂崩れで施設をつなぐ私道が一時塞がれてしまっていた富山県氷見市の介護保健老人施設の「エルダーヴィラ氷見」。道路は一部復旧しましたが、施設側は連日の雨による二次災害を懸念しています。また、復旧には高額な費用がかかる見込みで、県を通じて国に対して補助を求めています。 富山県氷見市余川の山あいにある「エルダーヴィラ氷見」。 通いでのリハビリや入所での療養介護など市内の高齢者130人が利用しています。 施設へと繋がる道はただ一つ、山道を登っていくのですが―― 岩木秋河記者 「片道一車線分確保されていますが、そのすぐそばでは、現在でも土砂崩れの爪あとが残っています」 土のうでせき止められた土砂と倒木。 法面からは、水が流れ続けています。 職員らが手作業で... 8月28日、土砂崩れが起きた後の様子をチューリップテレビが取材していました。 上瀬航志記者 「氷見市の余川地区です。土砂崩れが起き、木が倒れ道路を塞いでいます。手作業による土砂の撤去作業が始まっています」 現地では当時、施設に生活必需品や食料を届けるために人が通れるよう、職員や地元の人たちが手作業で応急処置を行っていました。 施設では大雨による直接の被害はありませんでしたが、利用者を送迎する車両が通れなくなり、8月31日まで休業を余儀なくされました。 「ミシミシミシって音がする」 9月1日にようやく一車線分の道を確保し、施設も再開しましたが―― エルダーヴィラ氷見 角井誠事務長 「道作っている途中に、ミシミシミシって音がするんですよ。というのは、崖がまた崩れる前兆なんですね。そのときはもう『止めろ』というかたちで退避したり、そういうような状況。自然というのは、恐ろしいもんですね」 取材した15日も、市内では雨が降り続けていました。 エルダーヴィラ氷見 角井誠事務長 「心配ですね。また二次災害が起きないか、いつ崩れるか分かりませんもんね」 一般的に「私道」は補助の対象外 復旧に向けて新たな課題も見えてきました。 土砂崩れが起きた道は市道から枝分かれしていて、施設が所有する、いわゆる「私道」。 公道とは異なり、復旧は自己負担となります。 エルダーヴィラ氷見 角井誠事務長 「（Q．相当な金額がかかりそう）ちょっとまだ見当もつきません。（業者からは）『民間が発注するレベルの工事ではないですよ』と」 被災した福祉施設の復旧費用は、国から一定の補助を受けられる可能性がありますが、一般的に補助の対象は、建物や敷地などで「私道」は対象外となっています。 施設側は、土砂崩れのあった「私道」が施設につながる唯一の移動経路だとして、費用を補助の対象とするよう県を通じて国に求めています。 エルダーヴィラ氷見 角井誠事務長 「これだけ自然災害でございますので、これはとてもじゃないけれども私らだけの力でやるということは到底無理だと思います。県も国も一生懸命やっていただけると、そういうふうに期待しております」","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947373?utm_source=lootura.com","publishedAt":"2026-09-15T10:12:53.000Z"},{"title":"パナのBDレコーダーが“クラウド録画”に対応 何ができて、何ができない？","summary":"パナソニックは14日、初の“クラウド録画”に対応した「全自動ディーガ」を発表した。クラウド録画ではどんなことができるのか。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001482/?utm_source=lootura.com","publishedAt":"2026-09-15T06:30:28.000Z"},{"title":"長崎県内の地価「住宅地」が28年ぶり上昇 諫早・佐世保で安定した需要 全用途平均は2年連続プラス","summary":"長崎県内447地点で行われた2026年の地価調査結果が公表され、「住宅地」は28年ぶりの上昇となりました。 市町・用途別 対前年平均変動率一覧表 長崎県の調査によりますと、2026年7月1日時点の県内の地価は、全用途の平均変動率が前年から0.3％上昇し、2年連続のプラスとなりました。 「住宅地」は28年ぶりの上昇 用途別では、去年は横ばいだった「住宅地」が0.1％上昇し、28年ぶりのプラスとなりました。 諫早市の中心部や佐世保市の新興分譲住宅地では、需要が安定しているということです。 また、長崎市では建築費の高騰や金利の上昇が懸念される一方、郊外の住宅用地や中古住宅の需要が増加しているということです。 「商業地」「工業地」も上昇 「商業地」は3年連続のプラスとなったほか、「工業地」も2.0％上昇し、上昇基調となりました。 一方、調査を担当した不動産鑑定士は、人口減少が見られる地域では、今後も地価の下落が顕著に続く見込みだとしています。 地価調査結果（価格と変動率）について長崎県内の変動率（高位と低位）を画像で掲載しています 住宅地の平均変動率の分布図 商業地の平均変動率の分布図 基準地変動率順位(高位) (住宅地) 基準地変動率順位(高位) (商業地) 基準地変動率順位(低位) (住宅地) 基準地変動率順位(低位) (商業地) 基準地価格順位(高位) (住宅地) 基準地価格順位(高位) (商業地) 基準地価格順位(高位) (工業地)","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947197?utm_source=lootura.com","publishedAt":"2026-09-15T09:07:18.000Z"},{"title":"日本郵便、荷物の本人確認をICチップ付き身分証4種に限定 スマホのマイナカードで受け取れる場合も","summary":"日本郵便は9月14日、名あて人本人にのみ郵便物を渡す「本人限定受取郵便」を2027年4月1日から見直すと発表した。受け取り時の本人確認書類をICチップ付きの4種類に限定し、パスポートなどは使えなくなる。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001492/?utm_source=lootura.com","publishedAt":"2026-09-15T05:55:27.000Z"},{"title":"【地価調査】岡山県は3年連続で上昇 住宅地の最高価格は23万7000円（1㎡あたり）","summary":"岡山県と香川県の土地取引の指標となる価格、地価調査の結果が発表されました。地価の動きを示す平均変動率は岡山県全体・全用途ではプラス0.3%と、3年連続で上昇しました。 住宅地の平均変動率はマイナス0.2%で29年連続の下落、岡山市、倉敷市、総社市、早島町、里庄町のみ上昇しました。 商業地は全体でプラス1．2%と5年連続の上昇です。最高価格は、住宅地では岡山市北区伊福町3丁目で1平方メートルあたり23万7000円、商業地では岡山市北区錦町で1平方メートルあたり216万円でした。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2946771?utm_source=lootura.com","publishedAt":"2026-09-15T09:07:17.000Z"},{"title":"シャープ、AIサーバ事業に参入 30年度に新規事業の“大半”占める売上2500億円目指す 狙いは？","summary":"シャープは9月15日、AIサーバ事業に参入すると発表した。同日から、米NVIDIAのGPUを搭載した業務向けAIサーバの受注を始める。まずはサーバ販売から開始し、今後は導入支援や保守、国内生産などに事業領域を広げる。国内のAI推論市場を主戦場に、2030年度に売上高2500億円を目指す。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001483/?utm_source=lootura.com","publishedAt":"2026-09-15T05:45:06.000Z"},{"title":"熊本県で最大震度1の地震 熊本県・水俣市","summary":"15日午後6時1分ごろ、熊本県で最大震度1を観測する地震がありました。 気象庁によりますと、震源地は熊本県天草・芦北地方で、震源の深さはごく浅い、地震の規模を示すマグニチュードは2.3と推定されます。 この地震による津波の心配はありません。 最大震度1を観測したのは、熊本県の水俣市です。 【各地の震度詳細】 ■震度1 □熊本県 水俣市 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947201?utm_source=lootura.com","publishedAt":"2026-09-15T09:05:32.000Z"},{"title":"会社を丸ごとAIに経営させるAIエージェント「Pion」が登場、メール・電話・銀行機能まで使って事業を自律運営","summary":"AIに文章作成や調査を任せるだけでなく、会社の経営そのものをAIエージェントに任せるためのプラットフォーム「Pion」をAndon Labsが発表しました。PionではAIエージェントが長時間動き続け、メールや電話、ブラウザ、銀行機能などを使いながら事業運営を進めます。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-pion/?utm_source=lootura.com","publishedAt":"2026-09-15T14:00:00.000Z"},{"title":"【地価調査】香川県は34年連続下落 商業地の最高価格は49万5000円（1㎡あたり）","summary":"香川県の全用途平均の変動率はマイナス0.3%で、34年連続の下落となりました。住宅地の価格は多くの市町で下落が目立つ中、高松市では都心回帰の動きが見られることなどから、平均変動率は0.2%と3年連続の上昇です。 最も高かったのは高松市番町3丁目で、1平方メートルあたり31万3000円でした。商業地で最も価格が高かったのは高松市磨屋町で、1平方メートルあたり49万5000円です。 調査をした不動産鑑定士は、生活利便性に優れる中心地と人口減少が進む郊外で二極化が強まっていると話しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2946787?utm_source=lootura.com","publishedAt":"2026-09-15T09:04:42.000Z"},{"title":"不正アクセスで「当選」が「落選」に改ざん ウルトラマンショップのLINE整理券システムで被害","summary":"LINE整理券システム「モギリー」に外部から不正アクセスがあり、本来「当選」だった客133人のステータスが「落選」に書き換えられた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001480/?utm_source=lootura.com","publishedAt":"2026-09-15T03:33:53.000Z"},{"title":"町の新名物！温泉から作る「月山山塩」がお披露目 茶褐色の源泉から生まれる真っ白な塩…そのお味は？","summary":"山形県西川町では町の新たな特産品が誕生し、きょう（15日）商品発表会が行われました。 温泉から作る、その名も 「月山山塩」 です。 「月山山塩」は、西川町にある温泉の中でも最も多く塩分とカリウムを含む、志津温泉を原料としています。 西村雛妃アナウンサー 「こちらが志津温泉の源泉です。源泉は茶褐色なのですが、この源泉を煮詰めて不純物を取り除くことで、このような真っ白な山塩になるということです」 こだわりはこのパッケージにも。 「月」の文字は月山の滑らかな山の曲線をイメージしています。 商品発表会のあとは、関係者に向けた試食会が行われました。 西川町 菅野大志 町長 「うまみがありますね。さすが志津温泉の塩ですね」 関係者は 「和牛の味を引き立たせるような味。すごくおいしい」 西村アナも月山筍の天ぷらにつけていただきました。 西村雛妃アナウンサー 「脂身をお塩がすっと抑えてくれる。かなりさっぱり食べられる。天ぷらにも合いますね」 優しい塩気と、山塩ならではのうまみが口いっぱいに広がりました。 みやま湯殿の山塩 宮崎正 代表取締役 「単純な道のりではなかったが、みんなのおかげでここまで来れた。物の素材の味を引きだすのが塩。シンプルにかけて、例えば温野菜にも非常に合うので試していただきたい」 この月山山塩は、現在、西川町内の旅館や道の駅で購入できるということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2946617?utm_source=lootura.com","publishedAt":"2026-09-15T09:03:11.000Z"},{"title":"ドコモ、26年度中に5G基地局1万局以上を整備へ 通信品質の巻き返し図る","summary":"NTTドコモの坪谷寿一副社長は14日までに、産経新聞などの取材に応じ、2026年度中に5G基地局を1万局以上整備する方針を明かした。ターミナル駅など人が集まる場所に小型基地局を数多く設置し、体感品質を改善する。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001479/?utm_source=lootura.com","publishedAt":"2026-09-15T03:23:18.000Z"},{"title":"新たな台風に発達へ 今後は？気象予報士解説（9月15日午後6時）","summary":"日本の南にある熱帯低気圧は、あす16日までに台風25号に発達し、鹿児島県内に影響が出るおそれがあります。最新の予想進路について。大山気象予報士の解説です。 午後3時の雲の様子をご覧ください。日本から遠く離れた南の海にあるこちらの雲が熱帯低気圧の雲です。 今はまだ、まとまりはなく、台風ではなく熱帯低気圧のままです。 では、進路をご覧ください。こちらの熱帯低気圧、あす16日までには台風になる予想です。 北寄りから次第に西寄りに進路を変えて、20日日曜日には日本の南に進む予想です。 この時の中心気圧は965ヘクトパスカル、最大風速は35メートルで、強い台風になりそうです。 では、雨と風の予想です。20日の夜からご覧ください。 この後、沖縄地方付近を通過して東シナ海を次第に北上する可能性があります。 ただ、こちらは気象庁のコンピューターによる予測のひとつで、予報にはまだ幅があって変わる可能性があります。 こちらの予想ほど西寄りの進路を取らずに、東寄りの進路を取る可能性もあります。 では、週間予報を見てみましょう。 19日土曜日から連休の方もいらっしゃると思います。20日日曜日以降は雨となりそうですが、台風の進路によって変わる可能性があります。 連休でお出かけの予定のある方もいらっしゃると思いますが、最新の情報を確認し、無理のない計画を立ててください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947059?utm_source=lootura.com","publishedAt":"2026-09-15T09:02:36.000Z"},{"title":"Netflixとセガが提携、名作ゲームを続々映像化へ 第1弾は「クレイジータクシー」","summary":"米Netflixとセガは9月15日、セガのゲーム作品を映像化するパートナーシップを発表した。第1弾として「クレイジータクシー」を実写コメディ映画化するほか、「ソニック・ザ・ヘッジホッグ」「STRANGER THAN HEAVEN」の映像化も進める。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001476/?utm_source=lootura.com","publishedAt":"2026-09-15T02:58:03.000Z"},{"title":"文科省の教育改革拠点に大分県立高校など3か所選定 ドローン農業やAI活用、遠隔授業の拡大へ","summary":"文部科学省による教育改革の一環として、新コースの開設や新しい機材の導入が進められる拠点に、大分県立高校2校と教育センターが選ばれました。 今回、改革先導拠点に選ばれたのは、県立三重総合高校、県立情報科学高校、それに県遠隔教育配信センターの3か所です。 このうち三重総合高校では、ドローンなどを用いて農作物を管理する実践や農業大学校や、地元企業と連携して実際の現場で学ぶコースが設置されます。 また、県遠隔教育配信センターでは、教員と生徒が画面越しにリアルタイムでやり取りできる授業配信の仕組みを拡大します。 県教委高校教育課・鈴木耕平課長「他校との共同学習であったり、また教員の質の向上にも取り組んでいきたい」 情報科学高校では、データに基づき地域や企業の課題を解決する科目が設置され、AIなどを活用する教育が進められます。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2947161?utm_source=lootura.com","publishedAt":"2026-09-15T08:58:38.000Z"},{"title":"「かさばるから…」で諦めない。口をつけずに息で膨らますネックピロー","summary":"移動時間を休息に。いよいよシルバーウィークが近づいてきましたね。旅行の移動時間はリカバリーにあてたいところです。「ネックピロー、邪魔じゃない？」と思っていたわたしですが、2年近く前に取り入れてから今では旅行の必需品になっているのが、マーナの…","source":"ギズモード・ジャパン","author":"mio","category":"technology","url":"https://www.gizmodo.jp/article/marna-onebreath/?utm_source=lootura.com","publishedAt":"2026-09-15T22:00:00.000Z"},{"title":"株式会社を設立した高梁城南高校の生徒たちも参加 「岡山県しんきん合同ビジネス交流会」","summary":"企業同士の商談の場を設け、新たなビジネスチャンスを提供しようという交流会がコンベックス岡山で開かれました。 去年9月に株式会社を設立した高梁城南高校の生徒たちも参加しました。企業のブースで製品の説明を行います。 コンベックス岡山で開かれた「岡山県しんきん合同ビジネス交流会」は、出展企業同士の交流を通じて販路拡大などにつなげもらおうというもので、県の内外から440社が参加しました。 今回は新たに次代を担う若者たちが出展する「学生エリア」を設置。 去年9月に株式会社を設立した高梁城南高校のブースでは、デザイン科の生徒が手がけた「ふきやねこ」のグッズを展示し、キャラクタービジネスをアピールしました。 （JONANホールディングス高校生COO兼営業部部長 小原大輝さん） 「高校生らしさをアピールしたいなと思っていて、僕たちの自由な発想でそれぞれの専門学科の特徴を生かしたような依頼を受けられるということを全面にアピールしていきたいなといふうに思っています」 （おかやま信用金庫 桑田真治理事長） 「今回は学生もいるんですけどいろんな人の考え方をコラボして、その中から新しい価値を見出していっていただきたいというふうに思ってます」 ビジネス交流会の実行委員会は今後も地元企業の連携などを通じて地域経済の活性化を目指したいとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2946760?utm_source=lootura.com","publishedAt":"2026-09-15T08:53:17.000Z"},{"title":"ローカルでAIを動かして元を取るまで何年かかるかがわかる「Sunk Cost」、例えばメモリ64GBのMac Studioではどれだけの時間が必要なのか？","summary":"PCの購入費用やAIの利用量などを基に、ローカルでAIを動かした場合に何年で元が取れるかを試算できるサイト「Sunk Cost」が公開されています。費用だけでなく、そのPCに収まるAIモデルや生成速度、クラウドモデルとの能力比較もまとめて確認できます。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-sunk-cost/?utm_source=lootura.com","publishedAt":"2026-09-15T12:00:00.000Z"},{"title":"老人ホームや障害者支援施設など福祉の現場の優良従事者8人を表彰 山陽新聞社会事業団【岡山】","summary":"岡山県内の福祉の現場で長年にわたり活躍してきた優良従事者の表彰式が、岡山市北区で開かれました。 山陽新聞社会事業団が老人ホームや障害者支援施設など、福祉の現場で長年活躍している人たちを表彰するもので、今年は8人が選ばれました。 式では桑原功理事長が、「皆さんの日々の献身的な活動に感謝いたします」と述べ、受賞者一人ひとりに表彰状と記念品を手渡しました。 （受賞した旭川学園 中町千春支援課長） 「これを糧に今後の福祉というものと、人材育成であるとか、風通しの良い環境であるとか、少しでも皆さんの今後につなげていけたら」 表彰は今年で52回目となります。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2946138?utm_source=lootura.com","publishedAt":"2026-09-15T07:18:30.000Z"},{"title":"「GREEN×EXPO 2027」まであと半年 大屋根リングを使った5万円の限定パス","summary":"GREEN×EXPO協会は9月15日、「GREEN×EXPO 2027」(2027年国際園芸博覧会)の開催半年前記者発表会を都内で開催しました。","source":"インプレス","author":"株式会社インプレス","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141177.html?utm_source=lootura.com","publishedAt":"2026-09-15T11:36:29.000Z"},{"title":"被災者にきめ細かい支援を 支援センター開設 仮設住宅入居を前に 熊本市・南区","summary":"今年7月の熊本地震で被災した仮設住宅の入居者や在宅避難者に、きめ細かい支援をしようと、熊本市が南区に支援センターを開設しました。 生活再建に向け総合的に支援 熊本市が南区役所に開設した「くらし再建支え合いセンター」は、市の職員や社会福祉協議会のメンバーが、区内の被災者を対象に生活再建や孤立防止などの支援を総合的に行います。 9月19日に仮設住宅への入居が始まるのを前に、担当者はさっそく、支援が必要な人の名前や被害の状況を記した「被災者カルテ」などを確認していました。 来週以降は対象者への個別訪問を行い、健康状態の確認や、金銭的な悩みなどを聞き取る予定です。 南区くらし再建支え合いセンター 東貴子統括 「被災した市民が今までの生活に早く戻れるように支援していきたい」","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2944817?utm_source=lootura.com","publishedAt":"2026-09-15T03:17:48.000Z"},{"title":"初代Switchに脆弱性 QRコード読み取りで情報漏えいの恐れ 深刻度「高」","summary":"一部の機能を利用する際に表示されるQRコードを悪意のある第三者に直接読み取られると、不正なコードを実行されたり、本体内の情報を取得されたりする恐れがある。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001474/?utm_source=lootura.com","publishedAt":"2026-09-15T01:32:52.000Z"},{"title":"被害総額2億円以上か 民家から現金や金庫など盗んだ疑いで職業不詳の男(23)を逮捕 トクリュウ関与か 広島県福山市","summary":"広島県福山市の民家から現金や金庫などを盗んだとして広島県警は15日、住居職業不詳の男(23)を窃盗と住居侵入の疑いで逮捕しました。被害総額は2億円以上にのぼります。 警察によりますと、男は他6人と共謀のうえ、2025年11月27日に福山市西新涯町の住宅から現金600万円や金庫2個など176点（時価合計2億657万3759円相当）を盗んだ疑いが持たれています。 警察は男の認否を明らかにしていません。 事件には匿名流動型犯行グループ（トクリュウ）が関与しているとみられていて、警察が事件の詳しいいきさつを調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945163?utm_source=lootura.com","publishedAt":"2026-09-15T03:17:07.000Z"},{"title":"本棚や机といったDIY家具の「設計」「材料一覧確認」「作り方確認」まで実行できるウェブアプリ「ShopSpec」","summary":"「ShopSpec」は本棚や机の設計から組み立て手順解説まで担ってくれるDIYお助けアプリです。表記は英語で寸法もインチで示されていますが、スライダーを動かして家具を設計しているだけでも楽しいアプリに仕上がっています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-shopspec-diy/?utm_source=lootura.com","publishedAt":"2026-09-15T11:00:00.000Z"},{"title":"東海地方は非常に激しい雨や雷雨に注意 今後の雨シミュレーション 愛知･名古屋･岐阜･三重の天気予報（9/15 昼）","summary":"きょうの午後は、非常に激しい雨や雷雨にご注意下さい。 正午前の名古屋市内は、きょうも雨が降ったりやんだりで、気温は26.3℃とジメジメとしています。 湿った空気の影響で、東海地方は大気の状態が不安定です。午後も断続的に雨が降るでしょう。 予想最高気温は、名古屋・岐阜・津で28℃。きのうよりやや低いですが、湿度が高くムシっとしそうです。 夜にかけて1時間に50ミリ前後の非常に激しい雨 夜にかけて、1時間に50ミリ前後の道路が川のようになるほど非常に激しい雨の降る所があるでしょう。落雷や突風のおそれもあり、注意が必要です。 【週間予報】 東海地方は、あす以降もぐずついた天気が続き、土曜日からのシルバーウィークも断続的に雨が降るでしょう。 今後発生する見込みの台風の進路次第では、雨が強く降る恐れがあり、今後の情報に注意が必要です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945158?utm_source=lootura.com","publishedAt":"2026-09-15T03:16:45.000Z"},{"title":"Googleが自社製品に使ったオープンソースの開発者名を勝手に削除してライセンス表示もしていなかったことが発覚","summary":"オープンソースソフトウェアはソースコードを自由に使用・調査・再配布・改変できるソフトウェアであり、現代ではさまざまなソフトウェア製品やツールにオープンソースのコードが含まれています。ところが、Googleがリリースした製品に含まれるオープンソースソフトウェアを開発したスタートアップが、「Googleが勝手にコードからオリジナルの開発者名を削除した」と指摘しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-google-removed-open-source-credit-authors/?utm_source=lootura.com","publishedAt":"2026-09-15T11:00:00.000Z"},{"title":"【台風情報】シルバーウィーク直撃のおそれ 新たな台風が今夜にも発生へ 18日に「強い」勢力で小笠原近海へ","summary":"気象庁の最新の発表によると、トラック諸島近海にある熱帯低気圧の発達が予想よりも早まっており、今日15日の夜（午後9時）までには南鳥島近海で「台風」に変わる見込みです。 「強い」勢力に急発達しながら北上 この熱帯低気圧（台風のたまご）は、今後海面水温の高い海域を進みながら一気に勢力を強める予想です。 15日午後9時： 南鳥島近海で台風へと発達する見込み（中心気圧1000hPa、最大風速18m/s）。 18日午前9時： 小笠原近海に達し、最大風速35m/s、最大瞬間風速50m/sの「強い」台風へ急発達する予想です。 20日午前9時： 勢力をさらに強め（中心気圧960hPa、最大瞬間風速55m/s）、引き続き「強い」勢力で日本の南を西北西へ進む見込みです。 シルバーウィーク後半への影響に警戒を 18日（金）から20日（日）にかけて、小笠原諸島に接近したのち、日本の南の海上を西へ進む予想となっています。この期間はちょうど3連休（シルバーウィーク後半）と重なるため、小笠原諸島だけでなく、西日本から東日本の太平洋側や沖縄方面でも、うねりを伴った高波や強風、大雨の影響が出るおそれがあります。 秋雨前線の活動を活発化させる要因にもなるため、今後の進路や最新の台風情報に十分注意してください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945164?utm_source=lootura.com","publishedAt":"2026-09-15T03:15:43.000Z"},{"title":"2026年9月15日のヘッドラインニュース","summary":"『Pokémon Sleep』とNOT A HOTELのコラボレーションによる「Poké Ball-Themed Hotel（モンスターボール型ホテル）」が、北海道・苫小牧市に登場しました。ポケモン30周年と『Pokémon Sleep』3周年を記念した企画で、湖のほとりに直径約3mの巨大なモンスターボール型ホテルが設置されています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-headline/?utm_source=lootura.com","publishedAt":"2026-09-15T10:52:00.000Z"},{"title":"関越道で大型トラックなど3台絡む事故 男性2人死亡 新潟・南魚沼市","summary":"昨夜遅く、新潟県南魚沼市の関越道で、故障で停車していた大型トラックに別の大型トラックと乗用車が追突する事故がありました。 記者 「事故にあった乗用車ですが、前方部分が大破しています」 乗用車に乗っていた男性2人が死亡し、2人が重軽傷を負いました。 事故の影響で、上り線の一部区間が6時間半にわたって通行止めとなりました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945159?utm_source=lootura.com","publishedAt":"2026-09-15T03:13:53.000Z"},{"title":"無人タクシー、東京で来年運行へ GO、Waymo、日本交通が合意","summary":"配車アプリ「GO」と「Waymo」それぞれから配車できる自動運転タクシーを、段階的に100台規模で運行する計画。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001472/?utm_source=lootura.com","publishedAt":"2026-09-15T00:39:38.000Z"},{"title":"日向市の小学校 学校給食に金属ネジ1本が混入 給食のポークカレーを食べた児童から担任に申し出","summary":"宮崎県日向市は、14日、市内の小学校で、給食のポークカレーに金属のネジ1本が混入していたと発表しました。 日向市学校給食センターによりますと、14日、市内の小学校で、給食のポークカレーを食べた児童から「異物が入っていた」と担任に申し出がありました。 混入していたのは、長さおよそ1.2センチの金属のネジ1本です。 これを受け、学校給食センターでは、食材の提供業者や調理場などを調べましたが、ネジの欠落などは確認できなかったということです。 14日は、日向市内の小中学校19校、およそ2500人が同じカレーを食べましたが、ほかに異物混入の報告はないということです。 日向市は、調理器具や食材の点検に加え、調理中の目視確認を徹底するなど、再発防止に努めることにしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945065?utm_source=lootura.com","publishedAt":"2026-09-15T03:13:05.000Z"},{"title":"マッチ箱サイズのIP-KVMスイッチ「JetKVM Mini」、有線接続と無線接続の両方に対応して1080pのビデオキャプチャ機能・オープンソースのファームウェア","summary":"接続したPCをネットワーク経由で遠隔操作できるマッチ箱サイズのIP-KVMスイッチが「JetKVM Mini」です。","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-jetkvm-mini/?utm_source=lootura.com","publishedAt":"2026-09-15T10:00:00.000Z"},{"title":"ヘビやクモなど見た目が怖がられている生き物にスポット「ちょっぴりこわい生き物展」 宮崎市の大淀川学習館で10月25日まで","summary":"ヘビやクモなど見た目が怖がられている生き物にスポットをあてた展示会が、宮崎市で始まりました。 「ちょっぴりこわい生き物展」と銘打ったこの展示会。 見た目などが怖がられている生き物について知ってもらおうと、大淀川学習館が企画しました。 会場には、ヘビやクモなどおよそ50種類の生き物が展示されているほか、名前の由来や生態などを記載したパネルも設置されています。 （園児）「こわくない。かわいい顔してた」「ヘビ、かっこよかった」 「ちょっぴりこわい生き物展」は、来月25日まで開かれています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2944991?utm_source=lootura.com","publishedAt":"2026-09-15T03:12:27.000Z"},{"title":"にんにく風味と辛さでごはんもガツガツいける「明星 別格麺神 名古屋台湾ラーメン」試食レビュー","summary":"極太麺のもっちり食感が特徴的な明星食品の「麺神(めがみ)」シリーズに、新しく2026年9月7日(月)から「明星 別格麺神 名古屋台湾ラーメン」が加わったので、買ってきて食べてみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-myojo-megami-nagoya-taiwan-ramen/?utm_source=lootura.com","publishedAt":"2026-09-15T09:48:00.000Z"},{"title":"肌着の匂いをもとに経路を辿る 行方不明となった高齢女性を無事発見した警察犬 指導士に感謝状","summary":"行方が分からなくなった高齢女性の発見に貢献したとして、警察犬指導士の男性に警察から感謝状が贈られました。 宮崎南警察署から感謝状が贈られたのは、宮崎市の嘱託警察犬指導士、兼田正之さんです。 兼田さんは、先月5日、警察からの出動要請を受け、警察犬の「ジークフォムネーベルドルフ号」とともに、行方不明になった高齢女性を捜索。 ジーク号は女性の肌着の匂いをもとに、歩いた経路を辿り、無事発見に至ったということです。 （嘱託警察犬指導士 兼田正之さん） 「（出動要請のある現場は）住宅地・アスファルトの上っていうところが多いのですけども、現場で練習して、より一層精度を高めていければなと考えています」 今年、県内で警察犬が出動した事案は、7月末現在48件で、ほとんどが行方不明者の捜索だったということです。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945043?utm_source=lootura.com","publishedAt":"2026-09-15T03:12:26.000Z"},{"title":"トランプ大統領、アモデイ氏を名指しで「完璧な小さい天使のふり」 「AIに必要なガードレールは強く賢い大統領だけ」","summary":"トランプ米大統領はSNSへの投稿で、AIに必要なガードレールは強く賢い大統領だけで十分だと述べ、AI企業に対する刑事・規制上の強い権限を強調した。AnthropicのアモデイCEOを名指しで批判し、AI開発を妨げる動きを中国を利する陰謀だと非難して、米国の優位性を維持する姿勢を示した。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2609/15/2000001470/?utm_source=lootura.com","publishedAt":"2026-09-14T23:15:18.000Z"},{"title":"東海道・山陽新幹線 “完全個室”グリーン車を上回る設備の最上位座席「Supreme Class」の体験イベント 販売は9月15日から","summary":"東海道・山陽新幹線に10月から導入される最上位の座席「Supreme Class」の体験イベントがJR新大阪駅で行われています。 JR新大阪駅に設置されたのは、新幹線のグリーン車を上回る設備を備えた最上位座席「Supreme Class」の体験用ブースです。 東海道新幹線に個室の座席が復活するのは23年ぶりで、この完全個室タイプは2人まで利用可能。運賃は1人で利用した場合、東京－新大阪間で6万500円です（※エクスプレス予約の場合）。 （参加者）「このソファもすごい座り心地がよかったので、これを独り占めできるならこの時間を本当に大事に過ごしたい」 10月1日から、上下線合わせて1日12本程度運行される予定で、チケットは9月15日から販売されています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2945157?utm_source=lootura.com","publishedAt":"2026-09-15T03:12:11.000Z"},{"title":"本人限定受取郵便、本人確認をマイナカードなどICチップ付き4種に限定","summary":"日本郵便は、郵便物を名あて人本人に限って渡す「本人限定受取郵便」のサービス内容を、2027年4月1日から見直す。本人確認書類を、ICチップを搭載した写真付きの4種類に限定するほか、一部のサービスではスマートフォンに搭載されたマイナンバーカードによる本人確認にも対応する。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140962.html?utm_source=lootura.com","publishedAt":"2026-09-15T09:12:00.985Z"},{"title":"警察が暴走族などの取り締まり 2日間で整備不良など6件を摘発 山梨","summary":"山梨県警は今月12日から2日間、国道20号などで暴走行為の取り締まりを行い整備不良など6件を摘発しました。 県警は違法な行為をする暴走族などの取り締まりを不定期で行っています。 今回は今月12日から2日間峡中地域の国道20号などで取り締まりを実施し6件を摘発しました。 このうち、ブレーキランプやライトの整備不良が3件、消音器不備が2件、ヘルメットの着用義務違反が1件でした。 県警は暴走族の根絶に向け今後も不正改造車両などに対する取り締まり活動を強力に推進するとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2944865?utm_source=lootura.com","publishedAt":"2026-09-15T03:09:06.000Z"},{"title":"ハンズ渋谷、11月15日に閉店 48年の歴史に幕","summary":"ハンズは、「ハンズ渋谷店」の営業終了日を11月15日に決定した。ハンズ渋谷店の閉店について同社は「賃貸借契約の満了に伴うもの」と説明している。ハンズ渋谷店は1978年9月開業で、48年の歴史に幕を下ろす。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140950.html?utm_source=lootura.com","publishedAt":"2026-09-15T09:12:00.985Z"},{"title":"関越道で大型トラックなど3台が絡む事故 乗用車の男性2人死亡 6時間にわたり一部通行止め 新潟・南魚沼市","summary":"14日夜、新潟県南魚沼市の関越自動車道で、大型トラックなど3台が絡む事故があり、乗用車に乗っていた男性2人が死亡しました。 14日午後11時半ごろ、南魚沼市四十日の関越自動車道上り線で、故障で停車中だった大型トラックに別の大型トラックが追突し、さらに後ろから走ってきた乗用車が追突しました。 警察によりますと、この事故で乗用車の男性2人が病院に運ばれましたが、15日未明までに死亡が確認されました。また、追突した大型トラックの男性運転手が骨折の重傷を負い、停車していた大型トラックの男性運転手は軽傷です。 なお、この事故の影響で、関越道上り線の魚沼インターチェンジから六日町インターチェンジの間で通行止めが行われていましたが、15日午前6時10分に解除されました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/2944484?utm_source=lootura.com","publishedAt":"2026-09-14T22:44:33.000Z"},{"title":"三菱鉛筆「uni」の箱が紙+トレーに プラスチック廃止","summary":"三菱鉛筆は、鉛筆の「uni」(ユニ)と「Hi-uni」(ハイユニ)の1ダースのパッケージをリニューアルし、9月16日から順次発売する。主要硬度であるHB、B、2Bから展開、2027年を目処に全硬度で展開する。価格はuniが1,320円、Hi-uniが1,980円。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140799.html?utm_source=lootura.com","publishedAt":"2026-09-15T09:12:00.985Z"},{"title":"NVIDIAが映像フレーム補間や生中継翻訳などの放送業界向けAIコレクション「NVIDIA AI for Media」の大幅拡充を発表","summary":"NVIDIAは放送業界向けのAIツールコレクションとして「NVIDIA AI For Media」を展開しています。このNVIDIA AI For Mediaに複数の新規AIツールが加わりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-nvidia-ai-for-media/?utm_source=lootura.com","publishedAt":"2026-09-15T08:39:00.000Z"},{"title":"KDDI、次世代スターリンクで高速通信・音声通話へ アジア初","summary":"KDDIは、衛星とスマートフォンを直接つなぐ「au Starlink Direct」について、SpaceXと次世代衛星「Starlink Mobile V2」のサービス提供契約を締結した。Starlink Mobile V2の導入はアジアで初。これにより携帯電話の圏外エリアでも高速なデータ通信や音声通話(VoLTE)を利用できるサービスを、2027年内に提供することを目指す。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140998.html?utm_source=lootura.com","publishedAt":"2026-09-15T09:12:00.985Z"},{"title":"子どもに「ADHDに関連する遺伝的傾向」があると両親が離婚しやすくなる可能性","summary":"注意欠如多動症(ADHD)は多動性や衝動性、不注意などを特徴とする発達障害であり、子どもがADHDを持つかどうかには遺伝的要因も大きいといわれています。4万組の親子を対象にした新たな研究では、「子どもがADHDに関連する遺伝的傾向を持っていると両親が別居したり離婚したりする可能性が高い」という結果が示されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-childs-genetic-adhd-parents-separation/?utm_source=lootura.com","publishedAt":"2026-09-15T07:00:00.000Z"},{"title":"iPhoneからMac、Vision Proまで Apple Intelligenceを強化する「OS 27」","summary":"アップルは14日、iOS 27、iPadOS 27、macOS 27など、各プラットフォームの最新OSを提供開始した。Siri AIや、次世代Apple Intelligenceなど多くの機能強化を行なっている。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140985.html?utm_source=lootura.com","publishedAt":"2026-09-15T09:12:00.985Z"},{"title":"ChatGPTとの会話を人間が読む「Project Lily」が進行中、個人情報がレビュー担当者に届いてしまう可能性がある","summary":"OpenAIがChatGPTの応答品質を改善するため、実際のユーザーとChatGPTの会話を人間に読ませて評価する内部プロジェクト「Project Lily」を進めていると、海外メディアの404 Mediaが報じました。レビュー担当者にはユーザー名が表示されず、個人情報を隠す処理も行われますが、会話に含まれる個人的な情報が完全には取り除かれず、人間まで届く場合があるとのことです。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-chatgpt-project-lily/?utm_source=lootura.com","publishedAt":"2026-09-15T06:00:00.000Z"},{"title":"CO2を資源に変える藻類、生産効率化へ NTTが新技術","summary":"NTTは、微細藻類が二酸化炭素(CO2)を「いつ、どれだけ吸収しているか」を連続して把握できる技術を開発した。","source":"インプレス","author":"株式会社インプレス","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2141111.html?utm_source=lootura.com","publishedAt":"2026-09-15T08:24:07.000Z"},{"title":"「Steam Frame」海外レビューまとめ、PCからの無線ストリーミングは高評価だが本体でのゲームプレイに難あり＆Meta Quest 3との比較も","summary":"2026年9月15日にSteam公式VRゴーグル「Steam Frame」が発売されました。Steam Frameに一足先に触れていた海外メディアが一斉にレビュー記事を公開していたので、装着時の快適性やゲームプレイの感想などをまとめてみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-steam-frame-summary/?utm_source=lootura.com","publishedAt":"2026-09-15T05:32:00.000Z"},{"title":"世界初のナトリウムイオン搭載モバイルバッテリー。冷凍庫で凍らせてみました","summary":"2025年12月16日の記事を編集して再掲載しています。過酷な環境下で行うアクティビティにおいても、モバイルバッテリーは欠かせない存在。しかし従来のモデルでは、発火のリスクや低温によるバッテリー容量の低下など、安全性と信頼性の両面で不安が残…","source":"ギズモード・ジャパン","author":"SUMA-KIYO","category":"technology","url":"https://www.gizmodo.jp/article/mobile_batterys_refrigerator/?utm_source=lootura.com","publishedAt":"2026-09-15T14:00:00.000Z"},{"title":"日本国内の一般国道情報が1枚マップで表示される「国道マップ」、番号重複区間でもすべての番号を表示","summary":"日本の国道情報を表示することに特化した「国道マップ」が公開されています。特徴としては、縮尺の小さい(広い範囲を表示した)状態でも番号が表示されることと、複数の番号が重複した区間(重用区間)でもすべての番号が表示されることが挙げられています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-kokudo-map/?utm_source=lootura.com","publishedAt":"2026-09-15T05:30:00.000Z"},{"title":"東京駅の新名物は\"偶然の出会い\" 「グランスタ東京」26店舗を見た","summary":"JR東京駅のエキナカ商業施設「グランスタ東京 地下 丸の内改札内エリア」が、9月16日にリニューアルオープンし、26店舗が開業する。運営するJR東日本クロスステーション デベロップメントカンパニーは、報道向け内覧会を実施した。","source":"インプレス","author":"加藤綾","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140808.html?utm_source=lootura.com","publishedAt":"2026-09-15T03:22:13.720Z"},{"title":"トランプ大統領がAIの開発ペースを遅らせようとするAnthropicのダリオ・アモデイCEOを批判、「AIが人類を滅ぼすなどという考えはデマ」","summary":"2026年9月、Anthropicのダリオ・アモデイCEOが「AIのリスクが高まっており、開発ペースを減速させる必要がある」とする声明を発表しました。これにはOpenAIのサム・アルトマンCEOやGoogle DeepMindのデミス・ハサビス会長らも賛意を示したのですが、ドナルド・トランプ大統領は反発し、既に十分な安全対策が敷かれていると指摘しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-trump-reject-ai-guardrail/?utm_source=lootura.com","publishedAt":"2026-09-15T05:03:00.000Z"},{"title":"盛り上がる「AI減速」論に「勝手にどうぞ。許可を求めるな」 トランプ政権幹部","summary":"AnthropicやOpenAIが提案するAI開発の「減速(Pacing)」案が注目を集める中、米国の科学技術に関する大統領顧問会議(PCAST)の共同議長であるデビッド・サックス(David Sacks)氏がXの投稿で反論。「どうぞご勝手に(go ahead)。ただし、代わりに好みの規制の枠組みを要求するのは、政治システムに対する脅迫だ」と述べている。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140779.html?utm_source=lootura.com","publishedAt":"2026-09-15T03:22:13.720Z"},{"title":"中国外務省がAIリスクに関する警告を「恐怖を煽る行為で誰の利益にもならない」と批判","summary":"Anthropicのダリオ・アモデイCEOが「AIのリスクが高まっており、開発ペースを減速させる必要がある」とする声明を発表した件で、中国側がこれに反発し、不要な対立をあおるべきではないとの考えを示しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-china-reject-ai-control/?utm_source=lootura.com","publishedAt":"2026-09-15T04:58:00.000Z"},{"title":"「iOS 27」公開 AI機能など大幅アップデート Siri AIは10月","summary":"アップルは15日、最新のiOS「iOS 27」を公開した。新しいAIアシスタント「Siri AI」に対応するほか、Apple Intelligenceによる大幅な機能強化やカレンダーの強化、新たな子どもの安全性のための機能などが追加されている。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140866.html?utm_source=lootura.com","publishedAt":"2026-09-15T03:22:13.720Z"},{"title":"イーロン・マスクがAppleとの独禁法訴訟を取り下げる","summary":"イーロン・マスク氏が保有するXとSpaceXAIがAppleを相手取って起こした訴訟について、マスク氏側が訴訟を取り下げたことが分かりました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-x-resolve-apple-lawsuit/?utm_source=lootura.com","publishedAt":"2026-09-15T04:31:00.000Z"},{"title":"エース、ちりめん生地の軽量キャリー「フィーナRF LTD2」","summary":"エースは、日本製トラベルバッグブランド「PROTECA(プロテカ)」から、軽量ソフトキャリー「フィーナRF」のボディにちりめん生地を採用した限定モデル「フィーナRF LTD2」を発売した。容量は18L、24L、29Lの3サイズで、価格は順に53,900円、56,100円、59,400円。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2140804.html?utm_source=lootura.com","publishedAt":"2026-09-15T03:22:13.720Z"},{"title":"OpenAIがスマホカメラメーカーのGlass Imagingを買収したとの報道","summary":"AI企業のOpenAIが、スマートフォン向けカメラを開発するGlass Imagingを3億ドル(約460億円)超で買収したと、ウォール・ストリート・ジャーナルが報じています。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20260915-openai-buys-camera-startup-glass-imaging/?utm_source=lootura.com","publishedAt":"2026-09-15T04:19:00.000Z"},{"title":"東京で自動運転タクシー、27年にスタート GOとウェイモ","summary":"タクシーアプリの「GO」と米Alphabet傘下のWaymo、日本交通は、東京で自動運転タクシーの商用化に向けた戦略的パートナーシップに合意した。3社は、2027年中に東京で国内初となる自動運転レベル4の完全無人走行による商用タクシー運行を目指す。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/21 			if (attempt < 20) window.setTimeout(() => trackLooturaContext(attempt + 1), 250);
			return;
		}

		const context = detectLooturaClient();
		window.looturaClient = context;
		window.umami.identify?.(context);

		const sessionKey = `lootura:context-tracked:${context.appMode}:${context.platform}:${context.browser}`;
		if (!sessionStorage.getItem(sessionKey)) {
			sessionStorage.setItem(sessionKey, 'true');
			window.umami.track?.('App context', context);
		}
	};

	const lockPortraitOrientation = async () => {
		const orientationApi = screen.orientation;
		if (!isLooturaPwaRuntime() || !orientationApi?.lock) return;

		try {
			await orientationApi.lock('portrait-primary');
		} catch {
			// iOS Safari and some browsers ignore orientation lock for web apps.
		}
	};

	const enforcePortraitOrientation = () => {
		lockPortraitOrientation();

		window.addEventListener('focus', lockPortraitOrientation);
		window.addEventListener('pageshow', lockPortraitOrientation);
		window.addEventListener('orientationchange', lockPortraitOrientation);
		screen.orientation?.addEventListener?.('change', lockPortraitOrientation);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') lockPortraitOrientation();
		});
	};

	if (!isProduction && 'serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistrations?.().then((registrations) => {
			registrations.forEach((registration) => registration.unregister());
		});
	}

	if (isProduction && 'serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			const reloadForUpdate = () => {
				if (isReloadingForUpdate) return;
				isReloadingForUpdate = true;
				window.location.reload();
			};
			const checkPublishedBuild = async () => {
				try {
					const response = await fetch(`${baseUrl}app-build.json?ts=${Date.now()}`, {
						cache: 'no-store',
						headers: { accept: 'application/json' },
					});
					if (!response.ok) return;
					const publishedBuild = await response.json();
					const publishedBuildId = getBuildId(publishedBuild);
					if (!publishedBuildId || publishedBuildId === currentBuildId) return;
					maybeShowReleaseUpdateNotice(publishedBuild);
				} catch {
					// Update checks should never block normal reading.
				}
			};

			navigator.serviceWorker.addEventListener('controllerchange', reloadForUpdate);

			navigator.serviceWorker
				.register(`${baseUrl}sw.js`, { updateViaCache: 'none' })
				.then((registration) => {
					const checkForUpdates = () => registration.update().catch(() => {});

					checkForUpdates();
					checkPublishedBuild();
					window.setInterval(checkForUpdates, 60_000);
					window.setInterval(checkPublishedBuild, 60_000);
					window.addEventListener('focus', checkForUpdates);
					window.addEventListener('focus', checkPublishedBuild);
					document.addEventListener('visibilitychange', () => {
						if (document.visibilityState === 'visible') {
							checkForUpdates();
							checkPublishedBuild();
						}
					});
				})
				.catch(() => {});
		});
	}

	window.addEventListener('load', () => {
		trackLooturaContext();
		enforcePortraitOrientation();
		window.setTimeout(() => maybeShowReleaseNotice(), 250);
	});
})();</script></body></html>
