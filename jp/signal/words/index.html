61010/k00/00m/310/053000c?utm_source=lootura.com","publishedAt":"2026-10-10T04:15:09.000Z"},{"title":"「監禁されている、刺された」男性が妻にＳＯＳ 不倫関係の男性刺した疑い ３３歳女を逮捕 福岡・早良区","summary":"福岡市早良区のインターネットカフェで、不倫関係にあった39歳の男性を包丁で刺したとして、33歳の女が殺人未遂の疑いで逮捕されました。 逮捕されたのは、いずれも自称で、福岡市城南区のパート、谷口久美子容疑者（33）です。 警察によりますと、谷口容疑者は9日午後7時ごろ、福岡市早良区西新のインターネットカフェの個室で、一緒にいた男性の腹や肩を包丁で刺すなどした殺人未遂の疑いが持たれています。 刺された男性は入院していますが命に別条はないということです。 2人は9日午後7時前にインターネットカフェに入店し、およそ12時間後の10日午前7時過ぎに男性が妻に携帯電話で「監禁されている。刺された。警察を呼んで」などとメッセージを送ったことで、事件が発覚しました。 連絡を受けた妻が110番通報し、駆けつけた警察官が谷口容疑者を確保しました。 谷口容疑者は、「不倫関係にあった男性を殺そうと思った。家から持ってきた包丁で刺したことは間違いない」などと話し、容疑を認めているということです。警察は、2人の間にトラブルがなかったかなど、詳しく調べています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004437?utm_source=lootura.com","publishedAt":"2026-10-10T13:05:15.000Z"},{"title":"台風被害のJR内房線 運休区間にシェアサイクル 最大300台、12時間無料","summary":"千葉県、JR東日本、袖ケ浦市、市原市、OpenStreetなどは、台風25号の影響で運転を見合わせているJR内房線の姉ケ崎駅～長浦駅間で、シェアサイクルサービスを10月14日から開始する。利用料金は12時間まで無料。鉄道や道路の復旧まで、地域住民などの移動手段を確保する。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147273.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"奥泉光さん「他人の声で書きたい欲望ある」 小説『木蓮記』刊行 | 毎日新聞","summary":"作家、奥泉光さんの新刊小説『木蓮記』（新潮社）は「偽書」の形式をとる。 明治の洋画家・松枝獏園（ばくえん）が1900年に書いた自叙伝「木蓮記」。自筆の手稿を文筆家の前田賢永（けんえい）が発見し、校訂編集を経て41年に出版された。だが、手稿は45年6月の大阪空襲で焼失。今回我々が読むのは、2020","source":"毎日新聞","author":"棚部秀行","category":"general","url":"https://mainichi.jp/articles/20261008/k00/00m/200/201000c?utm_source=lootura.com","publishedAt":"2026-10-10T04:00:14.000Z"},{"title":"気仙沼市役所前の県道でクマ目撃 8日からクマの目撃相次ぐ","summary":"10日午後5時10分頃、気仙沼市八日町2丁目の県道で南進するクマを、車で近くを通った人が目撃しました。 警察によりますと、クマの体長は約1メートルで、南進して崖のほうへ立ち去ったということです。警察が付近をパトロールしましたが、その後の目撃情報はありません。 現場は気仙沼市役所の前を東西に走る県道26号で、商店や住宅なども建ち並ぶ地域です。警察が注意を呼びかけています。 気仙沼市内では、8日からクマの目撃が相次ぎ、これまでに10件以上の情報が警察に寄せられています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004433?utm_source=lootura.com","publishedAt":"2026-10-10T12:33:21.000Z"},{"title":"千住に2100戸の複合開発「AQUA GATE」 第1弾は34階タワマン","summary":"千住大川端地区まちづくり協議会は、東京都足立区千住関屋町で進める大規模複合開発の名称を「AQUA GATE 千住大川端」に決定した。約5.2haに約2,100戸の住宅や商業施設、子育て支援施設などを整備する。第1期は2030年頃、第2期は2034年頃の竣工を予定している。","source":"インプレス","author":"清宮信志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147245.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"【あおもり国スポ】バレーボール成年男子・青森代表「大勢の人に背中を押してもらえたら」日本一へ集大成！初戦は12日15:30から","summary":"『青の煌めきあおもり国スポ』 が2026年10月10日(土)に開幕しました。20日(火)までの本会期中、全国から選ばれた代表選手たちが25の競技で熱戦を繰り広げます。 その中の一つ、『バレーボール成年男子』は、滋賀県で開催された去年の国スポで第5位入賞と健闘しました。『あすなろ国体』以来、49年ぶりの地元開催で目指すのは“日本一”です。12日(月)の初戦を前に、代表選手が数多く所属する『ブランデュー弘前バレーボールチーム』を取材しました。 地元開催の「国スポ」を目標に2021年に結成 弘前市を拠点に活動する『ブランデュー弘前バレーボールチーム』は、2021年に結成されました。 今年青森で開催される国民スポーツ大会（国スポ）に向けた強化チームとして立ち上がり、大会や遠征を重ねながらチーム力を磨いてきました。 選手の多くは、社会人選手。仕事や日常生活と両立しながら、体育館に集まり、土日を中心に練習や試合に取り組んでいます。 青森県代表・監督 小田切亮磨さん 「試合で負けて悔しい場面もありますが、このチームでバレーボールをやれることが楽しいです」 『あおもり国スポ』の成年男子・青森県代表を指揮するのは、ブランデュー弘前を率いてきた監督・小田切亮磨さんです。 そして、県代表選手は14人のうち7人は、ブランデュー弘前でプレーした経験がある選手です。 【成年男子・青森県代表】敬称略 ※大会プログラムより抜粋 ◆監督 小田切亮磨（青森県立青森第一養護学校・教員） ◆#1 山口拓也 175センチ（ブランデュー弘前） ◆#2 鳴海魁馬 190センチ（東海大学） ◆#3 三浦拓人 188センチ（名城大学） ◆#4 種市耕己 185センチ（ブランデュー弘前） ◆#5 佐藤空雅 185センチ（ブランデュー弘前） ◆#6 有馬佑太 184センチ（ブランデュー弘前） ◆#7 澤頭俊縁 180センチ（亜細亜大学） ◆#8 菊池 建 183センチ（八戸工業大学） ◆#9 武田来夢 182センチ（ブランデュー弘前） ◆#10 岡本知也 185センチ（富士通カワサキレッドスピリッツ） ◆#11 桑村拳也 180センチ（五所川原アスリートクラブ） ◆#12 春藤洸介 185センチ（ブランデュー弘前） ◆#13 山内蘭真 170センチ（ブランデュー弘前） ◆#14 千田莉夢 170センチ（八戸工業大学） 国スポを目標に結成したチームにとって、集大成となる今大会。監督も選手たちも、地元開催に特別な思いを持って臨みます。 「カッコイイ姿を見せたい」 地元開催への特別な思い 県代表チームのキャプテンを務めるのは、セッターの山口拓也さん。 青森県代表 #1・主将 山口拓也 選手 「多くの仲間がいて続けてこられたので、 前向きに笑顔でチームを引っ張って いけるようにプレーしたい」 リベロの山内蘭真選手は、レシーブでチームを勢いづけます。 青森県代表 #13・リベロ 山内蘭真 選手 「たくさんの声援の中で試合できるので、 自分の強みであるレシーブ力を青森の皆さんに見せられる ことが、とてもうれしいとともに、楽しみです」 有馬佑太選手は、力強いスパイクで得点を重ねるチームの得点源となるオポジットの一人です。 青森県代表 #6・オポジット 有馬佑太 選手 「地元開催がうれしいです。ぜひにこの機会に観戦してもらいたいです。 カッコイイ姿を見せたい です！」 地元・青森の観客の前でプレーできること。それ自体が、選手にとって特別な意味を持っています。 地元開催の今年、めざすのは日本一。去年の国スポでの成績が、チームの自信につながりました。 去年の国スポで5位入賞 40年ぶりの快挙で勢いづくチームの集大成 今回、『あおもり国スポ』に出場する選手たちは去年、滋賀県で開催された国スポで5位入賞。Vリーグで活躍する選手を要するチームも撃破してつかんだ40年ぶりの快挙でチームは勢いづきました。 国スポの本選に出場すること自体から長く遠ざかっていた青森県チーム。まずは、予選となる東北大会を制して切符を手にする必要がありました。小田切監督は振り返ります。 青森県代表・監督 小田切亮磨さん 「（あおもり国スポの）前年に東北で1位になって国スポに出場することが一つの大きな目標でした。まずは東北大会で優勝できたことと、滋賀国スポで5位に入れたことは、 本当に自信になりましたし、チームにとってもプラスになった と思います」 体育館に響くボールの音、仲間と積み重ねてきた無数の練習。その時間が、今まさに実を結ぼうとしています。 青森県代表・監督 小田切亮磨さん 「青森県で国民スポーツ大会が開催されること自体が本当に貴重なことですので、 大勢の人に来ていただいて背中を押してもらえたら 、私たちももっともっと頑張れると思いますので、応援をお願いします」 地元の声援を力に、青森県代表の選手たちは日本一を目指して戦いに挑みます。 青森テレビ「わっち!!」月〜金曜夕方4時25分から 「熱ッTube」2026年10月8日(木)放送回より ※掲載しているのは放送時の情報ですので、変更となっている場合があります。 バレーボール成年男子 会場へのアクセス・シャトルバス時刻表 【青森代表vs大阪代表】 ◆10月12日(月)15:30～第4試合 ◆新青森県総合運動公園内「マエダアリーナ」（青森市） ※当日は会場に一般駐車場はありません。 ※「浅虫海づり公園」に臨時駐車場を設置。会場との間を30分間隔でシャトルバス『パークアンドライドバス』運行（所要時間約15分） 10月11日(日)～13日(火)のシャトルバス時刻表 青森市ホームページより 10月14日(水)のシャトルバス時刻表 青森市ホームページより 「浅虫海づり公園」のシャトルバス乗降所 「新青森県総合運動公園」シャトルバス乗降所","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3001794?utm_source=lootura.com","publishedAt":"2026-10-10T11:39:45.000Z"},{"title":"金融庁、本人確認のICチップ1本化前倒しを要請 免許証情報漏えいで","summary":"金融庁は9日、不正アクセスによる情報漏えいが相次いでいる問題について、金融機関に対策の強化と注意喚起を呼びかけた。本人確認書類の画像を使った本人確認については前倒しして廃止し、ICチップ情報の読取に一本化することを求めている。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147233.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"【 今後の雨 】11日(日)は沖縄で激しい雨も 13～14日は雨の範囲広がる予測 通勤・通学は雨の時間帯を確認【15日(木)までの雨風シミュレーション・10日午後9時更新】","summary":"11日(日)は東京や大阪などで晴れる一方、沖縄では激しい雨の降る所があり、関東などの海沿いでは高波にも注意が必要です。13～14日は雨の範囲が広がる予測で、来週の通勤・通学も雨の時間帯を確認してください。 11日(日)は東京・大阪などで晴れ 沖縄は激しい雨、奄美は土砂災害に注意 11日(日)は高気圧に覆われ、東京や名古屋、大阪、仙台、新潟などで晴れる予報です。12日(月・祝)も本州付近では晴れ間の出る所が多い見込みです。 一方、沖縄本島の中南部と北部では、11日は昼前から時々雨が降り、夕方は雷を伴って激しく降る所がある予報です。沖縄本島地方は12日も曇りで一時雨となる見込みです。 雨風シミュレーションでは、11日正午は南西諸島や九州の西の海上などに雨のエリアが見られます。夕方には九州の一部にも雨域がかかる予測です。 11日(日)正午の雨風シミュレーション 暖かく湿った空気や上空の寒気の影響で、南西諸島では大気の状態が非常に不安定となる見込みです。奄美地方では11日明け方にかけて土砂災害に十分注意し、11日夜遅くにかけては落雷や竜巻などの激しい突風にも注意してください。 九州では11日にかけて、南西諸島では12日にかけて、落雷や突風などに注意が必要です。外出する方は、行き先や帰る時間帯の雨の予報も確認してください。 13日(火)から雨の範囲広がる予測 14日(水)朝は北日本・北陸などでも雨 13日(火)から15日(木)にかけて、低気圧が日本海からオホーツク海へ進み、前線が北日本から西日本を通過する見込みです。 雨風シミュレーションでは、13日朝は九州北部付近に雨のエリアが見られ、夕方には中国地方や近畿などへ広がる予測です。 13日(火)午後6時の雨風シミュレーション 14日(水)朝は、北海道や東北の日本海側、北陸、近畿などにも雨域がかかる予測です。各地の予報でも、13日は福岡、14日は札幌や仙台、新潟、名古屋、大阪、広島などで雨が降る見込みです。 14日(水)午前6時の雨風シミュレーション 通勤・通学の時間帯に雨が重なる可能性があります。雨の降り始めややむ時間は地域によって異なるため、最新の予報も確認してください。 また、北日本では14日から15日ごろ、低気圧の発達の程度などによっては大荒れとなるおそれがあります。雨だけでなく、風の予報にも注意してください。 15日から16日(金)にかけては、名古屋や大阪、広島などで晴れ間が出る予報です。 台風28号は11日に温帯低気圧へ 29号は小笠原近海を北上する予想 気象庁の10日午後6時45分発表によりますと、台風28号「ノロ」は同日午後6時現在、日本の東をゆっくり北西へ進んでいます。11日(日)午後6時には、日本の東で温帯低気圧に変わる見込みです。 台風28号の進路予想図（10日午後6時の実況に基づく） 一方、気象庁の10日午後7時10分発表によりますと、非常に強い台風29号「コグマ」は同日午後6時現在、南鳥島近海を1時間におよそ20キロの速さで北西へ進んでいます。 11日(日)午後6時も「非常に強い」勢力で小笠原近海を進む予想です。12日(月・祝)午後3時には「強い」勢力となり、13日(火)午後3時には日本の東へ進む見込みです。 台風29号の進路予想図（10日午後6時の実況に基づく） 台風などによるうねりの影響で、東北の太平洋側と南西諸島では11日にかけて、関東甲信では12日にかけて、高波に注意が必要です。海沿いでのレジャーは、晴れていても波の予報を確認してください。 20日(火)までの各地の天気予報 低気圧の発達や前線の位置、台風の進路には予測の幅があり、雨や風の強まる地域・時間帯は変わる可能性があります。 雨風シミュレーションは、実際の雨や風の状況とは異なる場合があり、予測は今後変わる可能性があります。最新の気象情報をご確認ください。 11日(日)の雨風シミュレーション（3時間ごと） 12日(月・祝)の雨風シミュレーション（3時間ごと） 13日(火)の雨風シミュレーション（3時間ごと） 14日(水)の雨風シミュレーション（3時間ごと） 15日(木)の雨風シミュレーション（3時間ごと）","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004403?utm_source=lootura.com","publishedAt":"2026-10-10T11:18:32.000Z"},{"title":"JR東日本、「えきねっと」など206万件漏えいの可能性","summary":"JR東日本は9日、IDCフロンティアで発生した不正アクセスの影響により、「えきねっと」と「大人の休日倶楽部」の会員情報が漏えいした可能性があると発表した。対象はえきねっと会員が最大約167万件、大人の休日倶楽部会員が最大約39万件で、合計最大約206万件に上る。","source":"インプレス","author":"佐々木 翼","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147202.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"法の支配揺らぐ今、届いたピレイ氏の信念 識者に聞く受賞の意味 | 毎日新聞","summary":"2026年のノーベル平和賞受賞が決まった国際司法裁判所（ICJ）元判事のナバネセム・ピレイ氏（85）は、国際刑事裁判所（ICC）などでも裁判官を務めた。米国がICCの赤根智子所長らに制裁を科すなど、世界で法の支配が揺らぐ中での受賞の意味を、国際刑事司法が専門の藤井広重・宇都宮大准教授に聞いた。【片","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261009/k00/00m/030/353000c?utm_source=lootura.com","publishedAt":"2026-10-09T20:30:10.000Z"},{"title":"Claudeに新機能「ダッシュボード」 プレゼン動画「Motion」も","summary":"Anthropicは8日(米国時間)、「Claude」において、データを最新の状態で表示するダッシュボードに変換する「Claude Dashboards」や、プレゼンテーション用のアニメーション解説動画を作成する「Claude Motion」を追加した。","source":"インプレス","author":"臼田勤哉","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147180.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"秋の大空彩る熱気球 岩手・一関でバルーンフェス 11日まで | 毎日新聞","summary":"全国の愛好家らが熱気球の技術を競う「一関・平泉バルーンフェスティバル2026」が9日、岩手県一関市の磐井川河川敷で始まった。この大会は東日本大震災からの復興を祈念して2012年から始まり、15年からは国内最高峰の競技会である「ホンダグランプリ」（年間4戦）の一つとして開催されている。","source":"毎日新聞","author":"","category":"general","url":"https://mainichi.jp/articles/20261009/k00/00m/310/321000c?utm_source=lootura.com","publishedAt":"2026-10-09T20:15:10.000Z"},{"title":"ChatGPT、音声アップロードに対応 文字起こし・要約が可能に","summary":"OpenAIは、ChatGPTで音声ファイルをアップロードし、文字起こしや要約、内容に関する質問などを行なえる機能を提供開始した。有料プランおよびワークスペースで利用できる。","source":"インプレス","author":"浅井 淳志","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2147136.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"【 香取慎吾 】「〝慎吾ちゃんが負けず嫌い〟って嫌じゃない？」と自己分析 パラスポーツの魅力を語る","summary":"歌手でタレントの香取慎吾さんが内閣府「ともともフェスタ2026」にて開催された「香取慎吾 スペシャルトークショー ～パラスポーツの魅力～」に登場。車いすテニスの齋田悟司選手、車いすラグビーの乗松隆由選手とともに競技の魅力を語りました。 左から 香取慎吾さん・齋田悟司選手・乗松隆由選手 「ともともフェスタ2026」イベント会場 「ともともフェスタ2026」は障害のある人とない人が「ともにつくり、ともに楽しみ、交流する」ことを通じて、自然な交流や相互理解を育む共生社会イベント。10月9日、10日の2日間開催され、トーク、音楽、笑い、手話、パラスポーツなど多彩なプログラムが展開されています。 香取慎吾さん 屋外で行われたイベントには開始前から多くのファンが集まりました。黒スーツ姿で登場した香取さんは〝いい天気で、すがすがしく気持ちがいい。1人スーツで来てしまいとっても暑いです〟と挨拶し、会場を笑わせました。 香取慎吾さん 香取さんが最初にパラスポーツに触れるきっかけになったのは2018年の平昌パラリンピック™。アイスホッケーを観戦した時に「怖いと思った」と振り返りました。そして〝ぶつかり合って倒れて、倒れた選手に「何をやっているんだよ！」って声が飛んでいた。（それを見て）「大丈夫なの？」「あぶないよ」というところから始まった〟と回顧。 香取慎吾さん それまで香取さんは車いすを使う人に対して〝ちょっとの段差も「気を付けてくださいね」だと思っていた〟と明かし、実際に競技を見て、〝そうじゃないことを知ってパラスポーツの魅力に引き込まれました〟と考えが大きく変わったと語りました。 香取慎吾さん これまで20種類以上のパラスポーツを体験してきた香取さん。パラスポーツ選手の印象を聞かれると「負けず嫌い」と回答。一方で自身は〝負けず嫌いは全くないね〟と話し、〝「慎吾ちゃんが負けず嫌い」って嫌じゃない？柔らかく明るくなんで。「勝ちにいくぜ」はない。自分との戦い〟と言い切ると、会場から拍手が巻き起こりました。 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004030?utm_source=lootura.com","publishedAt":"2026-10-10T04:14:10.000Z"},{"title":"G-SHOCK、デザイン刷新でMIP液晶になった新型マッドマン","summary":"カシオ計算機は、「G-SHOCK」の新作として、デザインを刷新し新たにMIP液晶を搭載する新型のMUDMAN(マッドマン)、「GDG-B100」シリーズ3機種を10月に発売する。Bluetooth連携が可能な電池駆動のクオーツ式腕時計で、価格は38,500円。","source":"インプレス","author":"太田 亮三","category":"technology","url":"https://www.watch.impress.co.jp/docs/news/2146090.html?utm_source=lootura.com","publishedAt":"2026-10-10T14:13:32.224Z"},{"title":"【台風情報】非常に強い勢力に発達「台風29号（コグマ）」最大瞬間風速60m/s ・中心気圧955hPa…今後の進路、日本への影響は？【気象庁10日10時10分発表】","summary":"「台風29号（コグマ）」 気象庁によりますと非常に強い台風29号は、南鳥島近海を時速25kmの速さで西北西へ進んでいます。 ▶ 【画像】全国の天気予報 ▶ 全国の雨・風シミュレーション 2026年10月10日10時10分発表 10日09時の実況 種別 台風 大きさ - 強さ 非常に強い 存在地域 南鳥島近海 中心位置 北緯21度30分 (21.5度) 東経151度30分 (151.5度) 進行方向、速さ 西北西 25 km/h (14 kt) 中心気圧 955 hPa 中心付近の最大風速 45 m/s (85 kt) 最大瞬間風速 60 m/s (120 kt) 25m/s以上の暴風域 全域 130 km (70 NM) 15m/s以上の強風域 北東側 330 km (180 NM) 南西側 280 km (150 NM) 今後の進路は 10日21時の予報 種別 台風 強さ 非常に強い 存在地域 南鳥島近海 予報円の中心 北緯23度00分 (23.0度) 東経149度35分 (149.6度) 進行方向、速さ 北西 20 km/h (12 kt) 中心気圧 955 hPa 中心付近の最大風速 45 m/s (85 kt) 最大瞬間風速 60 m/s (120 kt) 予報円の半径 55 km (30 NM) 暴風警戒域 全域 185 km (100 NM) 11日09時の予報 種別 台風 強さ 非常に強い 存在地域 南鳥島近海 予報円の中心 北緯24度35分 (24.6度) 東経148度20分 (148.3度) 進行方向、速さ 北西 20 km/h (10 kt) 中心気圧 955 hPa 中心付近の最大風速 45 m/s (85 kt) 最大瞬間風速 60 m/s (120 kt) 予報円の半径 80 km (42 NM) 暴風警戒域 全域 200 km (110 NM) 12日09時の予報 種別 台風 強さ 強い 存在地域 小笠原近海 予報円の中心 北緯27度30分 (27.5度) 東経147度00分 (147.0度) 進行方向、速さ 北北西 15 km/h (8 kt) 中心気圧 960 hPa 中心付近の最大風速 40 m/s (80 kt) 最大瞬間風速 60 m/s (115 kt) 予報円の半径 155 km (85 NM) 暴風警戒域 全域 270 km (145 NM) 13日09時の予報 種別 台風 強さ 強い 存在地域 日本の東 予報円の中心 北緯32度10分 のノーベル平和賞の選考について、「不名誉で恥ずべき決定」などと批判しました。 トランプ大統領 「ノルウェーよ、我々は忘れない。史上最高の実績に対して賞を与えなかったことを。我々は8つの戦争について8つのノーベル賞を受けるべきだった」 トランプ大統領は9日、今年のノーベル平和賞の選考について、「不名誉で恥ずべき決定で、ノルウェーにとって消すことのできない汚点だ」と批判しました。 トランプ氏は、自分自身が平和賞に選ばれるべきだったという認識を示すとともに、ノーベル賞委員会を「一握りの急進的なイデオロギーを持つ人々により永遠に信頼を失った」と批判しました。 一方で、受賞が決まったICC=国際刑事裁判所の元裁判官、ナバネセム・ピレイ氏については「国連で働く誰も知らない人物だ」などと語りました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004024?utm_source=lootura.com","publishedAt":"2026-10-10T03:58:35.000Z"},{"title":"ADHDの人は便秘や過敏性腸症候群などの「腸の問題」を抱えやすいことが約200万人の分析で判明","summary":"注意欠如多動症(ADHD)は不注意や衝動性を特徴とする発達障害であり、世界全体では成人の2～4％がADHDを持っているといわれています。イギリスのウォーリック大学が主導した研究では、ADHDを持つ人は便秘や過敏性腸症候群(IBS)、下痢といった胃腸症状を経験する可能性が著しく高いとの結果が示されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-adhd-higher-odds-gut-problems/?utm_source=lootura.com","publishedAt":"2026-10-10T14:00:00.000Z"},{"title":"【 YOSHIKI 】プライベートジェットでサングラスを外した素顔であくびも「眠たいね… 地上で寝るより空で寝る方が多いような。。。」","summary":"X JAPANのYOSHIKIさんが10月9日、自身の公式インスタグラムを更新。プライベートジェットの機内でリラックスする姿を動画で公開しました。 YOSHIKIさん 公式インスタグラムより 動画はサングラスを外した素顔で、YOSHIKIさんがベッドに横たわる姿から始まります。 YOSHIKIさん 公式インスタグラムより YOSHIKIさんが起き上がると、場所は白を基調としたプライベートジェットの機内であることがわかります。 YOSHIKIさん 公式インスタグラムより リラックスした様子で辺りを見回すと、再びベッドに横になるYOSHIKIさん。 YOSHIKIさん 公式インスタグラムより 「眠たいね... 地上で寝るより空で寝る方が多いような。。。」と綴り、動画にはあくびをする姿も捉えられています。 YOSHIKIさん 公式インスタグラムより YOSHIKIさんはまた「F1 Singapore」のハッシュタグを添えていて、現在開催中の『F1シンガポールグランプリ2026』に向けて現地へ移動中の様子を撮影したもののようです。 YOSHIKIさん 公式インスタグラムより この投稿をみたファンからは「YOSHIKIさんかわぃぃ」「眠そうなYOSHIKIさんも美しい〜」「優しい顔とても素敵ですね」「素敵な動画ありがとう」といった反響が寄せられています。 YOSHIKIさん 公式インスタグラムより 【担当：芸能情報ステーション】","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004020?utm_source=lootura.com","publishedAt":"2026-10-10T03:57:40.000Z"},{"title":"「お前たちのクラウドはわれわれのもの」 IDCFクラウドの管理画面に出た攻撃者のメッセージ 内容に運営元は","summary":"ランサムウェア攻撃を受けた「IDCFクラウド」を巡り、攻撃者を名乗る人物のメッセージが管理コンソールに表示されたとする画像が、10月7日からX上で拡散している。画像には、攻撃者によるものとみられる英語のメッセージや、被害規模を示す具体的な数字が記されている。ITmedia NEWSは、画像の内容について運営元のIDCフロンティアに聞いた。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/09/2000002184/?utm_source=lootura.com","publishedAt":"2026-10-10T03:38:24.000Z"},{"title":"「事件や事故はテレビの中の話だと思っていた」高専女子学生殺害事件から20年 母親が語り続ける命の大切さ","summary":"2006年8月、山口県内の高等専門学校に通っていた中谷歩さん（当時20歳）が、同級生の男子学生に殺害された事件から今年8月で20年がたちました。 母親の中谷加代子さんが9日、山口市で講演し「歩と生きる」と題して、事件が起きるまでの家族との暮らしや娘を突然失った悲しみ、そして今伝えたい思いを語りました。 中谷加代子さん 「家族が笑顔で暮らせている、今が一番幸せよねって、それをつくづく感じていました。事件や事故が起こっても、それはテレビの中の話。私もそう思っていました」 娘の歩さんは、幼いころは怖がりで引っ込み思案だったといいます。 中谷加代子さん 「一歩一歩、自分の道を歩んでいってほしい。そんな願いを込めて歩とつけました。小さい頃の歩は、怖がりで引っ込み思案で、すぐ私の後ろに隠れてしまうような子でした。それがいつの間にか、たくましく大きく成長しまして、工業高等専門学校に通う20歳の学生になっていました」 事件が起きたのは2006年8月28日。この日の朝も夫婦で歩さんを駅まで送りました。 中谷加代子さん 「歩を後ろ姿に、いってらっしゃいって手を振って、歩は元気に出かけていきました」 その日の夕方。職場に戻った中谷さんの机に夫から「歩が学校で倒れた」と書かれたメモが残されていました。 中谷加代子さん 「私は仕方がないから家に帰って、病院に行く支度をして、その間も何回もお父さんに電話するんですけど、なかなか通じなくて。何度目かの電話でやっと通じたんですけど、お父さんが物を言わないんですね」 問い詰めてようやく返ってきた言葉は、「歩が死んだ」 中谷加代子さん 「お父さん、何を言うんだろうかと思いました」 歩さんと対面したのは、その日の夜でした。 中谷加代子さん 「その瞬間まで、どうか別の人であってって祈ってました。でも、そこには別の人じゃなくて、歩がいました。起こそうと思って、『あっちゃん起きな、あっちゃん早く起きて、もう起きる時間なんだけ、あっちゃん起きなね』何度も呼んでも呼んでも、歩は目を覚まさなくて。ただただほっぺたを触った。柔らかかった」 歩さんを殺害したのは、同じクラス、同じゼミの当時19歳の男子学生でした。事件後、男子学生は行方が分からなくなりました。 中谷加代子さん 「どうして歩を殺したのか、それが聞きたくて、容疑者には一刻も早く捕まってほしかった」 しかし事件から11日目。男子学生は山中で死亡しているのが見つかりました。 中谷加代子さん 「その連絡をもらって、もうこれでね、彼の口から、もう聞けんなった、言い訳も聞けんなった、そう思ったら力が抜けていきました。生きて本当のことを話してほしい。罪を償ってほしい。そしたら少しは歩の供養になるかもしれん。そう思ってた私たちの願いも叶わなくなりました」 歩さんを失った現実は、簡単に受け入れられるものではありませんでした。 中谷加代子さん 「今でもね、玄関に『ただいま』って帰ってくるような気がする。髪の毛の長い女の子が自転車で行ってたら、『あれ、今の歩じゃなかった』って覗き込んでしまう」 歩さんは卒業後、熊本の大学への編入が決まっていて、建築士を目指していました。 中谷加代子さん 「将来、自分で設計した家に住んでみたい、そんなことを言ってました」 歩さんが生きていれば今年で40歳。 中谷加代子さん 「歩の友達が結婚することになりました。歩宛ての招待状を持って、うちに報告に来てくれます。赤ちゃんが生まれたら連れてきてくれる。私に抱かせてくれるんです」 友人たちが成長し、それぞれの人生を歩んでいく一方で。 中谷加代子さん 「私の心の中の歩は、今でもずっと20歳の学生のまま。この写真の中の歩のままです」 事件から20年。中谷さんは今もなぜ事件が起きたのかを考え続けています。 中谷加代子さん 「私にとって、娘を亡くした事件のことを考えるというのは、決して楽しいことではありません。でもこれが逆に頭から離れてしまうということもないんです。私は事件の当初から、なんでこの事件が起きたのか、それをずっと考えてきました」 そして、考え続ける中で強く感じるようになったことがあります。 中谷加代子さん 「彼（少年）が本当の意味で、自分の人生を生きるということをもっと真剣に考えていてくれたら、相手のこと、周りの人のこと、これをもっと大切に思っていてくれたら、そしたらきっと事件は起きなかったよね。そういうことです」 中谷さんは10年以上前から県内外の学校や矯正施設などで、生きることについて考えてもらおうと、講演を続けています。 中谷加代子さん 「生きることを真剣に考えてほしい。相手のことも大切に思ってほしい。そして家族のことを悲しませないでほしい。命の教育がもっとされていたら、歩は今でも生きていたのかもしれない」 中谷さんの言葉には、失われた命への深い思いと、同じ悲しみを繰り返してほしくないという願いが込められています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004010?utm_source=lootura.com","publishedAt":"2026-10-10T03:54:52.000Z"},{"title":"日本人の大腸がん、約半数に“腸内細菌の毒素”が関与 40歳以下の発症は7割 東大・阪大が200人を全ゲノム解析","summary":"東京大学医科学研究所、大阪大学、国立がん研究センター、東京科学大学に所属する研究者らが科学誌「Nature Genetics」で発表した論文「Prevalence and chronology of colibactin-associated mutational processes and their microbiome spectra in Japanese colorectal cancer」は、日本人の大腸がん発症に特定の腸内細菌が関与していることを突き止めた研究報告だ。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002035/?utm_source=lootura.com","publishedAt":"2026-10-10T03:00:00.000Z"},{"title":"ローイング世界大会出場のトップ選手が指導 網走で高校生ら20人が効率的な漕ぎ方学ぶ","summary":"水上の直線コースでオールを使ってボートを漕ぎ、順位を競うスポーツ「ローイング」の選手が網走の高校生らを指導しました。 指導にあたったのは、世界大会でも活躍する「NTT東日本 漕艇部」の選手たちで、道内の大学生や地元の高校生らあわせて20人ほどが、効率的な漕ぎ方などの技術指導を受けました。 NTT東日本 漕艇部 櫻間達也キャプテン「北海道の高校生たちにボートの魅力を伝えて、楽しさを味わってもらえれば」 また、マシンを使い上体の動かし方なども丁寧に教わりました。 参加した高校生「指導を受けて動きが滑らかに楽になった」 主催した網走市やNTT東日本などは「スポーツを通じた地域活性化や青少年育成につなげたい」としています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004015?utm_source=lootura.com","publishedAt":"2026-10-10T03:51:39.000Z"},{"title":"「男は狩り、女は採集」はどこまで本当？ 約8割で女性も狩り、乳児連れの例も 過去100年の狩猟採集社会を調査","summary":"米シアトル・パシフィック大学などに所属する研究者らが2023年に学術誌「PLOS ONE」で発表した論文「The Myth of Man the Hunter: Women’s contribution to the hunt across ethnographic contexts」は、世界の狩猟採集社会における女性の狩猟活動の実態を調査した研究報告だ。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002038/?utm_source=lootura.com","publishedAt":"2026-10-10T03:00:00.000Z"},{"title":"「秋の高山祭」２日目「曳き揃え」が行われる 絢爛豪華な祭り屋台が街をめぐる 初日は約12万5千人が訪れる 岐阜県高山市","summary":"岐阜県高山市で、9日（金）から始まった「秋の高山祭」。2日目の10日（土）は、屋台が勢揃いする「曳き揃え」などが行われました。 初日は、約12万5千人が訪れた秋の高山祭。2日目は、神様を乗せたみこしが市街地をめぐる「御神幸」から始まりました。 その後、10台の屋台が美しい装飾を揺らしながら古い町並みを進むと、絢爛豪華な祭り屋台が、櫻山八幡宮の参道に曳き揃えられました。訪れた観光客は、きらびやかな装飾に魅了されていました。 （観客）「すごくきらびやか。祭り囃子が心地よくて感動した」 （海外からの観光客）「ユニークで特別感があった」 境内では10日（土）午前11時から布袋台によるからくり奉納が行われ、午後1時から再び行われる予定です。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003924?utm_source=lootura.com","publishedAt":"2026-10-10T03:41:20.000Z"},{"title":"「コミューン」不正アクセスでLINEヤフー、Sansan、パナソニックでも会員情報漏えいの可能性","summary":"情報漏えいの公表が相次ぐ中、委託先の外部サービスが攻撃を受けて情報が流出するケースも目立ってきている。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002190/?utm_source=lootura.com","publishedAt":"2026-10-10T00:02:14.000Z"},{"title":"【3連休の天気】広く秋晴れが続き行楽日和、洗濯日和に きょう10日は関東から西など30℃に迫る暑さの所も 寒暖差に注意","summary":"日本付近は高気圧に覆われて、広く秋晴れとなるでしょう。ただ、九州から南西諸島や北海道は雨が降りやすく、特に九州から沖縄は激しい雷雨になるおそれがあります。 また、台風の影響により、太平洋側では波が高くなるでしょう。晴れていても、海のレジャーにお気をつけください。 最高気温は、きのうと同じくらいの所が多く、関東から西では25℃以上の所がほとんどでしょう。30℃に迫る暑さとなる所もあり、日中は半袖の出番となりそうです。 ＜きょう10日（土）の各地の予想最高気温＞ 札幌：24℃ 釧路：20℃ 青森：23℃ 盛岡：24℃ 仙台：24℃ 新潟：26℃ 長野：26℃ 金沢：27℃ 東京：27℃ 名古屋：28℃ 大阪：29℃ 岡山：28℃ 広島：28℃ 松江：29℃ 高知：28℃ 福岡：27℃ 鹿児島：28℃ 那覇：30℃ あす、あさっても日本付近は高気圧に覆われて、3連休は行楽日和、洗濯日和となるでしょう。火曜日から水曜日にかけては、各地曇りや雨の予想です。 最高気温は関東から西で25℃以上の所が多く、平年を上回る暖かさとなるでしょう。一日の寒暖差が大きくなりますので、服装選びや体調管理にお気をつけください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3004008?utm_source=lootura.com","publishedAt":"2026-10-10T03:39:12.000Z"},{"title":"世界で発生するがん症例全体の約12％は感染症が原因である可能性が高いことがWHOの研究で示される","summary":"がん治療に特化した医学専門誌のThe Lancet Oncologyで2026年9月末に世界保健機関(WHO)が発表した研究では、2024年に世界で発生したがん症例のうち、約12％は感染症が原因である可能性が高いことが示されました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-cancers-infection/?utm_source=lootura.com","publishedAt":"2026-10-10T10:00:00.000Z"},{"title":"三重の伝統工芸が学べる体験型イベント 江戸時代から続く「日永うちわ」づくりに子どもら笑顔 三重・四日市市","summary":"三重県の伝統工芸が学べる体験型のイベントが三重県四日市市で行われました。 これは、三重県の伝統工芸を通じて地域産業を広く知ってもらおうと県と大手食品メーカー「味の素」が開催したものです。参加者は江戸時代から続く日永うちわ作りや松阪木綿を使ったコサージュ作りなどを体験しました。 （男の子） 「楽しかった」 （女の子） 「とてもうれしくてかわいいし最高です」 ことしは三重県誕生150周年にあたることから「先人たちが築いた歴史を次世代につなげていきたい」としています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003886?utm_source=lootura.com","publishedAt":"2026-10-10T03:38:52.000Z"},{"title":"OpenAI、安全性研究者3人を解雇 本人らは「安全性を優先したため」と主張、同社は「機密情報の扱いに関する規定違反」と説明","summary":"OpenAIで安全性研究に携わっていた研究者3人が、突然解雇されたと公表し、書面での理由開示や外部監査の受け入れ維持を求める書簡を公開した。これに対しOpenAIは、機密情報規定への重大な違反が社内調査で判明したためと説明し、安全性の懸念表明を理由とした解雇ではないと反論している。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002189/?utm_source=lootura.com","publishedAt":"2026-10-09T23:28:02.000Z"},{"title":"【37年の歴史に幕】日本一遅い列車 くしろ湿原ノロッコ号がラストラン 北海道","summary":"「日本一遅い列車」として親しまれた北海道の観光列車「くしろ湿原ノロッコ号」が、きょう（10月10日）、37年の歴史に幕を下ろします。 くしろ湿原ノロッコ号 釧路駅・10月10日午前11時 ノロノロ走るトロッコ列車にちなんで名付けられた「くしろ湿原ノロッコ号」。 1989年の運行開始以来、釧網線（せんもうせん）ならではの北海道の雄大な自然を五感で味わう開放感を魅力に「日本一遅い列車」として愛されてきました。 しかし、車両の老朽化できょう（10月10日）、ラストランを迎えることとなりました。 埼玉から来た鉄道ファン 埼玉から来た鉄道ファン「たぶん10回以上は乗った。釧路湿原ノロッコの思い出を少しでも多く作って、自分の中でいつまでもノロッコを走らせたい」 「ノロッコ号」は午後1時すぎに釧路駅に戻り歴史に幕を下ろします。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003918?utm_source=lootura.com","publishedAt":"2026-10-10T03:33:02.000Z"},{"title":"ココナラ、会員の履歴書など2294件漏えい スキルマーケットに不正アクセス","summary":"「ココナラスキルマーケット」が第三者による不正アクセスを受け、会員の履歴書449件と、職務経歴書関連書類1845件が流出したと発表した。","source":"アイティメディア","author":"岡田有花","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002188/?utm_source=lootura.com","publishedAt":"2026-10-09T23:13:39.000Z"},{"title":"熊本県で最大震度1の地震 熊本県・水俣市","summary":"10日午前4時27分ごろ、熊本県で最大震度1を観測する地震がありました。 気象庁によりますと、震源地は熊本県天草・芦北地方で、震源の深さはごく浅い、地震の規模を示すマグニチュードは1.8と推定されます。 この地震による津波の心配はありません。 最大震度1を観測したのは、熊本県の水俣市です。 【各地の震度詳細】 ■震度1 □熊本県 水俣市 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003685?utm_source=lootura.com","publishedAt":"2026-10-09T19:31:21.000Z"},{"title":"IDCFクラウド障害、親会社のソフトバンクが顧客窓口に 調査・復旧も支援","summary":"フトバンクとの緊密な連携の下、（1）顧客へのバックアップ手順の案内と移行環境の提案、（2）顧客の要望に従って、顧客の仮想サーバの起動や停止などの作業の代行――を行っているという。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002187/?utm_source=lootura.com","publishedAt":"2026-10-09T22:49:06.000Z"},{"title":"【速報】パナマでマグニチュード7.7の地震 日本沿岸では若干の海面変動が起きる可能性があるものの被害の心配なし","summary":"中米パナマでマグニチュード7.7の大地震がありました。 USGS＝アメリカ地質調査所によりますと、中米パナマで日本時間10日午前3時ごろ（現地時間9日午後1時ごろ）、マグニチュード7.7の地震が発生しました。 震源はパナマ南部で、震源から離れた首都パナマシティなどでも建物が揺れ、避難する人の姿などがSNSに投稿されています。 アメリカの太平洋津波警報センターは「津波のおそれがある」として周辺の国に注意を呼びかけています。 また、日本の気象庁は、この地震により、日本の沿岸では若干の海面変動が起きる可能性があるものの、被害の心配はないとしています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003684?utm_source=lootura.com","publishedAt":"2026-10-09T19:11:22.000Z"},{"title":"「バイトル」会員メアド最大約389万件漏えい 海外から「仕様不備」突く不正アクセス","summary":"原因は、システムの一部機能の仕様の不備を突いた海外からの不正アクセス。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002186/?utm_source=lootura.com","publishedAt":"2026-10-09T22:27:31.000Z"},{"title":"【津波予報】被害の心配なし 北海道太平洋沿岸東部、北海道太平洋沿岸中部など 03:37時点","summary":"気象庁は10日午前3時37分に津波予報（若干の海面変動）を発表しました。 気象庁によりますと、10日午前2時56分に中米を震源とする強い地震が起きました。震源の深さは不明です。地震の規模を示すマグニチュードは8と推定されます。 津波予報（若干の海面変動）が発表された地域は、北海道太平洋沿岸東部・北海道太平洋沿岸中部・北海道太平洋沿岸西部・青森県太平洋沿岸・岩手県などです。 若干の海面変動が予想されますが、被害の心配はありません。 ◆気象庁からのお知らせ 若干の海面変動が予想される時刻は、早い沿岸で１０日２０時００分頃です。 これらの沿岸では今後１日程度は若干の海面変動が継続する可能性が高いと考えられます。 ◆津波予報（若干の海面変動）が発表されている全地域 ・北海道太平洋沿岸東部 ・北海道太平洋沿岸中部 ・北海道太平洋沿岸西部 ・青森県太平洋沿岸 ・岩手県 ・宮城県 ・福島県 ・茨城県 ・千葉県九十九里・外房 ・千葉県内房 ・伊豆諸島 ・小笠原諸島 ・相模湾・三浦半島 ・静岡県 ・愛知県外海 ・伊勢・三河湾 ・三重県南部 ・和歌山県 ・徳島県 ・愛媛県宇和海沿岸 ・高知県 ・宮崎県 ・鹿児島県東部 ・種子島・屋久島地方 ・奄美群島・トカラ列島 ・沖縄本島地方 ・大東島地方 ・宮古島・八重山地方 ◆津波情報について 「津波予報(若干の海面変動)」が発表された場合 津波予報(若干の海面変動)は、津波による災害が起こるおそれがない場合に発表されます。若干の海面変動が予想されますが、被害の心配はありません。海に入っての作業や釣り、海水浴などに際しては十分な留意が必要です。 この津波予報に関する情報は11日午後8時00分まで有効です。 今後の情報にご留意ください。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003682?utm_source=lootura.com","publishedAt":"2026-10-09T18:39:27.000Z"},{"title":"JR九州、会員メアド最大130万件漏えいか IDCF不正アクセスの影響","summary":"会員向けのメール配信用の外部サービスも一部使えなくなっており、メールマガジンが配信できない状態だ。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/10/2000002185/?utm_source=lootura.com","publishedAt":"2026-10-09T22:09:36.000Z"},{"title":"和歌山県で最大震度2の地震 和歌山県・御坊市","summary":"10日午前3時26分ごろ、和歌山県で最大震度2を観測する地震がありました。 気象庁によりますと、震源地は和歌山県北部で、震源の深さはおよそ10km、地震の規模を示すマグニチュードは3.0と推定されます。 この地震による津波の心配はありません。 最大震度2を観測したのは、和歌山県の御坊市です。 【各地の震度詳細】 ■震度2 □和歌山県 御坊市 ■震度1 □和歌山県 湯浅町 日高川町 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003679?utm_source=lootura.com","publishedAt":"2026-10-09T18:30:45.000Z"},{"title":"IDCFクラウド障害、顧客データ「取り出し・復元困難」 復元は顧客側のバックアップ頼み","summary":"「データを復元できるのは顧客自身が保持しているバックアップデータからのみ」としている。","source":"アイティメディア","author":"","category":"technology","url":"https://www.itmedia.co.jp/news/article/2610/09/2000002147/?utm_source=lootura.com","publishedAt":"2026-10-09T21:56:46.000Z"},{"title":"岩手県、宮城県で最大震度1の地震 岩手県・一関市、宮城県・登米市、涌谷町、石巻市、大衡村","summary":"10日午前3時4分ごろ、岩手県、宮城県で最大震度1を観測する地震がありました。 気象庁によりますと、震源地は宮城県沖で、震源の深さはおよそ60km、地震の規模を示すマグニチュードは3.6と推定されます。 この地震による津波の心配はありません。 最大震度1を観測したのは、岩手県の一関市、宮城県の登米市、涌谷町、石巻市、それに大衡村です。 【各地の震度詳細】 ■震度1 □岩手県 一関市 □宮城県 登米市 涌谷町 石巻市 大衡村 気象庁の発表に基づき、地域ごとに震度情報をお伝えしています。 新たな情報が発表され次第、情報を更新します。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003677?utm_source=lootura.com","publishedAt":"2026-10-09T18:08:22.000Z"},{"title":"25倍ズームで遠くまで大きく写せるソニー製デジカメ「RX10 V」を使って動物や食べ物を撮影してみた作例はこんな感じ、スマホのAIズームとは別格の出来栄え","summary":"「RX10 V(DSC-RX10M5)」は2026年7月31日に登場したソニー製レンズ一体型カメラで、35mm判換算で24mm～600mmの25倍ズームレンズを搭載しており遠くの被写体を大きく写すことができます。そんなRX10 Vをソニーから借りられたので、実際に動物園や飲食店でいろいろ撮影して「どれだけズームできるのか？」「卓上の食べ物などの近くの被写体は撮影できるのか？」といった疑問点を検証してみました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-sony-rx10-v-photo-example/?utm_source=lootura.com","publishedAt":"2026-10-10T06:00:00.000Z"},{"title":"ピレイ氏のノーベル平和賞選出にイスラエルは猛反発","summary":"ICC＝国際刑事裁判所の裁判官などを務めたナバネセム・ピレイ氏が今年のノーベル平和賞に選ばれたことに対し、ピレイ氏からパレスチナ自治区ガザへの攻撃などをめぐり、厳しい批判を受けてきたイスラエルは猛反発しています。 イスラエル首相府は9日、声明を出し、ノーベル委員会は「道徳的な羅針盤を失った」と非難。ピレイ氏について、「イスラエルに対する虚偽の中傷を広めることでキャリアを築いてきた人物だ」と主張しました。 さらに、イスラエルのネタニヤフ首相らに逮捕状を出したICC＝国際刑事裁判所のカーン主任検察官をめぐっても、ピレイ氏が広めた虚偽の情報を利用し、イスラエルに対する根拠のない訴追を進めたとしています。 そのうえで、今回の授賞は「ユダヤ人への敵意や司法のゆがみを助長する人物をたたえるものだ」と強い言葉で批判しました。 ピレイ氏は、国連人権理事会の独立調査委員会で委員長を務めていた去年9月、イスラエルによるガザでの軍事行動について、「ジェノサイド＝大量虐殺」にあたると結論づける報告書を発表していました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003676?utm_source=lootura.com","publishedAt":"2026-10-09T17:44:24.000Z"},{"title":"病院の給水システムが原因で患者40人が細菌に感染","summary":"イギリス・ケンブリッジのロイヤル・パプワース病院では、2019年から院内の給水システムを感染源とする細菌の集団感染が起きていました。この集団感染を調査したイギリス保健安全保障庁などの研究チームが2026年9月29日に発表した論文によると、院内の水から見つかった菌と同じ系統の菌が患者40人から検出されたとのことです。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-hospital-water-bacterial-infections/?utm_source=lootura.com","publishedAt":"2026-10-10T05:00:00.000Z"},{"title":"【速報】高市総理 トランプ政権によるICCへの制裁決定に「深く懸念」","summary":"高市総理は今夜、アメリカのトランプ政権がICC＝国際刑事裁判所への制裁を決めたことを受けて、自身のXを更新し「日本の立場と相容れるものではなく深く懸念している」と投稿しました。 その上で、「アメリカに対して働きかけを続けるとともに、ICCの赤根所長や関係国との意思疎通も継続しつつ、ICCが本来の役割と機能を果たせるよう必要な支援を行っていく」と述べました。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003619?utm_source=lootura.com","publishedAt":"2026-10-09T14:49:21.000Z"},{"title":"Google Chrome、同意なしで4GBのローカルAIモデルをダウンロードさせている | ギズモード・ジャパン","summary":"Google Chromeが無断で4GBのAIモデル「Gemini Nano」をデバイスに保存していたことが判明。その目的や実力を検証します。","source":"ギズモード・ジャパン","author":"mayumine","category":"technology","url":"https://www.gizmodo.jp/article/2610-google-chrome-gemini-nano-4gb-model/?utm_source=lootura.com","publishedAt":"2026-10-10T14:00:00.000Z"},{"title":"【速報】アメリカ・トランプ政権 ICC（国際刑事裁判所）本体を制裁対象に指定","summary":"アメリカのトランプ政権は、ICC＝国際刑事裁判所の組織本体を正式な制裁対象に指定したと発表しました。 ルビオ国務長官は声明で、「トランプ大統領はICCがアメリカ人を訴追することを決して容認しない。我々はこの“ならず者”裁判所との取引を禁止し、その資金源を断ち、活動能力を麻痺させる」としています。 トランプ政権は戦争犯罪の捜査などをめぐって対立するICCの「解体」を公言していて、8月には赤根智子所長らに対し、アメリカ国内での資産を凍結するなどの制裁を科すと発表しています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003621?utm_source=lootura.com","publishedAt":"2026-10-09T14:47:23.000Z"},{"title":"このビジュは卑怯だ。普通免許で乗れる大人の「仕事ときどき遊び」トラック","summary":"いわば「ワイルド系エルフ」。普通免許で乗れるいすゞのトラック「ELFmio」のカスタムモデルは、様々なツールを取り付けられるフレームを搭載。平日は仕事の相棒に、休日はキャンプやアウトドアの基地になる、最強の2Wayカーとしてのポテンシャルを秘めています。","source":"ギズモード・ジャパン","author":"小暮ひさのり","category":"technology","url":"https://www.gizmodo.jp/article/2610-elfmio-cross-style/?utm_source=lootura.com","publishedAt":"2026-10-10T13:30:00.000Z"},{"title":"大相撲 来年6月にバンコク公演「伝統文化を披露したい」","summary":"大相撲の海外公演が来年6月にタイのバンコクで開催されることになりました。日本相撲協会は、タイの人々に「伝統文化を披露したい」としています。 タイの外務省では9日、大相撲バンコク公演の記者発表が行われ、現役の力士2人が四股踏みやぶつかり稽古を披露しました。 バンコク公演は、来年6月11日から13日まで、中心部にある商業施設で開催され、海外公演としてはロンドン・パリに次いで3年連続となります。 主催者によりますと、70人の力士が参加し、3日間でのべ1万7400人の動員を見込んでいるということです。 日本相撲協会 八角信芳 理事長 「日本と同じように伝統文化を披露したいと思っています。土俵上の力士のあたり合いを見てほしいと思っています」 バンコク公演は日本とタイの修好140周年を記念したもので、現地の学生との交流イベントなども予定されています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003617?utm_source=lootura.com","publishedAt":"2026-10-09T14:39:25.000Z"},{"title":"無料でOpenStreetMapにスマホから店舗や施設を追加できる「Every Door」","summary":"「Every Door」はOpenStreetMap(OSM)のPOI(Point of Interest)・建物・入口(entrances)の編集に特化したOSMモバイルエディタです。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-every-door/?utm_source=lootura.com","publishedAt":"2026-10-10T03:00:00.000Z"},{"title":"特殊詐欺の被害額が過去最多ペースで増加「警察などに確認して」羽田空港で特殊詐欺の被害防止キャンペーン 警視庁・日本航空・東京空港防犯協会が合同実施","summary":"特殊詐欺の被害額が過去最多のペースで増えていることを受け、警視庁の警察官らがきょう、羽田空港の利用者に特殊詐欺に巻き込まれないよう注意を呼びかけました。 警視庁によりますと、今年1月から8月までの都内の特殊詐欺の被害額はおよそ485億円にのぼり、すでに去年1年間の被害額を超え、過去最多のペースで増えています。 特殊詐欺の被害を少しでも減らそうと、警視庁東京空港署や日本航空、東京空港防犯協会がきょう、羽田空港の利用者に特殊詐欺への注意を呼びかけるキャンペーンを実施。 特殊詐欺に関わることの多い闇バイトの応募者が海外に渡航することを防ぐため、警察官たちが注意喚起のチラシなどを搭乗ゲートで配りました。 警視庁は、「公的機関や警察を名乗る電話も多いが、かかってきても一旦切って、警察などに確認をしてほしい」と呼びかけています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003618?utm_source=lootura.com","publishedAt":"2026-10-09T14:37:23.000Z"},{"title":"iPhone Duoで注目度アップの折りたたみスマホ。僕が横開きを選ばない理由","summary":"折りたたみはコンパクトさを重視。iPhone Duoが発売され注目度が上昇中の折りたたみスマホですが、製品発表の映像を見て思ったのが「折りたたむなら、もっと小さくなってほしい」ということでした。開くとタブレットのように使える横開きのメリット…","source":"ギズモード・ジャパン","author":"奥旅男","category":"technology","url":"https://www.gizmodo.jp/article/motorola_razr-60_review/?utm_source=lootura.com","publishedAt":"2026-10-10T11:00:00.000Z"},{"title":"【速報】「バイトル」など運営の「ディップ」 最大388万件あまりの会員メールアドレス流出のおそれ","summary":"求人情報サイトの「バイトル」や「バイトルNEXT」などを運営する「ディップ」は、不正アクセスにより会員のメールアドレスが最大388万件あまり流出したおそれがあると発表しました。 現時点でメールアドレス以外の住所や電話番号といった個人情報の流出は確認されていないということです。 原因は「システムの一部機能における仕様の不備を突いた、海外からの不正アクセスによるもの」としています。 「ディップ」は今後、不審なメールなどが送られてくる可能性があるとして、身に覚えのないリンクや添付ファイルは開かないよう注意を呼びかけています。","source":"TBSニュース","author":"","category":"general","url":"https://newsdig.tbs.co.jp/articles/-/3003602?utm_source=lootura.com","publishedAt":"2026-10-09T14:21:28.000Z"},{"title":"2026年第3四半期のPC出荷台数は前年比で20.1％も減少","summary":"市場調査企業のIDCが、2026年第3四半期(7～9月)の全世界PC出荷台数が前年同期比で20.1％減の6270万台となったことを報告しました。 続きを読む...","source":"ギガジン","author":"","category":"technology","url":"https://gigazine.net/news/20261010-pc-market-shipments-fall-20-q3-2026/?utm_source=lootura.com","publish 			sessionStorage.setItem(sessionKey, 'true');
			window.umami.track?.('App context', context);
		}
	};

	const lockPortraitOrientation = async () => {
		const orientationApi = screen.orientation;
		if (!isLooturaPwaRuntime() || !orientationApi?.lock) return;

		try {
			await orientationApi.lock('portrait-primary');
		} catch {
			// iOS Safari and some browsers ignore orientation lock for web apps.
		}
	};

	const enforcePortraitOrientation = () => {
		lockPortraitOrientation();

		window.addEventListener('focus', lockPortraitOrientation);
		window.addEventListener('pageshow', lockPortraitOrientation);
		window.addEventListener('orientationchange', lockPortraitOrientation);
		screen.orientation?.addEventListener?.('change', lockPortraitOrientation);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') lockPortraitOrientation();
		});
	};

	if (!isProduction && 'serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistrations?.().then((registrations) => {
			registrations.forEach((registration) => registration.unregister());
		});
	}

	if (isProduction && 'serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			const reloadForUpdate = () => {
				if (isReloadingForUpdate) return;
				isReloadingForUpdate = true;
				window.location.reload();
			};
			const checkPublishedBuild = async () => {
				try {
					const response = await fetch(`${baseUrl}app-build.json?ts=${Date.now()}`, {
						cache: 'no-store',
						headers: { accept: 'application/json' },
					});
					if (!response.ok) return;
					const publishedBuild = await response.json();
					const publishedBuildId = getBuildId(publishedBuild);
					if (!publishedBuildId || publishedBuildId === currentBuildId) return;
					maybeShowReleaseUpdateNotice(publishedBuild);
				} catch {
					// Update checks should never block normal reading.
				}
			};

			navigator.serviceWorker.addEventListener('controllerchange', reloadForUpdate);

			navigator.serviceWorker
				.register(`${baseUrl}sw.js`, { updateViaCache: 'none' })
				.then((registration) => {
					const checkForUpdates = () => registration.update().catch(() => {});

					checkForUpdates();
					checkPublishedBuild();
					window.setInterval(checkForUpdates, 60_000);
					window.setInterval(checkPublishedBuild, 60_000);
					window.addEventListener('focus', checkForUpdates);
					window.addEventListener('focus', checkPublishedBuild);
					document.addEventListener('visibilitychange', () => {
						if (document.visibilityState === 'visible') {
							checkForUpdates();
							checkPublishedBuild();
						}
					});
				})
				.catch(() => {});
		});
	}

	window.addEventListener('load', () => {
		trackLooturaContext();
		enforcePortraitOrientation();
		window.setTimeout(() => maybeShowReleaseNotice(), 250);
	});
})();</script></body></html>
